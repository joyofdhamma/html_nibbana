<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>LightReader — Enhanced PDF Reader</title>
  <style>
    :root{--bg:#0f1114;--panel:#111317;--text:#e6e6e6;--muted:#9aa0a6}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,'Noto Sans',sans-serif}
    .app{display:flex;flex-direction:column;height:100vh}
    header{display:flex;align-items:center;gap:.6rem;padding:.6rem;border-bottom:1px solid #151618;background:linear-gradient(180deg,rgba(255,255,255,0.015),transparent)}
    header .title{font-weight:600;font-size:1rem}
    header .controls{margin-left:auto;display:flex;gap:.4rem;align-items:center}
    button, input[type=file]{appearance:none;border:0;background:transparent;color:var(--text);padding:.45rem .6rem;border-radius:.5rem}
    button.icon{background:rgba(255,255,255,0.02)}
    main{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
    #viewer{max-width:100%;max-height:100%;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
    canvas{max-width:100%;max-height:100%;height:auto;width:auto;touch-action:none}
    .pager{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;background:rgba(0,0,0,0.4);backdrop-filter:blur(4px);padding:.35rem .6rem;border-radius:999px;font-size:.95rem}
    .toolbar{position:fixed;right:8px;top:70px;display:flex;flex-direction:column;gap:.35rem;z-index: 200;background: rgba(0, 0, 0, 0.6);border-radius: 8px; padding: 6px;backdrop-filter: blur(3px);}
    .note{font-size:.8rem;color:var(--muted);padding:.5rem;text-align:center}
    .small{font-size:.85rem;color:var(--muted)}
    
    /* Full-width magnifier styles */
    #magnifier-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60vh;
      pointer-events: none;
      display: none;
      z-index: 1000;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(2px);
    }
    #magnifier {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #magnifier-canvas {
      width: 100%;
      height: 100%;
      image-rendering: crisp-edges;
    }
    .magnifier-controls {
      position: absolute;
      top: -40px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 5px;
      background: rgba(0,0,0,0.7);
      border-radius: 6px 6px 0 0;
      padding: 8px 5px;
      pointer-events: auto;
    }
    .magnifier-controls button {
      background: rgba(255,255,255,0.2);
      color: white;
      border-radius: 4px;
      padding: 5px 10px;
      font-size: 14px;
      border: none;
    }
    .magnifier-controls button.active {
      background: rgba(255,255,255,0.4);
    }
    
    /* Tap zones for page turning */
    .tap-zone {
      position: absolute;
      top: 0;
      height: 100%;
      width: 30%;
      z-index: 100;
    }
    #left-tap-zone {
      left: 0;
    }
    #right-tap-zone {
      right: 0;
    }
    
    /* Fullscreen styles */
    .fullscreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      background: var(--bg);
    }
    .fullscreen header {
      display: none;
    }
    .fullscreen .note {
      display: none;
    }
    .fullscreen #viewer {
      height: 100vh;
    }
  /* Inverted PDF colors */
  .inverted canvas {
  filter: invert(1) hue-rotate(180deg);
  }

  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title">LightReader</div>
      <div class="controls">
        <label title="Upload PDF" class="icon" style="cursor:pointer;display:inline-flex;align-items:center">
          <input id="fileInput" type="file" accept="application/pdf" style="display:none">
          📁 <span style="margin-left:.45rem">Open</span>
        </label>
        <button id="openLast" class="icon" title="Open last file data">⤴︎ Last</button>
        <div style="width:1px;background:#222;margin:0 6px;height:28px"></div>
        <div id="fileName" class="small">No file</div>
      </div>
    </header>

    <main>
      <div id="viewer">
        <canvas id="pdfCanvas"></canvas>
        <!-- Tap zones for page turning -->
        <div class="tap-zone" id="left-tap-zone"></div>
        <div class="tap-zone" id="right-tap-zone"></div>
      </div>
      
      <div id="magnifier-container">
        <div class="magnifier-controls">
          <button id="magZoomIn">Zoom+</button>
          <button id="magZoomOut">Zoom-</button>
          <button id="magContrast">Contrast</button>
          <button id="magInvert">Invert</button>
          <button id="magClose">Close</button>
        </div>
        <div id="magnifier">
          <canvas id="magnifier-canvas"></canvas>
        </div>
      </div>

      <div class="toolbar" aria-hidden="false">
 <button id="toggleLens" class="icon" title="Toggle reading pane">🔍</button>       
 <button id="zoomIn" class="icon" title="Zoom in">＋</button>
        <button id="zoomOut" class="icon" title="Zoom out">－</button>
        <button id="fitWidth" class="icon" title="Fit width">↔</button>
        <button id="toggleFullscreen" class="icon" title="Toggle fullscreen">⛶</button>
        <button id="toggleOrientation" class="icon" title="Toggle orientation">🔄</button>
        <button id="toggleOCR" class="icon" title="Enable OCR (optional)">OCR</button>
        <button id="invertPage" class="icon" title="Invert page colors">🌙</button>
      </div>

      <div class="pager" id="pager">—</div>
    </main>
    <div class="note">Tip: pinch to zoom, double-tap to toggle zoom. OCR is optional and CPU-heavy on mobile.</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.0.2/dist/tesseract.min.js"></script>

  <script>
    // Enhanced PDF reader with tap-to-turn navigation
    const fileInput = document.getElementById('fileInput');
    const canvas = document.getElementById('pdfCanvas');
    const ctx = canvas.getContext('2d');
    const pager = document.getElementById('pager');
    const fileNameEl = document.getElementById('fileName');
    const zoomIn = document.getElementById('zoomIn');
    const zoomOut = document.getElementById('zoomOut');
    const fitWidthBtn = document.getElementById('fitWidth');
    const toggleOCR = document.getElementById('toggleOCR');
    const openLastBtn = document.getElementById('openLast');
    const toggleFullscreen = document.getElementById('toggleFullscreen');
    const toggleOrientation = document.getElementById('toggleOrientation');
    const toggleLens = document.getElementById('toggleLens');
    const invertPageBtn = document.getElementById('invertPage');

    const magnifierContainer = document.getElementById('magnifier-container');
    const magnifier = document.getElementById('magnifier');
    const magnifierCanvas = document.getElementById('magnifier-canvas');
    const magCtx = magnifierCanvas.getContext('2d');
    const magZoomIn = document.getElementById('magZoomIn');
    const magZoomOut = document.getElementById('magZoomOut');
    const magContrast = document.getElementById('magContrast');
    const magInvert = document.getElementById('magInvert');
    const magClose = document.getElementById('magClose');
    const leftTapZone = document.getElementById('left-tap-zone');
    const rightTapZone = document.getElementById('right-tap-zone');
    const app = document.querySelector('.app');

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let pdfDoc = null, currentPage = 1, scale = 1.0, fileKey = null;
    let ocrEnabled = false, pageTextCache = {};
    let lensEnabled = false, isFullscreen = false, isLandscape = false;
    let magZoom = 2.5, magContrastValue = 1.3, magBrightnessValue = 1.1, magInverted = false, magPosition = 0.5;

    // Initialize tap zones
    function setupTapZones() {
      leftTapZone.addEventListener('click', (e) => {
        if (e.target === leftTapZone) prevPage();
      });
      
      rightTapZone.addEventListener('click', (e) => {
        if (e.target === rightTapZone) nextPage();
      });
      
      // Make sure taps pass through to underlying elements when needed
      leftTapZone.addEventListener('mousedown', (e) => e.stopPropagation());
      rightTapZone.addEventListener('mousedown', (e) => e.stopPropagation());
    }

    function fingerprint(file) {
      return `${file.name}::${file.size}::${file.lastModified}`;
    }

    function savePosition() {
      if(!fileKey || !pdfDoc) return;
      const data = {page: currentPage, scale, timestamp: Date.now()};
      try{ localStorage.setItem('lr:'+fileKey, JSON.stringify(data)); }
      catch(e){ console.warn('save failed',e); }
    }

    function loadPositionForKey(key) {
      try{ 
        const s = localStorage.getItem('lr:'+key); 
        return s ? JSON.parse(s) : null; 
      } catch(e) {
        return null;
      }
    }

    async function renderPage(pageNum) {
      const page = await pdfDoc.getPage(pageNum);
      const viewport = isLandscape ? 
        page.getViewport({scale: scale, rotation: 90}) : 
        page.getViewport({scale: scale});
      
      const maxDim = Math.min(window.innerWidth * devicePixelRatio, 2300);
      let renderScale = viewport.scale;
      if(viewport.width > maxDim) { 
        renderScale = renderScale * (maxDim / viewport.width); 
      }

      const vp = isLandscape ? 
        page.getViewport({scale: renderScale, rotation: 90}) : 
        page.getViewport({scale: renderScale});
      
      canvas.width = Math.floor(vp.width);
      canvas.height = Math.floor(vp.height);
      canvas.style.width = Math.floor(vp.width / devicePixelRatio) + 'px';
      canvas.style.height = Math.floor(vp.height / devicePixelRatio) + 'px';

      const renderContext = {canvasContext: ctx, viewport: vp};
      await page.render(renderContext).promise;

      pager.textContent = `${pageNum} / ${pdfDoc.numPages}`;
      fileNameEl.textContent = pdfDoc._pdfInfo ? 
        (pdfDoc._pdfInfo.fingerPrint || fileNameEl.textContent) : 
        fileNameEl.textContent;

      if(ocrEnabled && !pageTextCache[pageNum]) {
        try {
          const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
          const worker = Tesseract.createWorker({logger: m=>{}});
          await worker.load(); 
          await worker.loadLanguage('eng+hin+ben'); 
          await worker.initialize('eng+hin+ben');
          const { data: { text } } = await worker.recognize(dataUrl);
          pageTextCache[pageNum] = text;
          await worker.terminate();
        } catch(e) { console.warn('OCR failed', e); }
      }

      savePosition();
      updateMagnifierView();
    }

    async function openPdfFromFile(file) {
      const url = URL.createObjectURL(file);
      pdfDoc = await pdfjsLib.getDocument({url}).promise;
      fileKey = fingerprint(file);
      fileNameEl.textContent = file.name;

      const pos = loadPositionForKey(fileKey);
      currentPage = pos?.page || 1;
      scale = pos?.scale || calculateInitialScale();

      await renderPage(currentPage);
      URL.revokeObjectURL(url);
    }

    function calculateInitialScale() {
      return (window.innerWidth / 800) * 1.0;
    }

    function nextPage(){ if(!pdfDoc) return; if(currentPage < pdfDoc.numPages){ currentPage++; renderPage(currentPage);} }
    function prevPage(){ if(!pdfDoc) return; if(currentPage>1){ currentPage--; renderPage(currentPage);} }

    function updateMagnifierView() {
      if(!lensEnabled || !pdfDoc) return;
      
      const containerWidth = magnifierContainer.clientWidth;
      const containerHeight = magnifierContainer.clientHeight;
      
      magnifierCanvas.width = containerWidth * devicePixelRatio;
      magnifierCanvas.height = containerHeight * devicePixelRatio;
      magnifierCanvas.style.width = containerWidth + 'px';
      magnifierCanvas.style.height = containerHeight + 'px';
      
      const sourceHeight = (containerHeight / magZoom) * devicePixelRatio;
      const sourceY = (magPosition * canvas.height) - (sourceHeight / 2);
      
      magCtx.clearRect(0, 0, magnifierCanvas.width, magnifierCanvas.height);
      magCtx.drawImage(
        canvas, 
        0, Math.max(0, sourceY), 
        canvas.width, Math.min(sourceHeight, canvas.height - sourceY),
        0, 0,
        magnifierCanvas.width, magnifierCanvas.height
      );
      
      let filter = `contrast(${magContrastValue}) brightness(${magBrightnessValue})`;
      if(magInverted) filter += ' invert(1)';
      magnifierCanvas.style.filter = filter;
    }

    function handleMagnifierPosition(e) {
      if(!lensEnabled) return;
      
      const rect = canvas.getBoundingClientRect();
      let clientY;
      
      if(e.touches) {
        clientY = e.touches[0].clientY;
      } else {
        clientY = e.clientY;
      }
      
      magPosition = Math.min(1, Math.max(0, (clientY - rect.top) / rect.height));
      updateMagnifierView();
    }

    // Event listeners
    document.addEventListener('mousemove', handleMagnifierPosition);
    document.addEventListener('touchmove', handleMagnifierPosition, {passive: true});

    // Magnifier controls
    magZoomIn.addEventListener('click', () => {
      magZoom = Math.min(magZoom + 0.5, 5);
      magZoomIn.textContent = `Zoom ${magZoom.toFixed(1)}x`;
      updateMagnifierView();
    });

    magZoomOut.addEventListener('click', () => {
      magZoom = Math.max(magZoom - 0.5, 1.5);
      magZoomOut.textContent = `Zoom ${magZoom.toFixed(1)}x`;
      updateMagnifierView();
    });

    magContrast.addEventListener('click', () => {
      magContrastValue = magContrastValue < 2 ? magContrastValue + 0.2 : 1.0;
      magContrast.textContent = `Contrast ${magContrastValue.toFixed(1)}`;
      updateMagnifierView();
    });

    magInvert.addEventListener('click', () => {
      magInverted = !magInverted;
      magInvert.classList.toggle('active', magInverted);
      updateMagnifierView();
    });

    magClose.addEventListener('click', () => {
      lensEnabled = false;
      magnifierContainer.style.display = 'none';
      toggleLens.textContent = '🔍';
    });

    toggleLens.addEventListener('click', () => {
      lensEnabled = !lensEnabled;
      magnifierContainer.style.display = lensEnabled ? 'block' : 'none';
      toggleLens.textContent = lensEnabled ? '🔍 ✓' : '🔍';
      if(lensEnabled) updateMagnifierView();
    });

    // Other controls
    zoomIn.addEventListener('click', ()=>{ scale = Math.min(scale * 1.2, 4); renderPage(currentPage); });
    zoomOut.addEventListener('click', ()=>{ scale = Math.max(scale / 1.2, 0.35); renderPage(currentPage); });
    fitWidthBtn.addEventListener('click', ()=>{ scale = calculateInitialScale(); renderPage(currentPage); });
    toggleOCR.addEventListener('click', ()=>{ ocrEnabled = !ocrEnabled; toggleOCR.textContent = ocrEnabled ? 'OCR ✓' : 'OCR'; });
    toggleFullscreen.addEventListener('click', toggleFullscreenMode);
    toggleOrientation.addEventListener('click', togglePageOrientation);
    invertPageBtn.addEventListener('click', () => {
    document.getElementById('viewer').classList.toggle('inverted');
     invertPageBtn.classList.toggle('active');
   });

    fileInput.addEventListener('change', handleFileSelect);
    openLastBtn.addEventListener('click', openLastFile);
    
    function toggleFullscreenMode() {
      isFullscreen = !isFullscreen;
      if(isFullscreen) {
        app.classList.add('fullscreen');
        document.documentElement.requestFullscreen().catch(console.log);
      } else {
        app.classList.remove('fullscreen');
        document.exitFullscreen().catch(console.log);
      }
    }
    
    function togglePageOrientation() {
      isLandscape = !isLandscape;
      renderPage(currentPage);
    }
    
    async function handleFileSelect(e) {
      const file = e.target.files?.[0];
      if(file) await openPdfFromFile(file);
    }
    
    function openLastFile() {
      const keys = Object.keys(localStorage).filter(k => k.startsWith('lr:'));
      if(keys.length === 0) {
        alert('No last reading positions saved locally. Open a PDF to start.');
        return;
      }
      
      let latest = null, latestTime = 0;
      for(const k of keys) {
        try {
          const val = JSON.parse(localStorage.getItem(k));
          if(val?.timestamp > latestTime) {
            latestTime = val.timestamp;
            latest = {key: k.replace('lr:', ''), val};
          }
        } catch(e) {}
      }
      
      if(latest) {
        alert(`Found last-read position for:\n${latest.key}\nOpen the same file to restore position.`);
      } else {
        alert('No saved positions found.');
      }
    }

    // Initialize
    setupTapZones();
    magZoomIn.textContent = `Zoom ${magZoom.toFixed(1)}x`;
    magContrast.textContent = `Contrast ${magContrastValue.toFixed(1)}`;

    window.addEventListener('resize', () => {
      if(lensEnabled) updateMagnifierView();
    });

    window.LightReader = { openFromFile: openPdfFromFile };
  </script>
</body>
</html>
