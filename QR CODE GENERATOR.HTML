<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator · Dark</title>
    <!-- QRCode.js library -->
    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0d10;
            color: #e8edf3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            margin: 0;
        }

        .container {
            max-width: 820px;
            width: 100%;
            background: #161a1f;
            border-radius: 32px;
            padding: 28px 30px 36px;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(2px);
            transition: all 0.2s ease;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            background: linear-gradient(145deg, #f0f5fc, #b0c7e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h1::after {
            content: "✦";
            font-size: 1.6rem;
            background: none;
            -webkit-text-fill-color: #6c8cff;
        }

        /* Tabs */
        .tab {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            background: #1e242b;
            padding: 6px;
            border-radius: 18px;
            margin-bottom: 28px;
            border: 1px solid #2b333c;
        }

        .tab button {
            background: transparent;
            border: none;
            padding: 10px 18px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.9rem;
            color: #9aaec9;
            cursor: pointer;
            transition: 0.2s ease;
            flex: 1 0 auto;
            letter-spacing: 0.2px;
        }

        .tab button:hover {
            background: #28313b;
            color: #d6e3f5;
        }

        .tab button.active {
            background: #2f3b48;
            color: #ffffff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
        }

        /* tab content */
        .tabcontent {
            display: none;
            background: #13181e;
            border-radius: 24px;
            padding: 24px 22px;
            margin-bottom: 24px;
            border: 1px solid #29313b;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
            transition: 0.15s;
        }

        .tabcontent.active-tab {
            display: block;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 0.85rem;
            letter-spacing: 0.3px;
            color: #b6ccdf;
        }

        input, textarea {
            width: 100%;
            padding: 12px 14px;
            background: #0d1218;
            border: 1px solid #2a3440;
            border-radius: 14px;
            color: #f0f6fe;
            font-size: 0.95rem;
            transition: 0.2s;
            outline: none;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.6);
        }

        input:focus, textarea:focus {
            border-color: #5f7eff;
            background: #10171f;
            box-shadow: 0 0 0 3px rgba(79, 120, 255, 0.2), inset 0 2px 5px rgba(0,0,0,0.6);
        }

        textarea {
            resize: vertical;
            min-height: 70px;
            font-family: inherit;
        }

        .size-control {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
            background: #10171f;
            padding: 8px 16px 8px 18px;
            border-radius: 40px;
            border: 1px solid #27313c;
            margin-bottom: 20px;
        }

        .size-control label {
            margin-bottom: 0;
            font-weight: 500;
            color: #b0c8df;
            font-size: 0.8rem;
            letter-spacing: 0.2px;
        }

        .size-control input {
            width: 80px;
            padding: 6px 8px;
            border-radius: 30px;
            background: #0a0f14;
            border: 1px solid #31404e;
            text-align: center;
            font-weight: 500;
            color: #d6e5ff;
        }

        .size-control input[type="number"]::-webkit-inner-spin-button {
            opacity: 0.5;
        }

        button.generate {
            background: linear-gradient(145deg, #3f5eff, #2b44d4);
            border: none;
            padding: 14px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 14px rgba(45, 80, 255, 0.25);
            letter-spacing: 0.3px;
            width: 100%;
            margin-top: 6px;
        }

        button.generate:hover {
            background: linear-gradient(145deg, #5a74ff, #2f4ae0);
            transform: scale(1.01);
            box-shadow: 0 8px 20px rgba(45, 80, 255, 0.4);
        }

        button.generate:active {
            transform: scale(0.98);
        }

        /* QR code area */
        #qrcode {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 18px auto 8px;
            padding: 12px;
            background: #0d1219;
            border-radius: 28px;
            border: 1px solid #2c3643;
            min-height: 110px;
        }

        #qrcode img, #qrcode canvas {
            border-radius: 16px;
            background: #ffffff;
            padding: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7);
            max-width: 100%;
            height: auto;
            display: block;
        }

        .download-btn {
            display: none;
            background: #2b3b52;
            color: white;
            text-align: center;
            padding: 12px 18px;
            border-radius: 60px;
            font-weight: 500;
            text-decoration: none;
            transition: 0.2s;
            margin: 18px auto 0;
            width: fit-content;
            border: 1px solid #446688;
            backdrop-filter: blur(2px);
            letter-spacing: 0.5px;
        }

        .download-btn:hover {
            background: #3a4f6e;
            border-color: #7a9ed4;
            box-shadow: 0 4px 14px rgba(50, 100, 255, 0.3);
        }

        .flex-row {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }
        .flex-row .form-group {
            flex: 1 1 180px;
        }

        .hint {
            opacity: 0.5;
            font-size: 0.7rem;
            margin-top: 4px;
            color: #8ba3c0;
        }

        /* responsive */
        @media (max-width: 600px) {
            .container { padding: 20px 16px; }
            .tab button { padding: 8px 10px; font-size: 0.75rem; }
            .size-control { flex-wrap: wrap; }
        }

        /* scroll */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #131a22; }
        ::-webkit-scrollbar-thumb { background: #31445a; border-radius: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h1>QR Code · Generator</h1>

    <!-- Tabs -->
    <div class="tab" id="tabBar">
        <button class="tablinks active" data-tab="link">Link</button>
        <button class="tablinks" data-tab="text">Text</button>
        <button class="tablinks" data-tab="email">E-mail</button>
        <button class="tablinks" data-tab="call">Call</button>
        <button class="tablinks" data-tab="sms">SMS</button>
        <button class="tablinks" data-tab="vcard">vCard</button>
    </div>

    <!-- ===== LINK ===== -->
    <div id="link" class="tabcontent active-tab">
        <div class="form-group"><label>Website URL</label><input type="url" id="url" placeholder="https://example.com"></div>
        <div class="size-control"><label>QR Size</label><input type="number" id="link-size" min="100" max="1000" value="220"></div>
        <button class="generate" onclick="generateLinkQR()">⚡ Generate QR</button>
    </div>

    <!-- ===== TEXT ===== -->
    <div id="text" class="tabcontent">
        <div class="form-group"><label>Text content</label><textarea id="text-content" rows="4" placeholder="Any text..."></textarea></div>
        <div class="size-control"><label>QR Size</label><input type="number" id="text-size" min="100" max="1000" value="220"></div>
        <button class="generate" onclick="generateTextQR()">⚡ Generate QR</button>
    </div>

    <!-- ===== EMAIL ===== -->
    <div id="email" class="tabcontent">
        <div class="form-group"><label>E-mail address</label><input type="email" id="email-address" placeholder="user@example.com"></div>
        <div class="form-group"><label>Subject (optional)</label><input type="text" id="email-subject" placeholder="Hello"></div>
        <div class="form-group"><label>Body (optional)</label><textarea id="email-body" rows="3" placeholder="Message..."></textarea></div>
        <div class="size-control"><label>QR Size</label><input type="number" id="email-size" min="100" max="1000" value="220"></div>
        <button class="generate" onclick="generateEmailQR()">⚡ Generate QR</button>
    </div>

    <!-- ===== CALL ===== -->
    <div id="call" class="tabcontent">
        <div class="form-group"><label>Phone number</label><input type="tel" id="phone-number" placeholder="+1 234 567 890"></div>
        <div class="size-control"><label>QR Size</label><input type="number" id="call-size" min="100" max="1000" value="220"></div>
        <button class="generate" onclick="generateCallQR()">⚡ Generate QR</button>
    </div>

    <!-- ===== SMS ===== -->
    <div id="sms" class="tabcontent">
        <div class="form-group"><label>Phone number</label><input type="tel" id="sms-number" placeholder="+1 234 567 890"></div>
        <div class="form-group"><label>Message (optional)</label><textarea id="sms-message" rows="3" placeholder="Your SMS text"></textarea></div>
        <div class="size-control"><label>QR Size</label><input type="number" id="sms-size" min="100" max="1000" value="220"></div>
        <button class="generate" onclick="generateSmsQR()">⚡ Generate QR</button>
    </div>

    <!-- ===== VCARD ===== -->
    <div id="vcard" class="tabcontent">
        <div class="flex-row">
            <div class="form-group"><label>First name</label><input type="text" id="vcard-firstname" placeholder="John"></div>
            <div class="form-group"><label>Last name</label><input type="text" id="vcard-lastname" placeholder="Doe"></div>
        </div>
        <div class="flex-row">
            <div class="form-group"><label>Organization</label><input type="text" id="vcard-org" placeholder="Company"></div>
            <div class="form-group"><label>Title</label><input type="text" id="vcard-title" placeholder="Manager"></div>
        </div>
        <!-- multiple phone numbers -->
        <div class="form-group"><label>Phone (primary)</label><input type="tel" id="vcard-phone" placeholder="+1 234 567 890"></div>
        <div class="form-group"><label>Phone 2 (optional)</label><input type="tel" id="vcard-phone2" placeholder="+1 987 654 321"></div>
        <div class="form-group"><label>Phone 3 (optional)</label><input type="tel" id="vcard-phone3" placeholder="+1 555 123 456"></div>
        <div class="form-group"><label>E-mail</label><input type="email" id="vcard-email" placeholder="user@example.com"></div>
        <div class="form-group"><label>Website</label><input type="url" id="vcard-website" placeholder="https://example.com"></div>
        <div class="form-group"><label>Address</label><input type="text" id="vcard-address" placeholder="123 Main St, City"></div>
        <div class="form-group"><label>Note</label><textarea id="vcard-note" rows="2" placeholder="Extra info"></textarea></div>
        <div class="size-control"><label>QR Size</label><input type="number" id="vcard-size" min="100" max="1000" value="220"></div>
        <button class="generate" onclick="generateVCardQR()">⚡ Generate QR</button>
    </div>

    <!-- QR display & download -->
    <div id="qrcode"></div>
    <a id="download-btn" class="download-btn" href="#" download="qrcode.png">⬇ Download QR</a>
</div>

<script>
    (function() {
        // ---- Tab logic ----
        const tabs = document.querySelectorAll('.tablinks');
        const contents = {
            link: document.getElementById('link'),
            text: document.getElementById('text'),
            email: document.getElementById('email'),
            call: document.getElementById('call'),
            sms: document.getElementById('sms'),
            vcard: document.getElementById('vcard')
        };

        function activateTab(tabId) {
            Object.keys(contents).forEach(id => {
                contents[id].classList.toggle('active-tab', id === tabId);
            });
            tabs.forEach(btn => {
                const isActive = btn.dataset.tab === tabId;
                btn.classList.toggle('active', isActive);
            });
        }

        tabs.forEach(btn => {
            btn.addEventListener('click', function(e) {
                const tabId = this.dataset.tab;
                activateTab(tabId);
                // clear QR when switching? optional: we keep previous QR
            });
        });

        // Ensure link is active by default
        activateTab('link');

        // ---- QR generator core ----
        function generateQRCode(data, size) {
            const container = document.getElementById('qrcode');
            container.innerHTML = '';
            try {
                new QRCode(container, {
                    text: data,
                    width: size,
                    height: size,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            } catch (e) {
                alert('Error generating QR: ' + e.message);
                return;
            }

            // Enable download after render
            setTimeout(() => {
                const img = container.querySelector('img') || container.querySelector('canvas');
                if (img) {
                    let src = img.src || img.toDataURL('image/png');
                    const downloadBtn = document.getElementById('download-btn');
                    downloadBtn.href = src;
                    downloadBtn.style.display = 'inline-block';
                }
            }, 350);
        }

        // ---- Helper: get size from input ----
        function getSize(id) {
            let val = parseInt(document.getElementById(id).value);
            if (isNaN(val) || val < 60) val = 200;
            if (val > 1200) val = 1200;
            return val;
        }

        // ---- LINK ----
        window.generateLinkQR = function() {
            let url = document.getElementById('url').value.trim();
            if (!url) { alert('Please enter a URL'); return; }
            if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'http://' + url;
            generateQRCode(url, getSize('link-size'));
        };

        // ---- TEXT ----
        window.generateTextQR = function() {
            const text = document.getElementById('text-content').value.trim();
            if (!text) { alert('Please enter some text'); return; }
            generateQRCode(text, getSize('text-size'));
        };

        // ---- EMAIL (fixed) ----
        window.generateEmailQR = function() {
            const email = document.getElementById('email-address').value.trim();
            if (!email) { alert('Please enter an email address'); return; }
            const subject = document.getElementById('email-subject').value.trim();
            const body = document.getElementById('email-body').value.trim();
            let mailto = 'mailto:' + encodeURIComponent(email);
            const params = [];
            if (subject) params.push('subject=' + encodeURIComponent(subject));
            if (body) params.push('body=' + encodeURIComponent(body));
            if (params.length) mailto += '?' + params.join('&');
            generateQRCode(mailto, getSize('email-size'));
        };

        // ---- CALL (fixed) ----
        window.generateCallQR = function() {
            let phone = document.getElementById('phone-number').value.trim();
            if (!phone) { alert('Please enter a phone number'); return; }
            // clean but keep '+'
            phone = phone.replace(/[^\d+]/g, '');
            generateQRCode('tel:' + phone, getSize('call-size'));
        };

        // ---- SMS (fixed) ----
        window.generateSmsQR = function() {
            let phone = document.getElementById('sms-number').value.trim();
            if (!phone) { alert('Please enter a phone number'); return; }
            phone = phone.replace(/[^\d+]/g, '');
            const msg = document.getElementById('sms-message').value.trim();
            let sms = 'smsto:' + phone;
            if (msg) sms += ':' + encodeURIComponent(msg);
            generateQRCode(sms, getSize('sms-size'));
        };

        // ---- VCARD (multiple phones) ----
        window.generateVCardQR = function() {
            const firstName = document.getElementById('vcard-firstname').value.trim();
            const lastName = document.getElementById('vcard-lastname').value.trim();
            if (!firstName && !lastName) { alert('Enter at least first or last name'); return; }

            const org = document.getElementById('vcard-org').value.trim();
            const title = document.getElementById('vcard-title').value.trim();
            const email = document.getElementById('vcard-email').value.trim();
            const website = document.getElementById('vcard-website').value.trim();
            const address = document.getElementById('vcard-address').value.trim();
            const note = document.getElementById('vcard-note').value.trim();

            // multiple phone fields
            const phone1 = document.getElementById('vcard-phone').value.trim().replace(/[^\d+]/g, '');
            const phone2 = document.getElementById('vcard-phone2').value.trim().replace(/[^\d+]/g, '');
            const phone3 = document.getElementById('vcard-phone3').value.trim().replace(/[^\d+]/g, '');

            let vcard = 'BEGIN:VCARD\nVERSION:3.0\n';
            vcard += `N:${lastName};${firstName}\n`;
            vcard += `FN:${firstName} ${lastName}\n`;
            if (org) vcard += `ORG:${org}\n`;
            if (title) vcard += `TITLE:${title}\n`;
            if (phone1) vcard += `TEL;TYPE=CELL:${phone1}\n`;
            if (phone2) vcard += `TEL;TYPE=WORK:${phone2}\n`;
            if (phone3) vcard += `TEL;TYPE=HOME:${phone3}\n`;
            if (email) vcard += `EMAIL:${email}\n`;
            if (website) vcard += `URL:${website}\n`;
            if (address) vcard += `ADR:;;${address}\n`;
            if (note) vcard += `NOTE:${note}\n`;
            vcard += 'END:VCARD';

            generateQRCode(vcard, getSize('vcard-size'));
        };

        // ---- auto-trigger initial? not needed ----
    })();
</script>
</body>
</html>
