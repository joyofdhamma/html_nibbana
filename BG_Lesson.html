<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gita · Chapter 2, 18 Days</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  :root{
    --paper:#FBF8F2;
    --ink:#2E2A22;
    --ink-soft:#84796A;
    --line:#E5DCC9;
    --saffron:#BF6B3D;
    --saffron-deep:#9A4E27;
    --gold:#C9A24B;
    --card:#FFFFFF;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }

  header{
    text-align:center;
    padding:34px 20px 22px;
    border-bottom:1px solid var(--line);
    background:
      radial-gradient(circle at 50% 0%, rgba(191,107,61,0.06), transparent 60%),
      var(--paper);
    position:relative;
  }
  header .eyebrow{
    font-family:var(--serif);
    font-style:italic;
    color:var(--saffron-deep);
    font-size:14px;
    letter-spacing:0.02em;
  }
  header h1{
    font-family:var(--serif);
    font-weight:400;
    font-size:30px;
    margin:6px 0 4px;
  }
  header .sub{
    font-size:13px;
    color:var(--ink-soft);
  }
  #music-fab{
    position:absolute;
    top:20px;
    right:20px;
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--card);
    font-size:18px;
    cursor:pointer;
    color:var(--saffron-deep);
    box-shadow:0 2px 8px rgba(0,0,0,0.06);
  }
  #music-fab.active{
    background:var(--saffron);
    color:#fff;
    border-color:var(--saffron);
  }

  /* Day selector strip */
  .day-strip-wrap{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:14px 0;
  }
  .day-strip{
    max-width:760px;
    margin:0 auto;
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:0 20px 4px;
    scrollbar-width:thin;
  }
  .day-strip::-webkit-scrollbar{ height:5px; }
  .day-strip::-webkit-scrollbar-thumb{ background:var(--line); border-radius:6px; }
  .day-btn{
    flex-shrink:0;
    font-family:var(--serif);
    font-size:14px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    padding:8px 15px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
  }
  .day-btn:hover{ border-color:var(--saffron); }
  .day-btn.active{
    background:var(--saffron);
    border-color:var(--saffron);
    color:#fff;
    font-weight:600;
  }
  .day-btn .verses-tag{
    font-family:var(--sans);
    font-size:10px;
    opacity:0.75;
    display:block;
    margin-top:1px;
  }

  .nav-arrows{
    max-width:760px;
    margin:0 auto;
    display:flex;
    justify-content:space-between;
    padding:6px 20px 0;
  }
  .arrow-btn{
    font-family:var(--sans);
    font-size:13px;
    background:none;
    border:none;
    color:var(--saffron-deep);
    cursor:pointer;
    padding:4px 6px;
  }
  .arrow-btn:disabled{ color:var(--ink-soft); opacity:0.4; cursor:default; }

  main{
    max-width:760px;
    margin:0 auto;
    padding:30px 20px 80px;
  }

  #status{
    text-align:center;
    color:var(--ink-soft);
    font-style:italic;
    font-family:var(--serif);
    padding:50px 20px;
  }
  #status.error{ color:var(--saffron-deep); }

  .content-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:36px 32px;
  }

  .content-card h1{
    font-family:var(--serif);
    font-weight:400;
    font-size:24px;
    margin-top:0;
  }
  .content-card h3{
    font-family:var(--serif);
    font-weight:400;
    font-size:19px;
    color:var(--saffron-deep);
    margin:30px 0 10px;
    padding-top:22px;
    border-top:1px solid var(--line);
  }
  .content-card h3:first-of-type{ border-top:none; padding-top:0; margin-top:8px; }
  .content-card p{
    line-height:1.75;
    font-size:15.5px;
    margin:0 0 14px;
  }
  .content-card p em{ color:var(--saffron-deep); font-style:italic; }
  .content-card strong{ color:var(--ink); }
  .content-card ul, .content-card ol{
    padding-left:22px;
    margin:0 0 16px;
  }
  .content-card li{
    line-height:1.7;
    font-size:15.5px;
    margin-bottom:8px;
  }
  .content-card blockquote{
    margin:0 0 16px;
    padding:4px 0 4px 16px;
    border-left:3px solid var(--gold);
    color:var(--ink-soft);
    font-style:italic;
  }

  footer{
    text-align:center;
    padding:24px 20px 40px;
    font-size:12px;
    color:var(--ink-soft);
  }

  /* ============ MUSIC PLAYER PANEL ============ */
  #player-panel{
    max-width:760px;
    margin:0 auto;
    padding:0 20px;
    max-height:0;
    overflow:hidden;
    transition:max-height 0.3s ease;
  }
  #player-panel.open{
    max-height:2000px;
  }
  .player-card{
    background:#1c1c2e;
    border-radius:18px;
    padding:20px 18px 22px;
    margin:14px 0 6px;
    color:#e5e2f7;
    font-family:var(--sans);
  }
  .player-card h3{
    font-family:var(--serif);
    font-weight:400;
    font-size:17px;
    margin:0 0 14px;
    color:#f0eef7;
  }
  .upload-area{
    background:#2d2d48;
    border-radius:14px;
    padding:10px 14px;
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
    border:1px dashed #5b5b7a;
    flex-wrap:wrap;
  }
  .upload-label{
    background:#4c4c6e;
    padding:7px 16px;
    border-radius:20px;
    color:#fff;
    font-weight:500;
    font-size:12.5px;
    cursor:pointer;
    border:none;
    white-space:nowrap;
  }
  .upload-label:hover{ background:#625f8b; }
  .file-name{ color:#b7b4d6; font-size:12px; word-break:break-all; flex:1; min-width:60px; }
  input[type=file]{ display:none; }

  .player-bar{
    background:#14141f;
    border-radius:30px;
    padding:4px 4px 4px 14px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:14px;
    border:1px solid #3f3f5e;
  }
  .play-btn{
    background:#7c6df0;
    border:none;
    width:36px; height:36px;
    border-radius:36px;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:15px; cursor:pointer;
    flex-shrink:0;
  }
  .play-btn.playing{ background:#f07c6d; }
  .time-indicator{
    color:#cfcce6; font-variant-numeric:tabular-nums; font-size:12px;
    display:flex; align-items:center; gap:4px; flex:1; min-width:80px;
  }
  .progress-range{
    flex:2; min-width:70px; accent-color:#7c6df0; height:3px; cursor:pointer;
  }

  .day-grid{ display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 16px; }
  .day-seg-btn{
    background:#32324e; border:1px solid #4a4a6a; border-radius:20px;
    padding:6px 13px; font-weight:500; color:#e5e2f7; font-size:11.5px; cursor:pointer;
  }
  .day-seg-btn.active-segment{ background:#7c6df0; border-color:#9a8cf5; color:#fff; }

  .fx-section{ margin-top:6px; }
  .fx-section-title{
    font-size:11px; text-transform:uppercase; letter-spacing:0.06em;
    color:#8a86ad; margin:16px 0 8px;
  }
  .fx-row{
    display:flex; align-items:center; gap:12px; margin-bottom:10px;
  }
  .fx-row label{
    font-size:12.5px; color:#cfcce6; width:96px; flex-shrink:0;
  }
  .fx-row input[type=range]{
    flex:1; accent-color:#7c6df0; height:3px;
  }
  .fx-row .fx-val{
    font-size:11px; color:#8a86ad; width:40px; text-align:right; flex-shrink:0;
    font-variant-numeric:tabular-nums;
  }
  .footer-row{
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:8px; margin-top:14px;
  }
  .repeat-toggle{
    background:#2a2a44; border-radius:30px; padding:5px 12px;
    display:inline-flex; align-items:center; gap:6px;
    color:#b7b4d6; font-size:12px; border:1px solid #4a4a6a;
  }
  .repeat-toggle input{ accent-color:#7c6df0; width:14px; height:14px; cursor:pointer; }
  .day-badge{
    background:#32324e; border-radius:20px; padding:5px 12px;
    font-size:11.5px; color:#b7b4d6;
  }
  .json-status{ font-size:11px; color:#8a86ad; margin-bottom:10px; }
  .json-status.loaded{ color:#8fdf8f; }
  .json-status.error{ color:#f07c6d; }

  @media (max-width:600px){
    .content-card{ padding:26px 20px; }
    header h1{ font-size:24px; }
    .fx-row label{ width:78px; font-size:11.5px; }
  }
</style>
</head>
<body>

<header>
  <button id="music-fab" onclick="toggleMusicPanel()" title="Audio player">♪</button>
  <div class="eyebrow">भगवद्गीता · Chapter Two</div>
  <h1>Eighteen Days, Four Verses</h1>
  <div class="sub" id="day-heading">Loading…</div>
</header>

<!-- MUSIC PLAYER PANEL -->
<div id="player-panel">
  <div class="player-card">
    <h3>Chapter 2 Recitation</h3>
    <div class="json-status" id="jsonStatus">⏳ Loading day timings from GitHub…</div>

    <div class="upload-area">
      <label for="audio-upload" class="upload-label">📁 Load MP3</label>
      <input type="file" id="audio-upload" accept=".mp3,audio/mpeg">
      <span class="file-name" id="file-name">no file loaded</span>
    </div>

    <div class="player-bar">
      <button class="play-btn" id="play-btn">▶</button>
      <div class="time-indicator">
        <span id="time-current">0:00</span><span style="color:#555;">/</span><span id="time-duration">0:00</span>
      </div>
      <input type="range" class="progress-range" id="progress-range" min="0" max="1000" value="0">
    </div>

    <div class="day-grid" id="day-grid"></div>

    <div class="fx-section">
      <div class="fx-section-title">Sound</div>
      <div class="fx-row"><label>Volume</label><input type="range" id="fx-volume" min="0" max="150" value="100"><span class="fx-val" id="val-volume">100%</span></div>
      <div class="fx-row"><label>Speed</label><input type="range" id="fx-speed" min="50" max="200" value="100"><span class="fx-val" id="val-speed">1.0x</span></div>
      <div class="fx-row"><label>Stereo Pan</label><input type="range" id="fx-pan" min="-100" max="100" value="0"><span class="fx-val" id="val-pan">C</span></div>
    </div>

    <div class="fx-section">
      <div class="fx-section-title">Equalizer</div>
      <div class="fx-row"><label>Bass</label><input type="range" id="fx-bass" min="-24" max="24" value="0"><span class="fx-val" id="val-bass">0dB</span></div>
      <div class="fx-row"><label>Mid</label><input type="range" id="fx-mid" min="-24" max="24" value="0"><span class="fx-val" id="val-mid">0dB</span></div>
      <div class="fx-row"><label>Treble</label><input type="range" id="fx-treble" min="-24" max="24" value="0"><span class="fx-val" id="val-treble">0dB</span></div>
    </div>

    <div class="fx-section">
      <div class="fx-section-title">Reverb</div>
      <div class="fx-row"><label>Wet / Dry</label><input type="range" id="fx-reverb" min="0" max="100" value="0"><span class="fx-val" id="val-reverb">0%</span></div>
    </div>

    <div class="footer-row">
      <div class="repeat-toggle">
        <span>🔁 Repeat day</span>
        <input type="checkbox" id="repeat-check" checked>
      </div>
      <span class="day-badge" id="day-badge">idle</span>
    </div>
  </div>
</div>

<div class="day-strip-wrap">
  <div class="day-strip" id="day-strip"></div>
  <div class="nav-arrows">
    <button class="arrow-btn" id="prev-btn" onclick="shiftDay(-1)">‹ Previous day</button>
    <button class="arrow-btn" id="next-btn" onclick="shiftDay(1)">Next day ›</button>
  </div>
</div>

<main>
  <div id="status">Loading Day 1…</div>
  <div class="content-card" id="content" style="display:none;"></div>
</main>

<footer>Chapter 2 · Sāṅkhya Yoga · 18 days · 4 verses per day</footer>

<script>
/* ====================================================================
   READER — text side
   ==================================================================== */
const GH_OWNER = "joyofdhamma";
const GH_REPO  = "bgda";
const GH_BRANCH = "main";

const TOTAL_DAYS = 18;
const VERSES_START = 1;
let currentDay = 1;

function verseRangeForDay(day){
  const start = VERSES_START + (day - 1) * 4;
  const end = start + 3;
  return `${start}–${end}`;
}

function buildDayStrip(){
  const strip = document.getElementById('day-strip');
  strip.innerHTML = '';
  for(let d=1; d<=TOTAL_DAYS; d++){
    const btn = document.createElement('button');
    btn.className = 'day-btn';
    btn.id = 'day-btn-' + d;
    btn.innerHTML = `Day ${d}<span class="verses-tag">v.${verseRangeForDay(d)}</span>`;
    btn.onclick = () => loadDay(d);
    strip.appendChild(btn);
  }
}

function setActiveButton(day){
  document.querySelectorAll('.day-btn').forEach(b=>b.classList.remove('active'));
  const btn = document.getElementById('day-btn-' + day);
  if(btn){
    btn.classList.add('active');
    btn.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
  }
  document.getElementById('prev-btn').disabled = day <= 1;
  document.getElementById('next-btn').disabled = day >= TOTAL_DAYS;
}

function shiftDay(n){
  const next = currentDay + n;
  if(next < 1 || next > TOTAL_DAYS) return;
  loadDay(next);
}

async function loadDay(day){
  currentDay = day;
  setActiveButton(day);
  history.replaceState(null, '', '#day-' + day);

  const statusEl = document.getElementById('status');
  const contentEl = document.getElementById('content');
  contentEl.style.display = 'none';
  statusEl.style.display = 'block';
  statusEl.className = '';
  statusEl.textContent = `Loading Day ${day}…`;
  document.getElementById('day-heading').textContent = `Day ${day} of 18 · Verses ${verseRangeForDay(day)}`;

  const filename = `Ch2_D${day}.md`;
  const url = `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${GH_BRANCH}/${filename}`;
  const cacheKey = 'gita_cache_' + filename;

  try{
    const res = await fetch(url, { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const md = await res.text();
    localStorage.setItem(cacheKey, md);
    renderMarkdown(md, false);
  }catch(e){
    console.warn('Network fetch failed, trying cache:', e);
    const cached = localStorage.getItem(cacheKey);
    if(cached){
      renderMarkdown(cached, true);
    }else{
      statusEl.className = 'error';
      statusEl.textContent = `Couldn't load Day ${day} — no internet connection and no offline copy saved yet for ${filename}.`;
    }
  }

  // sync music player: if audio is loaded, jump/switch playback to this day's segment too
  syncMusicToReaderDay(day);
}

function syncMusicToReaderDay(day){
  const key = 'day' + day;
  if(!CH2_DAYS[key]){
    // no timing defined for this day — just clear highlight, don't touch playback
    highlightPlayerDay(day);
    return;
  }
  if(audioEl){
    // audio loaded: switch segment and start playing immediately
    playSegment(key);
  }else{
    // no audio loaded yet — just mark which day is selected for when a file is loaded
    activeDayKey = key;
    const dayNum = day;
    document.getElementById('day-badge').textContent = `Day ${dayNum} ${repeatEnabled?'🔁':''} (load MP3 to play)`;
  }
  highlightPlayerDay(day);
}

function renderMarkdown(md, fromCache){
  const statusEl = document.getElementById('status');
  const contentEl = document.getElementById('content');
  contentEl.innerHTML = marked.parse(md);
  if(fromCache){
    const note = document.createElement('div');
    note.style.cssText = 'font-size:12px;color:var(--ink-soft);margin-bottom:18px;font-style:italic;';
    note.textContent = '(Showing offline copy saved earlier — not connected right now)';
    contentEl.insertBefore(note, contentEl.firstChild);
  }
  statusEl.style.display = 'none';
  contentEl.style.display = 'block';
}

async function precacheAllDays(){
  for(let d=1; d<=TOTAL_DAYS; d++){
    const filename = `Ch2_D${d}.md`;
    const cacheKey = 'gita_cache_' + filename;
    if(localStorage.getItem(cacheKey)) continue;
    try{
      const url = `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${GH_BRANCH}/${filename}`;
      const res = await fetch(url, { cache: 'no-store' });
      if(res.ok){
        const md = await res.text();
        localStorage.setItem(cacheKey, md);
      }
    }catch(e){ /* silent */ }
  }
}

/* ====================================================================
   MUSIC PLAYER — Web Audio graph + chapter-2 day segments
   ==================================================================== */
const CHAPTER_TIME_JSON_URL = 'https://raw.githubusercontent.com/joyofdhamma/html_nibbana/refs/heads/main/chapter_time.json';

// Fallback Chapter 2 day segments (used until/unless the JSON loads)
let CH2_DAYS = {
  day1:{start:0,end:100}, day2:{start:101,end:120}, day6:{start:387,end:457},
  day7:{start:457,end:526}, day8:{start:526,end:595}, day9:{start:595,end:662},
  day10:{start:662,end:727.5}, day11:{start:727.5,end:792}, day12:{start:792,end:858},
  day13:{start:857.99,end:923}, day14:{start:923,end:994}, day15:{start:994,end:1060},
  day16:{start:1060,end:1128}, day17:{start:1128,end:1195.06}, day18:{start:1195.06,end:1267}
};

let audioEl = null;
let objectUrl = null;
let activeDayKey = null;
let repeatEnabled = true;

// Web Audio graph nodes
let actx = null;
let sourceNode = null;
let bassFilter, midFilter, trebleFilter;
let pannerNode, gainNode;
let convolver, wetGain, dryGain, reverbMixOut;

function ensureAudioGraph(){
  if(actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();

  bassFilter = actx.createBiquadFilter();
  bassFilter.type = 'lowshelf';
  bassFilter.frequency.value = 200;

  midFilter = actx.createBiquadFilter();
  midFilter.type = 'peaking';
  midFilter.frequency.value = 1000;
  midFilter.Q.value = 0.8;

  trebleFilter = actx.createBiquadFilter();
  trebleFilter.type = 'highshelf';
  trebleFilter.frequency.value = 3000;

  pannerNode = actx.createStereoPanner();
  gainNode = actx.createGain();

  // Reverb via convolver with a generated impulse response
  convolver = actx.createConvolver();
  convolver.buffer = makeImpulseResponse(2.5, 2.2);
  wetGain = actx.createGain();
  dryGain = actx.createGain();
  wetGain.gain.value = 0;
  dryGain.gain.value = 1;
  reverbMixOut = actx.createGain();

  // chain: bass -> mid -> treble -> pan -> [dry + wet(convolver)] -> mixOut -> gain -> destination
  bassFilter.connect(midFilter);
  midFilter.connect(trebleFilter);
  trebleFilter.connect(pannerNode);
  pannerNode.connect(dryGain);
  pannerNode.connect(convolver);
  convolver.connect(wetGain);
  dryGain.connect(reverbMixOut);
  wetGain.connect(reverbMixOut);
  reverbMixOut.connect(gainNode);
  gainNode.connect(actx.destination);
}

function makeImpulseResponse(duration, decay){
  const sampleRate = actx.sampleRate;
  const length = sampleRate * duration;
  const impulse = actx.createBuffer(2, length, sampleRate);
  for(let ch=0; ch<2; ch++){
    const data = impulse.getChannelData(ch);
    for(let i=0; i<length; i++){
      data[i] = (Math.random()*2-1) * Math.pow(1 - i/length, decay);
    }
  }
  return impulse;
}

function connectSourceToGraph(){
  ensureAudioGraph();
  if(sourceNode){ try{ sourceNode.disconnect(); }catch(e){} }
  sourceNode = actx.createMediaElementSource(audioEl);
  sourceNode.connect(bassFilter);
}

function formatTime(sec){
  if(!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec/60), s = Math.floor(sec%60);
  return `${m}:${s.toString().padStart(2,'0')}`;
}

function getDayKeys(){
  return Object.keys(CH2_DAYS).sort((a,b)=>{
    return parseInt(a.replace('day','')) - parseInt(b.replace('day',''));
  });
}

function buildDayGrid(){
  const grid = document.getElementById('day-grid');
  grid.innerHTML = '';
  getDayKeys().forEach(key=>{
    const seg = CH2_DAYS[key];
    const dayNum = key.replace('day','');
    const btn = document.createElement('button');
    btn.className = 'day-seg-btn';
    btn.dataset.day = key;
    btn.textContent = `Day ${dayNum}`;
    btn.title = `${seg.start}s – ${seg.end}s`;
    btn.onclick = () => {
      const dayNum = parseInt(key.replace('day',''));
      if(dayNum >= 1 && dayNum <= TOTAL_DAYS && dayNum !== currentDay){
        loadDay(dayNum); // this will call syncMusicToReaderDay -> playSegment
      }else{
        playSegment(key);
        highlightPlayerDay(dayNum || currentDay);
      }
    };
    grid.appendChild(btn);
  });
}

function highlightPlayerDay(readerDay){
  const key = 'day' + readerDay;
  document.querySelectorAll('.day-seg-btn').forEach(b=>{
    b.classList.toggle('active-segment', b.dataset.day === key);
  });
}

function getSeg(dayKey){ return CH2_DAYS[dayKey]; }

function updateProgressUI(){
  if(!audioEl) return;
  const current = audioEl.currentTime || 0;
  const duration = audioEl.duration || 0;
  document.getElementById('progress-range').value = duration>0 ? Math.min(1000,(current/duration)*1000) : 0;
  document.getElementById('time-current').textContent = formatTime(current);
  document.getElementById('time-duration').textContent = formatTime(duration);
}

function enforceSegment(){
  if(!audioEl || activeDayKey===null) return;
  const seg = getSeg(activeDayKey);
  if(!seg) return;
  const current = audioEl.currentTime;
  const playBtn = document.getElementById('play-btn');
  if(current > seg.end){
    if(repeatEnabled){
      audioEl.currentTime = seg.start;
    }else{
      if(!audioEl.paused){ audioEl.pause(); playBtn.textContent='▶'; playBtn.classList.remove('playing'); }
      audioEl.currentTime = seg.end;
    }
    updateProgressUI();
    return;
  }
  if(current < seg.start){
    audioEl.currentTime = seg.start;
    updateProgressUI();
  }
}

function playSegment(dayKey){
  if(!audioEl){ alert('Load an MP3 first.'); return; }
  const seg = getSeg(dayKey);
  if(!seg){ alert(dayKey + ' not defined.'); return; }
  const duration = audioEl.duration;
  if(!duration){ alert('Audio not loaded yet.'); return; }
  activeDayKey = dayKey;
  document.querySelectorAll('.day-seg-btn').forEach(btn=>{
    btn.classList.toggle('active-segment', btn.dataset.day === dayKey);
  });
  const dayNum = dayKey.replace('day','');
  document.getElementById('day-badge').textContent = `Day ${dayNum} ${repeatEnabled?'🔁':''}`;

  if(actx && actx.state === 'suspended') actx.resume();
  audioEl.currentTime = Math.min(seg.start, duration-0.5);
  audioEl.play().catch(()=>{});
  const playBtn = document.getElementById('play-btn');
  playBtn.textContent = '⏸';
  playBtn.classList.add('playing');
  updateProgressUI();
}

function loadAudioFile(file){
  if(!file) return;
  if(audioEl){ audioEl.pause(); }
  if(objectUrl) URL.revokeObjectURL(objectUrl);
  objectUrl = URL.createObjectURL(file);

  audioEl = new Audio(objectUrl);
  audioEl.preload = 'metadata';
  audioEl.crossOrigin = 'anonymous';
  connectSourceToGraph();

  activeDayKey = null;
  document.getElementById('play-btn').textContent = '▶';
  document.getElementById('play-btn').classList.remove('playing');
  document.querySelectorAll('.day-seg-btn').forEach(b=>b.classList.remove('active-segment'));
  document.getElementById('day-badge').textContent = 'idle';
  document.getElementById('progress-range').value = 0;
  document.getElementById('time-current').textContent = '0:00';
  document.getElementById('file-name').textContent = file.name;

  audioEl.addEventListener('loadedmetadata', ()=>{
    document.getElementById('time-duration').textContent = formatTime(audioEl.duration);
    updateProgressUI();
  });
  audioEl.addEventListener('timeupdate', ()=>{
    updateProgressUI();
    if(activeDayKey!==null) enforceSegment();
  });
  audioEl.addEventListener('ended', ()=>{
    const playBtn = document.getElementById('play-btn');
    if(activeDayKey!==null && repeatEnabled){
      const seg = getSeg(activeDayKey);
      audioEl.currentTime = seg.start;
      audioEl.play().catch(()=>{});
      playBtn.textContent='⏸'; playBtn.classList.add('playing');
    }else{
      playBtn.textContent='▶'; playBtn.classList.remove('playing');
    }
    updateProgressUI();
  });
  audioEl.addEventListener('error', ()=> alert('Error loading audio. Try another file.'));

  applyAllFx();
}

/* ---------- FX control wiring ---------- */
function applyAllFx(){
  if(!actx) return;
  const vol = parseFloat(document.getElementById('fx-volume').value)/100;
  gainNode.gain.setTargetAtTime(vol, actx.currentTime, 0.01);

  const pan = parseFloat(document.getElementById('fx-pan').value)/100;
  pannerNode.pan.setTargetAtTime(pan, actx.currentTime, 0.01);

  const bass = parseFloat(document.getElementById('fx-bass').value);
  bassFilter.gain.setTargetAtTime(bass, actx.currentTime, 0.01);

  const mid = parseFloat(document.getElementById('fx-mid').value);
  midFilter.gain.setTargetAtTime(mid, actx.currentTime, 0.01);

  const treble = parseFloat(document.getElementById('fx-treble').value);
  trebleFilter.gain.setTargetAtTime(treble, actx.currentTime, 0.01);

  const reverbPct = parseFloat(document.getElementById('fx-reverb').value)/100;
  wetGain.gain.setTargetAtTime(reverbPct, actx.currentTime, 0.01);
  dryGain.gain.setTargetAtTime(1 - reverbPct*0.6, actx.currentTime, 0.01);

  if(audioEl){
    const speed = parseFloat(document.getElementById('fx-speed').value)/100;
    audioEl.playbackRate = speed;
  }
}

function wireFxControl(id, valId, formatter){
  const input = document.getElementById(id);
  const valEl = document.getElementById(valId);
  input.addEventListener('input', ()=>{
    valEl.textContent = formatter(input.value);
    ensureAudioGraph();
    applyAllFx();
  });
}
wireFxControl('fx-volume','val-volume', v=>`${v}%`);
wireFxControl('fx-speed','val-speed', v=>`${(v/100).toFixed(2)}x`);
wireFxControl('fx-pan','val-pan', v=>{ v=parseInt(v); if(v===0) return 'C'; return v<0 ? `L${Math.abs(v)}` : `R${v}`; });
wireFxControl('fx-bass','val-bass', v=>`${v>0?'+':''}${v}dB`);
wireFxControl('fx-mid','val-mid', v=>`${v>0?'+':''}${v}dB`);
wireFxControl('fx-treble','val-treble', v=>`${v>0?'+':''}${v}dB`);
wireFxControl('fx-reverb','val-reverb', v=>`${v}%`);

document.getElementById('audio-upload').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(file) loadAudioFile(file);
});

document.getElementById('play-btn').addEventListener('click', ()=>{
  if(!audioEl){ alert('Load an MP3 first.'); return; }
  if(actx && actx.state === 'suspended') actx.resume();
  const playBtn = document.getElementById('play-btn');
  if(audioEl.paused){
    if(activeDayKey!==null){
      const seg = getSeg(activeDayKey);
      if(audioEl.currentTime < seg.start || audioEl.currentTime > seg.end) audioEl.currentTime = seg.start;
    }
    audioEl.play().catch(()=>{});
    playBtn.textContent='⏸'; playBtn.classList.add('playing');
  }else{
    audioEl.pause();
    playBtn.textContent='▶'; playBtn.classList.remove('playing');
  }
});

document.getElementById('progress-range').addEventListener('input', ()=>{
  if(!audioEl || !audioEl.duration) return;
  const pct = parseFloat(document.getElementById('progress-range').value)/1000;
  audioEl.currentTime = pct * audioEl.duration;
  updateProgressUI();
  if(activeDayKey!==null) enforceSegment();
});

document.getElementById('repeat-check').addEventListener('change', e=>{
  repeatEnabled = e.target.checked;
  if(activeDayKey!==null){
    const dayNum = activeDayKey.replace('day','');
    document.getElementById('day-badge').textContent = `Day ${dayNum} ${repeatEnabled?'🔁':''}`;
  }
});

function toggleMusicPanel(){
  const panel = document.getElementById('player-panel');
  const fab = document.getElementById('music-fab');
  panel.classList.toggle('open');
  fab.classList.toggle('active');
}

async function loadChapterTimeJSON(){
  const statusEl = document.getElementById('jsonStatus');
  try{
    const res = await fetch(CHAPTER_TIME_JSON_URL);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    if(data['2'] && data['2'].day1){
      CH2_DAYS = data['2'];
      statusEl.textContent = '✅ Day timings loaded from GitHub';
      statusEl.className = 'json-status loaded';
    }else if(data[2] && data[2].day1){
      CH2_DAYS = data[2];
      statusEl.textContent = '✅ Day timings loaded from GitHub';
      statusEl.className = 'json-status loaded';
    }else{
      throw new Error('Chapter 2 missing from JSON');
    }
  }catch(e){
    console.warn('Could not load chapter_time.json, using built-in defaults:', e);
    statusEl.textContent = '⚠️ Using built-in day timings (GitHub load failed)';
    statusEl.className = 'json-status error';
  }
  buildDayGrid();
  highlightPlayerDay(currentDay);
}

buildDayStrip();
const hashMatch = location.hash.match(/day-(\d+)/);
const startDay = hashMatch ? Math.min(TOTAL_DAYS, Math.max(1, parseInt(hashMatch[1]))) : 1;
loadDay(startDay);
precacheAllDays();
buildDayGrid();
loadChapterTimeJSON();
