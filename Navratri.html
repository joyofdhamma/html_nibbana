<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a1230">
<meta name="mobile-web-app-capable" content="yes">
<title>Navratri Sadhana</title>
<style>
:root{
  --bg:#fbf5ea;--card:#ffffff;--ink:#2a1a12;--mut:#76665a;--line:#eadfcf;--soft:#f5ecdc;
  --pri:#8f1d33;--pri-ink:#fff;--acc:#E3B21A;--acc-ink:#2b2200;--edge:#E3B21A;
  --ok:#2e7d4f;--shadow:0 1px 2px rgba(60,30,10,.08),0 4px 14px rgba(60,30,10,.06);
  --nav:62px;
}
:root[data-theme="dark"]{
  --bg:#150e0b;--card:#231915;--ink:#f6ecdf;--mut:#b7a698;--line:#3a2c25;--soft:#2d211c;
  --pri:#e5694f;--pri-ink:#1b0c07;--ok:#5cc58a;--shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari","Noto Sans Bengali",sans-serif;
  line-height:1.45;overscroll-behavior-y:contain}
[lang=hi],.hi{font-family:"Noto Sans Devanagari","Mukta","Hind","Nirmala UI","Mangal",system-ui,sans-serif}
[lang=bn]{font-family:"Noto Sans Bengali","Nirmala UI","Vrinda",system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
h1,h2,h3,p{margin:0}
#app{padding:0 0 calc(var(--nav) + 24px + env(safe-area-inset-bottom));min-height:100vh}
.wrap{padding:0 16px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 6px;
  border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-weight:700;font-size:1.05rem;letter-spacing:.2px}
.brand small{display:block;font-weight:500;font-size:.72rem;color:var(--mut);letter-spacing:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 6px;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;scroll-snap-align:center;width:52px;padding:6px 0 5px;border-radius:14px;background:var(--card);
  border:1.5px solid var(--line);text-align:center;position:relative}
.dchip b{display:block;font-size:1rem;line-height:1.1}
.dchip span{display:block;font-size:.66rem;color:var(--mut)}
.dchip i{position:absolute;left:10px;right:10px;bottom:3px;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.dchip i u{display:block;height:100%;background:var(--ok);text-decoration:none}
.dchip.sel{background:var(--acc);color:var(--acc-ink);border-color:var(--edge)}
.dchip.sel span{color:inherit;opacity:.8}
.dchip.today::after{content:"";position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--pri)}

/* hero */
.hero{display:flex;gap:14px;margin:14px 16px 0;padding:12px;border-radius:22px;background:var(--card);box-shadow:var(--shadow);
  border:1.5px solid var(--edge);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,var(--acc) 0,transparent 55%);opacity:.18;pointer-events:none}
.hero .pic{flex:0 0 37%;max-width:150px;aspect-ratio:3/4;border-radius:16px;background:#fff;overflow:hidden;position:relative;z-index:1;
  display:flex;align-items:center;justify-content:center}
.hero .pic img{width:100%;height:100%;object-fit:contain}
.hero .txt{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;min-width:0}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);font-weight:600}
.hero h1{font-size:1.65rem;line-height:1.25;margin:2px 0}
.hero .en{color:var(--mut);font-size:.95rem}
.hero .mt{margin-top:8px;font-size:1.02rem;line-height:1.5;font-weight:600}

.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 16px 0}
.fact{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:center;min-height:56px;min-width:0}
.fact .k{font-size:.68rem;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);font-weight:600}
.fact .v{font-size:.95rem;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.sw{flex:0 0 30px;height:30px;border-radius:50%;border:2px solid var(--edge);background:var(--acc)}
.fthumb{flex:0 0 38px;height:38px;border-radius:10px;object-fit:cover}

.next{margin:12px 16px 0;padding:14px;border-radius:18px;background:var(--pri);color:var(--pri-ink);display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.next .t{flex:1;min-width:0}
.next .t b{display:block;font-size:1rem}
.next .t span{font-size:.85rem;opacity:.9}
.btn{min-height:46px;padding:0 18px;border-radius:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.p{background:var(--pri);color:var(--pri-ink)}
.btn.w{background:var(--pri-ink);color:var(--pri)}
:root[data-theme="dark"] .next .btn.w{background:#1b0c07;color:var(--pri)}
.btn.g{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:38px;padding:0 12px;font-size:.88rem;border-radius:12px}

/* segmented tabs */
.seg{display:flex;margin:16px 16px 0;background:var(--soft);border-radius:14px;padding:4px;gap:2px}
.seg button{flex:1;min-height:42px;border-radius:11px;font-size:.84rem;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.seg button em{font-style:normal;font-size:.62rem;font-weight:500;opacity:.8}

.sec{margin:12px 16px 0}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 8px}
.sechead h2{font-size:1.05rem}
.sechead .pg{font-size:.82rem;color:var(--mut)}
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.item{display:flex;align-items:center;min-height:62px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.cb{flex:0 0 58px;align-self:stretch;display:flex;align-items:center;justify-content:center}
.cb span{width:28px;height:28px;border-radius:50%;border:2px solid var(--mut);display:flex;align-items:center;justify-content:center;color:transparent;font-size:.95rem;font-weight:800;transition:.15s}
.item.done .cb span{background:var(--ok);border-color:var(--ok);color:#fff}
.item .body{flex:1;min-width:0;padding:8px 0;text-align:left;align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.item .tt{font-weight:600;font-size:.98rem}
.item.done .tt{color:var(--mut);text-decoration:line-through;text-decoration-thickness:1px}
.item .ss{font-size:.8rem;color:var(--mut);overflow-wrap:anywhere}
.item .go{flex:0 0 44px;text-align:center;color:var(--mut);font-size:1.3rem}
.tag{display:inline-block;font-size:.62rem;text-transform:uppercase;letter-spacing:.6px;padding:1px 6px;border-radius:6px;background:var(--soft);color:var(--mut);margin-left:6px;vertical-align:middle;font-weight:700}
.badge{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:10px;background:var(--soft);color:var(--mut);margin-left:6px}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.card + .card{margin-top:10px}
.card h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin-bottom:6px}
.bn{font-size:1rem;line-height:1.75;white-space:pre-line}
details.acc{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:10px;overflow:hidden}
details.acc summary{list-style:none;padding:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;min-height:52px;cursor:pointer}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"＋";color:var(--mut);font-weight:400}
details.acc[open] summary::after{content:"－"}
details.acc .in{padding:0 14px 14px}
.vl{font-size:1.2rem;line-height:1.9;margin:0}
.vr{font-size:.9rem;line-height:1.55;color:var(--mut);margin:0 0 2px;font-style:italic}
.vgap{height:10px}
.noteBox{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--soft);font-size:.92rem}
.hint{font-size:.82rem;color:var(--mut);margin:8px 2px 0}

/* generic grid for days tab */
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 16px 0}
.dcard{background:var(--card);border:1.5px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;box-shadow:var(--shadow);position:relative}
.dcard .im{height:128px;background:#fff;display:flex;align-items:center;justify-content:center;border-bottom:4px solid var(--c)}
.dcard .im img{max-width:100%;max-height:100%;object-fit:contain}
.dcard .in{padding:8px 10px 10px}
.dcard .n{font-size:.7rem;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.7px}
.dcard .nm{font-weight:700;font-size:1.02rem;line-height:1.25}
.dcard .dt{font-size:.78rem;color:var(--mut)}
.bar{height:6px;border-radius:3px;background:var(--soft);margin-top:7px;overflow:hidden}
.bar u{display:block;height:100%;background:var(--ok);text-decoration:none}
.dcard.today{outline:3px solid var(--pri);outline-offset:-3px}

/* page header */
.ph{padding:calc(16px + env(safe-area-inset-top)) 16px 4px}
.ph h1{font-size:1.4rem}
.ph p{color:var(--mut);font-size:.9rem;margin-top:2px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:var(--card);border-top:1px solid var(--line);display:flex}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:.7rem;font-weight:600;color:var(--mut)}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--pri)}

/* settings */
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-height:56px}
.srow:first-child{border-top:0}
.srow label,.srow .l{font-weight:600}
.srow small{display:block;color:var(--mut);font-weight:400;font-size:.8rem}
input[type=date],textarea,select{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px}
textarea{width:100%;min-height:96px;resize:vertical}
.tg{width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:0 0 auto}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tg.on{background:var(--ok)}
.tg.on::after{left:25px}
.opts{display:flex;gap:6px}
.opts button{padding:8px 12px;border-radius:10px;background:var(--soft);font-weight:600;font-size:.85rem;border:1px solid var(--line)}
.opts button.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}

/* names */
.nm-item{display:flex;align-items:stretch;border-top:1px solid var(--line);min-height:68px}
.nm-item:first-child{border-top:0}
.nm-item .no{flex:0 0 40px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-weight:700;font-size:.85rem}
.nm-item .bd{flex:1;padding:8px 0;min-width:0}
.nm-item .h{font-size:1.15rem;font-weight:600}
.nm-item .r{font-size:.85rem;color:var(--mut)}
.nm-item .m{font-size:.8rem;color:var(--mut);font-style:italic}
.nm-item.done .h{color:var(--mut)}
.nm-item.done .no{color:var(--ok)}

/* overlay reader */
#ov{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column}
#ov.show{display:flex}
.ovh{display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
.ovh .ttl{flex:1;min-width:0;text-align:center}
.ovh .ttl b{display:block;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ovh .ttl small{color:var(--mut);font-size:.74rem}
.ib{flex:0 0 44px;height:44px;border-radius:12px;font-size:1.25rem;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.ib.on{background:var(--pri);color:var(--pri-ink)}
.ib small{font-size:.7rem}
.ovtools{display:flex;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;align-items:center}
.ovtools::-webkit-scrollbar{display:none}
.tbtn{flex:0 0 auto;padding:7px 12px;border-radius:999px;background:var(--soft);font-size:.82rem;font-weight:600;border:1px solid var(--line);white-space:nowrap}
.tbtn.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.ovb{flex:1;overflow-y:auto;padding:16px 18px 24px;-webkit-overflow-scrolling:touch;scroll-behavior:auto}
.ovf{display:flex;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
.ovf .btn{flex:1}
.ovf .btn.g{flex:0 0 auto}
.blk{margin-bottom:26px}
.blk h2{font-size:.82rem;text-transform:uppercase;letter-spacing:.9px;color:var(--pri);margin-bottom:8px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.blk h2 span{text-transform:none;letter-spacing:0;font-size:1rem;color:var(--mut);font-weight:500}
.blk .ln{font-size:calc(1.35rem*var(--rs,1));line-height:1.85;margin:0;overflow-wrap:anywhere}
.blk .rm{font-size:calc(.98rem*var(--rs,1));line-height:1.6;color:var(--mut);margin:0;font-style:italic}
.blk .dsc{font-size:calc(.95rem*var(--rs,1));color:var(--mut);margin-bottom:6px}
.blk .ch{font-size:calc(1.05rem*var(--rs,1));line-height:1.6;font-weight:600}
.blk .mn{font-size:calc(.92rem*var(--rs,1));color:var(--mut);margin-top:6px;line-height:1.55}
.hdivider{height:1px;background:var(--line);margin:0 0 14px}

/* japa counter */
.jwrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0 4px}
.jbtn{position:relative;width:min(74vw,300px);aspect-ratio:1;border-radius:50%;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
.jbtn:active{transform:scale(.985)}
.jbtn svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.jbtn .jn{position:relative;text-align:center}
.jbtn .jn b{display:block;font-size:4rem;line-height:1;font-variant-numeric:tabular-nums}
.jbtn .jn span{font-size:.9rem;color:var(--mut)}
.jrow{display:flex;gap:10px}
.timer{font-size:3.2rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0}

.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;z-index:80;
  background:#2a1a12;color:#fff;padding:10px 16px;border-radius:12px;font-size:.9rem;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.center{text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.jai{font-size:1.15rem;font-weight:700;text-align:center;padding:14px 8px;color:var(--pri)}
.imgfull{width:100%;border-radius:14px;margin-top:10px;background:#fff}
@media (min-width:700px){#app,.top,.nav{max-width:560px;margin-left:auto;margin-right:auto}.nav{left:50%;transform:translateX(-50%);width:560px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="ov" role="dialog" aria-modal="true"></div>
<div id="toast" class="toast"></div>
<nav class="nav" id="nav"></nav>

<script>
"use strict";
const D = {"days": [{"n": 1, "hi": "मां शैलपुत्री", "en": "Shailaputri", "dev": "शैलपुत्री", "color": "Yellow", "cc": "#E3B21A", "ci": "#2b2200", "flower": "Jasmine (चमेली)", "fpic": "jasmine", "bhog": "Desi Ghee", "chakra": "मूलाधार", "graha": "Chandra", "note": "सर्व बाधाविनिर्मुक्तो धन धान्य सुतान्वितः\nमनुष्यो मतप्रसादेन भविष्यति न संशय:", "about": {"Origin": "১. শৈলপুত্রী: \nমা শৈলপুত্রীর বাহন বৃষ। \nএঁনার দক্ষিণ হস্তে ত্রিশূল আর বাম হস্তে কমল আছে তাই দেবীর অপর নাম শুল ধরিনি। \nইনি পূর্ব জন্মে দক্ষ নন্দিনী সতী দেবী ছিলেন। \nদক্ষের অমতে তিনি শিব কেই বিবাহ করেন। \nপ্রতিশোধে দক্ষ এক শিব হীন যজ্ঞের আয়োজন করেন। \nবিনা নিমন্ত্রণে সতী দেবী পিত্রালয়ে গিয়ে অনেক \nঅপমানিত হলেন ও সতী রূপে আবির্ভূত মহামায়া দেহত্যাগ করলেন। \nএরপর ভগবান শিব দক্ষ যজ্ঞ ধ্বংস করেন। \nএই দেবী মহামায়া পর জন্মে হিমালয় কন্যা পার্বতী রূপে জন্ম নেন। \nশৈলরাজ হিমালয়ের কন্যা হবার জন্য দেবীর এক নাম শৈলপুত্রী। \nএবং পরজন্মে তিনি দেবাদিদেব শিবকেই পতি রূপে বরন করলেন। \nনবরাত্রির প্রথম দিনে মা শৈলপুত্রীর আরাধনা করা হয়।\nএই দেবী হৈমবতী রূপে দেবতা দের গর্ব চূর্ণ করেছিলেন।", "Navratri Worship": "Navratri প্রথম দিন, দেবী শৈলপুত্রী উপাসনা করা হয়।", "Governing Planet": "এটা বিশ্বাস করা হয় যে চন্দ্র, সমস্ত ভাগ্য প্রদানকারী, দেবী শৈলপুত্রীর দ্বারা পরিচালিত হয় এবং আদী শক্তি এই রূপে উপাসনা করে চন্দ্রের কোন খারাপ প্রভাব অতিক্রম করা যেতে পারে।", "Iconography": "দেবী শৈলপুত্রীর বাহন হল ষাঁড় এবং এই কারণে তিনি বৃষরুধা (বৃষরূড়া) নামেও পরিচিত। দেবী শৈলপুত্রী দুই হাত। তিনি ডান হাতে ত্রিশূল এবং বাম হাতে পদ্ম ফুল বহন করেন।"}, "mantra": {"dev": ["ॐ देवी शैलपुत्र्यै नमः॥"], "rom": ["Om Devi Shailaputryai Namah॥"]}, "sec": {"Prarthana": {"dev": ["वन्दे वाञ्छितलाभाय चन्द्रार्धकृतशेखराम्।", "वृषारूढां शूलधरां शैलपुत्रीं यशस्विनीम्॥"], "rom": []}, "Stuti": {"dev": ["या देवी सर्वभूतेषु माँ शैलपुत्री रूपेण संस्थिता। नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः॥"], "rom": []}, "Dhyana": {"dev": ["वन्दे वाञ्छितलाभाय चन्द्रार्धकृतशेखराम्।", "वृषारूढां शूलधरां शैलपुत्रीं यशस्विनीम्॥", "पूणेन्दु निभाम् गौरी मूलाधार स्थिताम् प्रथम दुर //2Q=="}, {"n": 4, "hi": "मां कुष्मांडा", "en": "Kushmanda", "dev": "कूष्माण्डा", "color": "Orange", "cc": "#E8772E", "ci": "#fff", "flower": "Red color flowers", "fpic": "rose", "bhog": "Malpowa", "chakra": "अनाहत", "graha": "Sun", "note": "इस मंत्र का जाप करने से आपके अंदर का आत्मविश्वास बढ़ेगा और आप हर मुसीबत का सामना करने के लिए तैयार रहेंगे|", "about": {"Origin": "৪. কুষ্মাণ্ডা: \nদেবী পার্বতী তার চতুর্থ স্বরূপে \"কুষ্মাণ্ডা\" নামে পরিচিতা। \nনবরাত্রের চতুর্থদিনে, অর্থাৎ চতুর্থী তিথিতে মাতৃপ্রাণ ভক্তগণ এই কুষ্মাণ্ডারূপেই আদ্যাশক্তিকে আহ্বান করে থাকেন।\n\nকারুণ্যে ভরপুর মায়ের সৌম্যপ্রতিমা। দেবী সিংহবাহিনী, ত্রিনয়নী ও অষ্টভুজা। \nআটটি হাতে সুদর্শনচক্র, ধনুর্বাণ, রক্তপদ্ম, কমণ্ডলু, ইত্যাদি দৃষ্টিগোচর হয়। মায়ের বামহস্তে একটি অমৃতপূর্ণ কলসও রয়েছে। \nএখানে অমৃত ব্রহ্মের রূপক, দেবী ভগবতী পার্বতী অমৃতপূর্ণ কলস অর্থাৎ ব্রহ্মজ্ঞানের আধার হাতে নিয়ে বসে রয়েছেন। \nযোগ্য সাধক আপন তপোবল ও কৃচ্ছ্রতা দ্বারা মহামায়াকে প্রসন্ন করতে পারলে \nতবেই মা সেই অমৃতভাণ্ডের অমৃতধারায় সাধককে স্নান করিয়ে তৃপ্ত করবেন, ব্রহ্মজ্ঞান প্রদানে কৃতার্থ করবেন।\n\nমায়ের হাতে আরও একটি বস্তু রয়েছে, সেটি হল জপমালা। \nসেই জপমালা সিদ্ধমন্ত্রে মন্ত্রিত, তাহা অষ্টসিদ্ধি ও নবনিধি দান করতে সমর্থ। এবার যে ভক্ত রুচি অনুযায়ী যা চাইবে, \nকল্পতরু মা সেই অনুসারেই বাঞ্ছা পূর্ণ করবেন। \nযে সিদ্ধি ও সিদ্ধাই চাইবে, মা তাকে তাই দিয়ে ভোলাবে। \nআর যে পার্থিব সম্পদে অনীহা প্রকাশ করে ওই অমৃতপূর্ণ কলস, অর্থাৎ ব্রহ্মজ্ঞান চাইবে,\n মা তাকেও তাই দিয়েই সন্তুষ্ট করবেন।\n\nএবার আসি মায়ের নাম বিশ্লেষণে। শাস্ত্রে বলা হয়েছে, বলিদানের মধ্যে কুমড়ো বলি মায়ের অধিক প্রিয়। কুমড়োকে সংস্কৃতে \"কুষ্মাণ্ড\" বলে, \nকুষ্মাণ্ডপ্রিয় দেবী তাই কুষ্মাণ্ডা নামে স্তুতা। \nএ তো গেল সহজ একটি ব্যাখ্যা, কিন্তু এর সুগভীর অর্থও রয়েছে। যেমন-\n\nকুৎসিত উষ্মা সন্তাপস্তাপত্রয়রূপো যস্মিন সংসারে। স সংসারে অণ্ডে উদর রূপায়াং যস্যাঃ।।\n\nসংসার তাপযুক্ত, ত্রিবিধ তাপে জরজর। সেই সংসারকে যিনি ভক্ষণ করেন, তিনিই কুষ্মাণ্ডা। \nকু- কুৎসিত, উষ্মা সন্তাপত্রয়ে পূর্ণ জগৎ যাঁর অণ্ডে (উদরে) বিদ্যমান, তিনিই কুষ্মাণ্ডা।দেবী কুষ্মাণ্ডার যেহেতু আটটি হাত, তাই তিনি \"অষ্টভুজা\" নামেও পরিচিতা। \nএনাকে \"কৃষ্ণমাণ্ড\" নামেও ডাকা হয়। মহাপ্রলয়ের পরে যখন সর্বত্র শুধু নিশ্ছিদ্র অন্ধকার ছেয়ে রয়েছে, \nতখন এই ভগবতী কুষ্মাণ্ডা \"ঈষৎ হাস্য\" করে ব্রহ্মাণ্ড সৃষ্টি করেছিলেন। \nতাই আদ্যাশক্তি বলতে আমরা যাঁকে বুঝি, তিনিই ইনি। দেবীর বাসস্থান সৌরমণ্ডলে। \nভীমাপর্বতেও দেবী নিবাস করেন বলে উল্লেখ আছে।দেবী পার্বতী সৃষ্টির রচয়িতা ব্রহ্মা ও তার স্ত্রী সরস্বতীকে চিন্তিত দেখে জিজ্ঞাসা করেন তাদের চিন্তার কারণ \nতখন তারা বলেন তারা বুঝতে পারছেনা সঠিক কি ভাবে সৃষ্টি কে সম্পূর্ণ রচনা করবেন দেবী তাদের চিন্তার তাপ হরণ করেন \nতাদের আশ্বাস দেন একদিন মহা শূন্যে উপবিত দেবী পার্বতী একাকী বসে আছেন হঠাৎ সেখানে শিবের আগমন ঘটে\n স্বামী কে পেয়ে দেবী মহামায়া আনন্দে হেসে ফেলেন ও সেই হাস্য তাপে সৃষ্টি হয় সূর্যাদি সৃষ্টির।", "Governing Planet": "এটা বিশ্বাস করা হয় যে দেবী কুশমণ্ডা সূর্যকে দিক এবং শক্তি প্রদান করেন। তাই সূর্য দেবতা কুশমণ্ডা দেবী দ্বারা পরিচালিত।"}, "mantra": {"dev": ["ॐ देवी कूष्माण्डायै नमः॥"], "rom": ["Om Devi Kushmandayai Namah॥"]}, "sec": {"Prarthana": {"dev": ["सुरासम्पूर्ण कलशं रुधिराप्लुतमेव च।", "दधाना हस्तपद्माभ्यां कूष्माण्डा शुभदास्तु मे॥"], "rom": ["Surasampurna Kalasham Rudhiraplutameva Cha।", "Dadhana Hastapadmabhyam Kushmanda Shubhadastu Me॥"]}, "Stuti": {"dev": ["या देवी सर्वभूतेषु माँ कूष्माण्डा रूपेण संस्थिता। नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः॥"], "rom": ["Ya Devi Sarvabhuteshu Maa Kushmanda Rupena Samsthita।", "Namastasyai Namastasyai Namastasyai Namo Namah॥"]}, "Dhyana": {"dev": ["वन्दे वाञ्छित कामार्थे चन्द्रार्धकृतशेखराम्।", "सिंहरूढ़ा अष्टभुजा कूष्माण्डा यशस्विनीम्॥", "भास्वर भानु निभाम् अनाहत स्थिताम् चतुर्थ दुर्गा त्रिनेत्राम्।", "कमण्डलु, चाप, बाण, पद्म, सुधाकलश, चक्र, गदा, जपवटीधराम्॥", "पटाम्बर परिधानां कमनीयां मृदुहास्या नानालङ्कार भूषिताम्।", "मञ्जीर, हार, केयूर, किङ्किणि, रत्नकुण्डल, मण्डिताम्॥", "प्रफुल्ल वदनांचारू चिबुकां कान्त कपोलाम् तुगम् कुचाम्।", "कोमलाङ्गी स्मेरमुखी श्रीकंटि निम्ननाभि नितम्बनीम्॥"], "rom": ["Vande Vanchhita Kamarthe Chandrardhakritashekharam।", "Simharudha Ashtabhuja Kushmanda Yashasvin hneshwara Dhyānam (Contemplation on Lord of Obstacles)", "d": "The devotee undertakes specific hand gestures chants mantra dedicated to Lord Ganesha asking that any obstacles be removed during the pujā. Two such mantra are:", "chant": ["ganānantva ganapati gum havā mahe", "priyānantva priyapati gum havā mahe", "nidhinantva nidhipati gum havā mahe", "vāso mamha āham jā nigarvādhamvā tvamajā sigarvādhamvā", "shukla ambara dharam vishnum shashi varanam chatur bhujam |", "prasana vadanam dhyāyet sarva vighnopashāntaye ||"]}], "upa": [{"n": 1, "t": "Dhyānam & Āvāhanam", "d": "The Divine is invited into the devotee’s home and heart with a meditation.", "chant": "om sri [Deity name] āvāhanam samarpayāmi"}, {"n": 2, "t": "Āsanam", "d": "A seat is offered by the devotee to the Divine form.", "chant": "om sri [Deity name] āsanam samarpayāmi"}, {"n": 3, "t": "Pādyam, Ārghyam & Āchamanyam", "d": "Water is offered by the devotee who washes the feet and hands of the Divine form. Water is also offered to the Divine to wash their face and mouth, just as one might traditionally offer a guest who has come into the home after journey.", "chant": "om sri [Deity name] pādyam ārghyam āchamaniyam samarpayāmi"}, {"n": 4, "t": "Madhuparkam", "d": "Honey, sugar, ghee (clarified butter), curd (yogurt), or water is offered by the devotee to the Divine form for refreshment.", "chant": "om sri [Deity name] madhuparkam samarpayāmi"}, {"n": 5, "t": "Snānam", "d": "Water is offered by the devotee to bathe the Divine form. In longer pujas, the five items included in panchāmrit (honey, sugar, milk, curd, and ghee) are used in bathing the Divine form as well. Sacred hymns are chanted during this process.", "chant": "om sri [Deity name] snānam samarpayāmi"}, {"n": 6, "t": "Vastram", "d": "Clothing is offered by the devotee to the Divine form after bath.", "chant": "om sri [Deity name] vastram samarpayāmi"}, {"n": 7, "t": "Yagnoveetam", "d": "Sacred thread is offered by the devotee to the Divine form after bath.", "chant": "om sri [Deity name] yagnopaveetam samarpayāmi"}, {"n": 8, "t": "Ābhāranam", "d": "Divine form is bedecked with ornaments by the devotee. Songs are sung in praise of the Divine form during this process.", "chant": "om sri [Deity name]  ābhāranam samarpayāmi"}, {"n": 9, "t": "Gandham", "d": "Sandalwood paste, kumkum or vermillion, and haldi (turmeric) or vibhooti (sacred ash), are offered by the devotee.", "chant": "om sri [Deity name] chandanam samarpayāmi, om sri [Deity name] sindoor tilakam samarpayāmi, om sri [Deity name] haldiyam samarpayāmi, om sri [Deity name] vibhooti samarpayāmi"}, {"n": 10, "t": "Pushpam", "d": "Flowers are offered by the devotee to decorate the Divine form. In longer pujas, 108 or 1008 flowers are offered, one for each name of the Divine form, chanted in ashtottara nāmāvalis or sahasranāmas. In shorter pujas, just a few well-known or favorite names of the Divine form are chanted with each flower being offered.", "chant": "om sri [Deity name] pushpam samarpayāmi"}, {"n": 11, "t": "Dhoopam", "d": "Incense is offered by the devotee to please the Divine form.", "chant": "om sri [Deity name] dhoopam samarpayāmi"}, {"n": 12, "t": "Deepam", "d": "Another lamp is lit and offered by the devotee to the Divine form.", "chant": "om sri [Deity name] deepam samarpayāmi"}, {"n": 13, "t": "Naivedyam", "d": "Fresh food is offered by the devotee to the Divine form. Water is also offered again to cleanse the mouth of the Divine after naivedya has been consumed.", "chant": "om sri [Deity name] naivedyam samarpayāmi"}, {"n": 14, "t": "Tambulam", "d": "Betel nut and leaves, which have symbolic meaning, are offered as mouth fresheners after the meal. Coins or larger monetary amounts are also given as offering.", "chant": "om sri [Deity name] tambulam samarpayāmi"}, {"n": 15, "t": "Karpoora Niranjanam", "d": "ārati for the Divine form is shown and offered by the devotee.", "chant": "om sri [Deity name] karpoora samarpayāmi"}, {"n": 16, "t": "Pradakshina & Namaskāram", "d": "The Divine form is circumambulated, or the devotee stands in place and turns around three times clockwise, symbolizing that the devotee worships the Divine as the center of their life, around which their life revolves.  The devotee bows down to the Divine, and asks for forgiveness of any mistakes committed during the puja process and sends off the Divine form with gratitude.", "chant": "om sri [Deity name] pradakshina samarpayāmi; om sri [Deity name] namaskāram samarpayāmi"}], "closing": {"mantra": ["kāyena vācā manase indriyairvā buddhy ātmanā vā prakrteh svabhāvāt |", "karomi yad yat sakalam parasmai nārāyanāyeti samarpayāmi ||"], "meaning": ["Whatever I do with my Body, Speech, Mind, or Senses, Whatever I do using my Intellect, Feelings or unconsciously through my natural tendencies |", "Whatever I do, I do selflessly for others and surrender them all at the Lotus Feet of the Divine ||"]}}, "names": [{"n": 1, "hi": "दुर्गा", "en": "Durga", "mean": "The reliever of difficulties"}, {"n": 2, "hi": "दुर्गातिशमनी", "en": "Durgartishamani", "mean": "Who puts difficulties at peace"}, {"n": 3, "hi": "दुर्गापद्धिनिवारिणी", "en": "Durgapaddhinivarini", "mean": "Dispeller of difficult adversities"}, {"n": 4, "hi": "दुर्गमच्छेदनी", "en": "Durgamachchhedani", "mean": "Who cuts down difficulty"}, {"n": 5, "hi": "दुर्गसाधिनी", "en": "Durgasadhini", "mean": "The performer of discipline to expel difficulties"}, {"n": 6, "hi": "दुर्गनाशिनी", "en": "Durganashini", "mean": "The destroyer of difficulty"}, {"n": 7, "hi": "दुर्गतोद्धारिणी", "en": "Durgatoddharini", "mean": "Who holds the whip of difficulties"}, {"n": 8, "hi": "दुर्गनिहन्त्री", "en": "Durganihantri", "mean": "Who sends difficulties to Ruin"}, {"n": 9, "hi": "दुर्गमापहा", "en": "Durgamapaha", "mean": "Who measures difficulties"}, {"n": 10, "hi": "दुर्गमज्ञानदा", "en": "Durgamagyanada", "mean": "Who makes difficulties unconscious"}, {"n": 11, "hi": "दुर्गदैत्यलोकदवानला", "en": "Durgadaityalokadavanala", "mean": "Who destroys the world of difficult thoughts"}, {"n": 12, "hi": "दुर्गमा", "en": "Durgama", "mean": "The mother of difficulties"}, {"n": 13, "hi": "दुर्गमालोका", "en": "Durgamaloka", "mean": "The perception of difficulties"}, {"n": 14, "hi": "दुर्गमात्मस्वरूपिणी", "en": "Durgamatmaswarupini", "mean": "The intrinsic nature of the soul of difficulties"}, {"n": 15, "hi": "दुर्गमार्गप्रदा", "en": "Durgamargaprada", "mean": "Who searches through the difficulties"}, {"n": 16, "hi": "दुर्गमविद्या", "en": "Durgamavidya", "mean": "The knowledge of difficulties"}, {"n": 17, "hi": "दुर्गमाश्रिता", "en": "Durgamashrita", "mean": "The extrication from difficulties"}, {"n": 18, "hi": "दुर्गमज्ञानसंस्थाना", "en": "Durgamagyanasamsthana", "mean": "The continued existence of difficulties"}, {"n": 19, "hi": "दुर्गमध्यानभासिनी", "en": "Durgamadhyanabhasini", "mean": "Whose meditation remains brilliant when in difficulties"}, {"n": 20, "hi": "दुर्गमोहा", "en": "Durgamoha", "mean": "Who deludes difficulties"}, {"n": 21, "hi": "दुर्गमगा", "en": "Durgamaga", "mean": "Who resolves difficulties"}, {"n": 22, "hi": "दुर्गमार्थस्वरूपिणी", "en": "Durgamarthaswarupini", "mean": "Who is the intrinsic nature of the object of difficulties"}, {"n": 23, "hi": "दुर्गमासुरसंहन्त्रि", "en": "Durgamasurasamhantri", "mean": "The annihilator of the egotism of difficulties"}, {"n": 24, "hi": "दुर्गमायुधधारिणी", "en": "Durgamayudhadharini", "mean": "Bearer of the weapon against difficulties"}, {"n": 25, "hi": "दुर्गमांगी", "en": "Durgamangi", "mean": "The refinery of difficulties"}, {"n": 26, "hi": "दुर्गमता", "en": "Durgamata", "mean": "Who is beyond difficulties"}, {"n": 27, "hi": "दुर्गम्या", "en": "Durgamya", "mean": "This present difficulty"}, {"n": 28, "hi": "दुर्गमेश्वरी", "en": "Durgameshwari", "mean": "The empress of difficulties"}, {"n": 29, "hi": "दुर्गभीमा", "en": "Durgabhima", "mean": "Who is terrible to difficulties"}, {"n": 30, "hi": "दुर्गभामा", "en": "Durgabhama", "mean": "The lady to difficulties"}, {"n": 31, "hi": "दुर्गभा", "en": "Durgabha", "mean": "The illuminator of difficulties"}, {"n": 32, "hi": "दुर्गदारिणी", "en": "Durgadarini", "mean": "Who cuts off difficulties"}], "kshama": {"title": "।। अथ अपराधक्षमापणस्तोत्रम् ।।", "end": "।। इति अपराधक्षमापणस्तोत्रं समाप्तम्।।", "v": [{"l": ["ॐ अपराधसहस्त्राणि क्रियन्तेऽहर्निशं मया।", "दासोऽयमिति मां मत्वा क्षमस्व परमेश्वरि।।१।।"], "m": "परमेश्वरि ! मेरे द्वारा रात-दिन सहस्रों (हजारों) अपराध होते रहते हैं। ' यह मेरा दास है' - यों समझकर मेरे उन अपराधों को तुम कृपापूर्वक क्षमा करो।1।"}, {"l": ["आवाहनं न जानामि न जानामि विसर्जनम्।", "पूजां चैव न जानामि क्षम्यतां परमेश्वरि।।२।।"], "m": "परमेश्वरि! मैं आवाहन नहीं जानता, विसर्जन नहीं जानता तथा पूज करने का ढंग भी नहीं जानता । क्षमा करो।2।"}, {"l": ["मन्त्रहीनं क्रियाहीनं भक्तिहीनं सुरेश्वरि।", "यत्पूजितं मया देवि परिपूर्णं तदस्तु मे।।।३।।"], "m": "देवि! सुरेश्वरि! मैंनेजो मन्त्रहीन, क्रियाहीन और भक्तिहीन पूजन किया है, वह सब आपकी कृपा से पूर्ण हो।3।"}, {"l": ["अपराधशतं कृत्वा जगदम्बेति चोच्चरेत् ।", "यां गतिं समवाप्नोति न तां ब्रह्मादयः सुराः ।। ४।।"], "m": "सैकड़ों अपराध करके भी जो तुम्हारी शरण में जाकर 'जगदम्ब' पुकारता है, उसे वह गति प्राप्त होती है जो ब्रह्मादि देवताओं के लिए भी सुलभ नहीं है।4।"}, {"l": ["सापराधोऽस्मि शरणं प्राप्तस्त्वां जगदम्बिके ।", "इदानीमनुकम्प्योऽहं यथेच्छसि तथा कुरु ।। ५।।"], "m": "जगदम्बिके! मैं अपराधी हूँ,किन्तु तुम्हारी शरण में आया हूँ। इस समय दया का पात्र हूँ । तुम जैसा चाहो वैसा करो।5।"}, {"l": ["अज्ञानाद्विस्मृतेर्भ्रोन्त्या यन्न्यूनमधिकं कृतम् ।", "तत्सर्वं क्षम्यतां देवि प्रसीद परमेश्वरि ।। ६।।"], "m": "देवि! परमेश्वरि! अज्ञान से, भूल से अथवा बुद्धि भ्रांत होने के कारण मैंनेमैंनेजो न्यूनता या अधिकता कर दी हो, वह सब क्षमा करो और प्रसन्न होओ।6।"}, {"l": ["कामेश्वरि जगन्मातः सच्चिदानन्दविग्रहे ।", "गृहाणार्चामिमां प्रीत्या प्रसीद परमेश्वरि ।। ७।।"], "m": "सच्चिदानंदरूपा परमेश्वरि! जगन्माता कामेश्वरि! तुम प्रेम पूर्वक मेरी यह पूजा स्वीकार करो और मुझ पर प्रसन्न रहो।7।"}, {"l": ["गुह्यातिगुह्यगोप्त्री त्वं गृहा const CHD_PLAN=['Chapter 1','Chapters 2–4','Chapters 5–6','Chapter 7','Chapter 8','Chapters 9–10','Chapter 11','Chapter 12','Chapter 13 · Kshama · Devi Suktam'];
const TXT_BASES=['https://raw.githubusercontent.com/joyofdhamma/SCH_Path/main/','https://cdn.jsdelivr.net/gh/joyofdhamma/SCH_Path@main/'];
const TXT_MEM={};
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))]);
/* ---- mp3 upload, saved on this device (IndexedDB) ---- */
const MP3_KNOWN=['sdc.mp3','arati.mp3',...Array.from({length:9},(_,k)=>`SCH_D${k+1}.mp3`)];
const idbOpen=()=>new Promise((ok,no)=>{try{const r=indexedDB.open('navratri-audio',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}});
async function idbGet(k){try{const d=await idbOpen();return await new Promise(ok=>{const q=d.transaction('f').objectStore('f').get(k);q.onsuccess=()=>ok(q.result||null);q.onerror=()=>ok(null)})}catch(_){return null}}
async function idbPut(k,v){try{const d=await idbOpen();return await new Promise(ok=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(v,k);t.oncomplete=()=>ok(true);t.onerror=()=>ok(false)})}catch(_){return false}}
async function idbDel(k){try{const d=await idbOpen();return await new Promise(ok=>{const t=d.transaction('f','readwrite');t.objectStore('f').delete(k);t.oncomplete=()=>ok(true);t.onerror=()=>ok(false)})}catch(_){return false}}
async function loadText(name){
  const file=name+'.md';
  let cache=null;
  try{cache=await caches.open('navratri-text-v1')}catch(_){}
  for(const b of TXT_BASES){
    try{
      const r=await withTimeout(fetch(b+file,{cache:'no-cache'}),9000);
      if(!r.ok)throw new Error(r.status);
      const t=await r.text();
      TXT_MEM[name]=t;
      try{cache&&await cache.put(b+file,new Response(t))}catch(_){}
      return{t,old:false};
    }catch(_){}
  }
  if(TXT_MEM[name])return{t:TXT_MEM[name],old:true};
  if(cache){for(const b of TXT_BASES){try{const m=await cache.match(b+file);if(m)return{t:await m.text(),old:true}}catch(_){}}}
  throw new Error('offline');
}
function mdBlocks(t){
  const out=[];let cur=[];
  const flush=()=>{if(cur.length){out.push({lines:cur});cur=[]}};
  t.replace(/\r/g,'').split('\n').forEach(raw=>{
    const l=raw.replace(/ /g,' ').trim();
    if(!l){flush();return}
    if(/^[`*_~\-=\s]+$/.test(l)){flush();return}
    const m=l.match(/^#{1,6}\s*(.*)$/);
    if(m){flush();out.push({h:m[1].replace(/\*+/g,'').trim()});return}
    cur.push(l.replace(/\*\*/g,''));
  });
  flush();
  return out;
}

    {id:'cha',t:'Durga Chalisa',hi:'दुर्गा चालीसा',ty:'rem',s:'Read and listen',src:'sdc',mp3:'sdc.mp3'},

    {id:'ksh',t:'Aparadh Kshama Prarthana',hi:'अपराध क्षमा प्रार्थना',ty:'read',s:'Ask forgiveness. Close the puja.',blocks:()=>kshamaBlocks()},
    {id:'nam',t:'Dwatrinsha Namavali',hi:'दुर्गा बत्तीस नामावली',ty:'names',opt:true,s:'32 names of Durga'},
    {id:'kir',t:'Durga Arati',hi:'दुर्गा आरती',ty:'rem',s:'Sing and listen',src:'arati',mp3:'arati.mp3'}
  ];
}
const vowKey=(i,id)=>`${i}.v.${id}`;
function progress(i){
  let t=0,c=0;
  ['m','e'].forEach(s=>items(i,s).filter(x=>!x.opt).forEach(x=>{t++;if(isDone(i,s,x.id))c++}));
  VOWS.forEach(v=>{t++;if(S.done[vowKey(i,v[0])])c++});
  return{t,c,p:t?c/t:0};
}
function slotProgress(i,slot){const l=items(i,slot).filter(x=>!x.opt);return{t:l.length,c:l.filter(x=>isDone(i,slot,x.id)).length}}

function applyTheme(){
  const r=document.documentElement;
  const dark=S.theme==='dark'||(S.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
  r.dataset.theme=dark?'dark':'light';
  r.style.fontSize=(16*S.fs)+'px';

  document.querySelector('meta[name=theme-color]').setAttribute('content',dark?'#150e0b':'#fbf5ea');
}

  <div class="card"><h3>Reading</h3><button class="btn g" data-ksh style="width:100%">Aparadh Kshama Stotram · अपराधक्षमापणस्तोत्रम्</button></div>
  <div class="card"><h3>Tips</h3><p class="hint" style="margin:0">• In Chrome on Android, tap ⋮ then <b>Add to Home screen</b> to open this like an app.<br>• The app works offline. Chandi Path, Chalisa and Arati text load from the internet first, then stay saved. Keep the mp3 files next to this app. Your ticks stay on this phone.<br>• Panchang: one calendar lists both Ashtami and Navami on 19 Oct 2026. If a tithi is skipped or doubled, set Day 1 above, or tap any day tab to jump.</p></div>
  <div class="card"><h3>Reset</h3><button class="btn g" data-reset style="width:100%">Clear all ticks and counts</button></div></div>`;
}
function render(keepScroll){
  applyTheme();
  const y=window.scrollY;
  const app=$('#app');
  app.innerHTML=V.view==='today'?viewToday():V.view==='days'?viewDays():V.view==='puja'?viewPuja():V.view==='names'?viewNames():viewMore();
  const tabs=[['today','Today'],['days','Days'],['puja','Puja'],['names','Names'],['more','More']];
  $('#nav').innerHTML=tabs.map(t=>`<button class="${V.view===t[0]?'on':''}" data-nav="${t[0]}">${ICON[t[0]]}${t[1]}</button>`).join('');
  const sel=document.querySelector('.dchip.sel');if(sel&&!keepScroll)sel.scrollIntoView({inline:'center',block:'nearest'});
  else if(keepScroll){const c=$('#chips');if(c&&render._cx!=null)c.scrollLeft=render._cx}
  if(keepScroll)window.scrollTo(0,y);
}

/* ---------- overlay reader / guided steps ---------- */
let O=null,wake=null,auto=null,tmr=null;
async function setWake(on){try{if(on&&navigator.wakeLock){wake=await navigator.wakeLock.request('screen')}else if(wake){await wake.release();wake=null}}catch(_){wake=null}}
function openStep(list,idx,i,slot,guided){
  O={list,idx,i,slot,guided,wake:false,auto:0,section:null};
  history.pushState({ov:1},'');
  $('#ov').classList.add('show');renderStep();
}
function closeStep(fromPop){
  stopAuto();stopTimer();setWake(false);
  $('#ov').classList.remove('show');$('#ov').innerHTML='';
  const had=O;O=null;
  if(!fromPop&&history.state&&history.state.ov)history.back();
  if(had)render(true);
}
function blocksHtml(blocks){
  return blocks.map((b,k)=>{
    let h=`<div class="blk" id="b${k}">`;
    if(b.h)h+=`<h2>${esc(b.h)}${b.hi?` <span class="hi" lang="hi">${esc(b.hi)}</span>`:''}</h2>`;
    if(b.desc)h+=`<p class="dsc">${esc(b.desc)}</p>`;
    if(b.lines&&b.lines.length)h+=b.lines.map(l=>`<p class="ln hi" lang="hi">${esc(l)}</p>`).join('');
    if(b.chant)h+=`<p class="ch">${esc(b.chant)}</p>`;
    if(S.rom&&b.rom&&b.rom.length)h+=`<div class="vgap"></div>`+b.rom.map(l=>`<p class="rm">${esc(l)}</p>`).join('');
    if(b.meaning)h+=`<p class="mn">${esc(b.meaning)}</p>`;
    return h+'</div>';
  }).join('');
}
function renderStep(){
  if(!O)return;
  const x=O.list[O.idx],{i,slot}=O;
  const done=isDone(i,slot,x.id);
  const d=nm(i);
  document.documentElement.style.setProperty('--rs',S.rs);
  let body='',tools='';
  const jk=gk(i,slot,x.id);
  if(x.ty==='japa'){
    const c=S.cnt[jk]||0,T=x.target||108;
    body=`<div class="jwrap"><button class="jbtn" id="jb" aria-label="Count">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="var(--line)" stroke-width="4"/><circle id="jr" cx="50" cy="50" r="46" fill="none" stroke="var(--acc)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="${289-289*ringP(c,T)}"/></svg>
      <div class="jn"><b id="jc">${c}</b><span id="jt">${jt(c,T)}</span></div></button>
      <div class="jrow"><button class="btn g sm" id="jundo">− 1</button><button class="btn g sm" id="jreset">Reset</button></div></div>
      <div class="hdivider mt16"></div>`+blocksHtml(x.blocks());
  }else if(x.ty==='sank'){
    const nk=`${i}`;
    body=`<div class="blk"><h2>Sankalpa <span class="hi" lang="hi">संकल्प</span></h2>
      <p class="dsc">Write your intention for today. It is saved on this phone.</p>
      <textarea id="sk" placeholder="Today I offer my sadhana to Maa ${esc(d.en)} for…">${esc(S.note[nk]||'')}</textarea></div>`+blocksHtml(x.blocks());
  }else if(x.ty==='check'){
    body=`<div class="blk"><h2>${esc(x.t)} <span class="hi" lang="hi">${esc(x.hi||'')}</span></h2><p class="dsc">${esc(x.s||'')}</p>
      ${x.note?`<div class="noteBox hi" lang="hi">${esc(x.note)}</div>`:''}</div>
      <div class="blk center"><h2 style="justify-content:center">Quiet timer</h2><div class="timer" id="tm">--:--</div>
      <div class="jrow" style="justify-content:center" id="tmb"><button class="btn g sm" data-t="5">5 min</button><button class="btn g sm" data-t="11">11 min</button><button class="btn g sm" data-t="21">21 min</button></div>
      <p class="dsc mt12">Vibrates when time is up. Screen stays on while it runs.</p></div>`;
  }else if(x.ty==='rem'){
    body=`<div class="blk"><audio id="aud" controls preload="none" src="${esc(x.mp3)}" style="width:100%"></audio>
      <p class="dsc" id="audmsg" style="display:none;margin-top:6px"></p>
      <div class="jrow" style="margin-top:8px;flex-wrap:wrap"><label class="btn g sm" for="aupl" style="cursor:pointer">⬆ Upload mp3</label><button class="btn g sm" id="aclr" style="display:none">Remove saved mp3</button>
      <input type="file" id="aupl" accept="audio/*,.mp3" multiple style="display:none"></div>
      <p class="dsc" id="aupm" style="margin-top:4px"></p></div>
      ${x.note?`<div class="noteBox hi" lang="hi">${esc(x.note)}</div>`:''}
      <div id="rtxt"><p class="dsc">Loading text…</p></div>`;
  }else if(x.ty==='names'){
    body=`<div class="blk"><p class="dsc">Open the list and tap each name as you chant it.</p><button class="btn p" id="gonames">Open the 32 names</button></div>`;
  }else{
    body=blocksHtml(x.blocks());
    if(x.jump){
      tools=`<div class="ovtools">${x.blocks().map((b,k)=>`<button class="tbtn" data-j="${k}">${esc(b.h)}</button>`).join('')}</div>`;
    }
  }
  const total=O.list.length;
  const head=`<div class="ovh"><button class="ib" id="ovx" aria-label="Close">✕</button>
    <div class="ttl"><b>${esc(x.t)}</b><small>${O.guided?`Step ${O.idx+1} of ${total} · `:''}${esc(d.en)} · Day ${i+1}</small></div>
    <button class="ib" id="fsm" aria-label="Smaller text">A<small>−</small></button><button class="ib" id="fsp" aria-label="Bigger text">A<small>+</small></button></div>`;
  const rd=(x.ty==='read'||x.ty==='japa'||x.ty==='sank');
  const tl=`<div class="ovtools"><button class="tbtn ${O.wake?'on':''}" id="wk">☀ Keep screen on</button>${(x.ty==='read'||x.ty==='rem')?`<button class="tbtn ${O.auto?'on':''}" id="au">⇩ Auto-scroll${O.auto?' '+O.auto+'×':''}</button>`:''}${x.ty==='rem'?'<button class="tbtn" style="display:none" id="rmt"></button>':`<button class="tbtn ${S.rom?'on':''}" id="rmt">Aa Roman</button>`}</div>`;
  const foot=`<div class="ovf">${O.guided&&O.idx>0?`<button class="btn g" id="bk">‹ Back</button>`:''}
    ${O.guided?`<button class="btn g" id="sk2">Skip</button><button class="btn p" id="dn">${done?'Next ›':'Done & next ›'}</button>`
    :`<button class="btn p" id="dn">${done?'Done ✓ · tap to undo':'Mark done ✓'}</button>`}</div>`;
  $('#ov').innerHTML=head+tl+(tools||'')+`<div class="ovb" id="ovb">${body}</div>`+foot;
  wireStep(x,jk);
}
const ringP=(c,T)=>c<=0?0:(c%T===0?1:(c%T)/T);
const jt=(c,T)=>c<T?`of ${T}`:`${Math.floor(c/T)} mala${Math.floor(c/T)>1?'s':''} complete`;
function setDone(i,slot,id,v){const k=gk(i,slot,id);if(v)S.done[k]=1;else delete S.done[k];save()}
function wireStep(x,jk){
  const q=s=>$('#ov').querySelector(s);
  q('#ovx').onclick=()=>closeStep();
  q('#fsm').onclick=()=>{S.rs=Math.max(.8,+(S.rs-.1).toFixed(2));save();if(x.ty==='rem')document.documentElement.style.setProperty('--rs',S.rs);else renderStep();};
  q('#fsp').onclick=()=>{S.rs=Math.min(1.9,+(S.rs+.1).toFixed(2));save();if(x.ty==='rem')document.documentElement.style.setProperty('--rs',S.rs);else renderStep();};
  q('#wk').onclick=()=>{O.wake=!O.wake;setWake(O.wake);q('#wk').classList.toggle('on',O.wake)};
  q('#rmt').onclick=()=>{S.rom=!S.rom;save();const sc=q('#ovb').scrollTop;renderStep();$('#ovb').scrollTop=sc};
  const au=q('#au');if(au)au.onclick=()=>{O.auto=O.auto>=3?0:O.auto+1;startAuto();au.classList.toggle('on',!!O.auto);au.textContent='⇩ Auto-scroll'+(O.auto?' '+O.auto+'×':'')};
  const adv=(markDone)=>{
    if(markDone){setDone(O.i,O.slot,x.id,true)}
    if(O.guided){
      stopAuto();stopTimer();
      if(O.idx<O.list.length-1){O.idx++;renderStep();q&&($('#ovb').scrollTop=0)}
      else{toast('Ritual complete. Jai Mata Di 🙏');buzz([40,60,40]);closeStep()}
    }else{closeStep()}
  };
  const dn=q('#dn');
  dn.onclick=()=>{
    if(O.guided){adv(!isDone(O.i,O.slot,x.id)?true:false)}
    else{const was=isDone(O.i,O.slot,x.id);setDone(O.i,O.slot,x.id,!was);if(!was)toast('Done ✓');closeStep()}
  };
  const sk=q('#sk2');if(sk)sk.onclick=()=>adv(false);
  const bk=q('#bk');if(bk)bk.onclick=()=>{stopAuto();stopTimer();O.idx--;renderStep()};
  const gn=q('#gonames');if(gn)gn.onclick=()=>{closeStep();V.view='names';render();window.scrollTo(0,0)};
  q('#ov')&&0;
  $('#ov').querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{const t=$('#b'+b.dataset.j);if(t)$('#ovb').scrollTo({top:t.offsetTop-8,behavior:'smooth'})});
  if(x.ty==='japa'){
    const T=x.target||108;
    const upd=()=>{const c=S.cnt[jk]||0;$('#jc').textContent=c;$('#jt').textContent=jt(c,T);$('#jr').setAttribute('stroke-dashoffset',289-289*ringP(c,T))};
    q('#jb').onclick=()=>{
      const c=(S.cnt[jk]||0)+1;S.cnt[jk]=c;upd();save();
      if(c%T===0){buzz([70,50,70,50,160]);if(!isDone(O.i,O.slot,x.id)){setDone(O.i,O.slot,x.id,true);toast('108 complete ✓');const b=q('#dn');if(b)b.textContent=O.guided?'Next ›':'Done ✓ · tap to undo'}else toast(`Mala ${c/T} complete`)}
      else buzz(c%27===0?[30,40,30]:12);
    };
    q('#jundo').onclick=()=>{S.cnt[jk]=Math.max(0,(S.cnt[jk]||0)-1);upd();save()};
    q('#jreset').onclick=()=>{if(confirm('Reset this counter to 0?')){S.cnt[jk]=0;upd();save()}};
  }
  if(x.ty==='rem'){
    const a=q('#aud'),am=q('#audmsg');
    const aq=q('#aupl'),ac=q('#aclr'),ap=q('#aupm');
    let url=null;
    const setBlob=(b,saved)=>{if(O&&O.url)URL.revokeObjectURL(O.url);url=URL.createObjectURL(b);if(O)O.url=url;a.src=url;am.style.display='none';ac.style.display=saved?'inline-flex':'none';ap.textContent=saved?'Using the mp3 saved on this device.':''};
    idbGet(x.mp3).then(b=>{if(b)setBlob(b,true)});
    a.addEventListener('error',()=>{if(url)return;am.style.display='block';am.textContent='Audio not found. Tap Upload mp3 and pick '+x.mp3+'.'});
    aq.onchange=async()=>{
      const fs=[...aq.files];let n=0,mine=false;
      for(const f of fs){
        const key=MP3_KNOWN.find(k=>k.toLowerCase()===f.name.toLowerCase())||(fs.length===1?x.mp3:null);
        if(!key)continue;
        if(await idbPut(key,f)){n++;if(key===x.mp3){mine=true;setBlob(f,true)}}
      }
      aq.value='';
      ap.textContent=n?`Saved ${n} file${n>1?'s':''} on this device.${mine?'':' Not this one yet.'}`:'No match. Name files like '+x.mp3+'.';
      if(mine)ap.textContent=`Saved ${n} file${n>1?'s':''} on this device.`;
    };
    ac.onclick=async()=>{await idbDel(x.mp3);a.removeAttribute('src');a.load();ac.style.display='none';ap.textContent='Removed.'};
    const tok=O;
    loadText(x.src).then(r=>{
      if(O!==tok)return;
      const box=q('#rtxt');if(!box)return;
      box.innerHTML=(r.old?'<p class="dsc">Offline. Showing the saved copy.</p>':'')+remoteHtml(mdBlocks(r.t));
    }).catch(()=>{
      if(O!==tok)return;
      const box=q('#rtxt');if(!box)return;
      box.innerHTML='<p class="dsc">Could not load the text. Check your internet and try again.</p><button class="btn g sm" id="rtry">Try again</button>';
      const b=q('#rtry');if(b)b.onclick=()=>renderStep();
    });
  }
  if(x.ty==='sank'){const t=q('#sk');t.oninput=()=>{S.note[`${O.i}`]=t.value;save()}}
  if(x.ty==='check'){
    $('#ov').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>startTimer(+b.dataset.t));
  }
}
function startAuto(){
  stopAuto();
  if(!O||!O.auto)return;
  const sp=[0,22,40,70][O.auto];
  let last=performance.now(),acc=0;
  auto=setInterval(()=>{const el=$('#ovb');if(!el)return;const n=performance.now();acc+=(n-last)/1000*sp;last=n;const px=Math.floor(acc);if(px>=1){el.scrollTop+=px;acc-=px}},50);
}
function stopAuto(){clearInterval(auto);auto=null}
function startTimer(min){
  stopTimer();setWake(true);O.wake=true;
  const end=Date.now()+min*60000;
  const upd=()=>{const r=Math.max(0,Math.round((end-Date.now())/1000));const el=$('#tm');if(!el)return stopTimer();el.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
    if(r<=0){stopTimer();buzz([300,150,300,150,600]);toast('Time is up 🙏');el.textContent='Done'}};
  upd();tmr=setInterval(upd,500);
  const b=$('#tmb');if(b)b.innerHTML='<button class="btn g sm" id="tstop">Stop</button>';
  const s=$('#tstop');if(s)s.onclick=()=>{stopTimer();$('#tm').textContent='--:--';$('#tmb').innerHTML='<button class="btn g sm" data-t="5">5 min</button><button class="btn g sm" data-t="11">11 min</button><button class="btn g sm" data-t="21">21 min</button>';$('#tmb').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>startTimer(+b.dataset.t))};
}
function stopTimer(){clearInterval(tmr);tmr=null}
window.addEventListener('popstate',()=>{if(O)closeStep(true)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&O&&O.wake)setWake(true)});

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('button,summary');if(!t)return;
  const ds=t.dataset;
  if(ds.nav){V.view=ds.nav;render();window.scrollTo(0,0);return}
  if(ds.day!=null){const c=$('#chips');render._cx=c?c.scrollLeft:null;V.sel=+ds.day;V.view='today';render(true);return}
  if(ds.pick!=null){V.sel=+ds.pick;V.view='today';render();window.scrollTo(0,0);return}
  if(ds.tab){V.tab=ds.tab;if(ds.tab==='m'||ds.tab==='e')V.slot=ds.tab;render(true);return}
  if(ds.tog){const[s,id]=ds.tog.split('|');setDone(V.sel,s,id,!isDone(V.sel,s,id));buzz(10);render(true);return}
  if(ds.vow){const k=vowKey(V.sel,ds.vow);if(S.done[k])delete S.done[k];else S.done[k]=1;save();buzz(10);render(true);return}
  if(ds.open){const[s,k]=ds.open.split('|');openStep(items(V.sel,s),+k,V.sel,s,false);return}
  if(ds.guided){openStep(items(V.sel,ds.guided),+ds.from,V.sel,ds.guided,true);return}
  if(ds.nm){const k=`${V.sel}.${ds.nm}`;if(S.nm[k])delete S.nm[k];else S.nm[k]=1;save();buzz(10);render(true);return}
  if(ds.nmreset!==undefined){D.names.forEach(n=>delete S.nm[`${V.sel}.${n.n}`]);save();render(true);return}
  if(ds.set){const[k,v]=ds.set.split('|');S[k]=v;save();render(true);return}
  if(ds.fs){S.fs=Math.max(.85,Math.min(1.4,+(S.fs+.08*ds.fs).toFixed(2)));save();render(true);return}
  if(ds.rom!==undefined){S.rom=!S.rom;save();render(true);return}
  if(ds.ksh!==undefined){openStep([{id:'ksh',t:'Aparadh Kshama Stotram',hi:'अपराधक्षमापणस्तोत्रम्',ty:'read',blocks:()=>kshamaBlocks()}],0,V.sel,'e',false);return}
  if(ds.reset!==undefined){if(confirm('Clear all ticks, counts and notes?')){S.done={};S.cnt={};S.note={};S.nm={};save();render(true);toast('Cleared')}return}
});
document.addEventListener('change',ev=>{
  if(ev.target.id==='startd'&&ev.target.value){S.start=ev.target.value;save();V.sel=clamp(todayIdx());render(true);toast('Day 1 set to '+fmtD(pd(S.start),{day:'numeric',month:'short',year:'numeric'}))}
});
matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>render(true));
render();
</script>
