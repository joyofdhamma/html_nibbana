    * {

      padding: 0;
      box-sizing: border-box;

      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-wrapper {
      max-width: 1400px;
      width: 100%;
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 44px;
      padding: 2rem 1.8rem 2.8rem;
      box-shadow: 0 25px 50px -12px rgba(0,20,40,0.2), 0 8px 20px -8px rgba(0,0,0,0.03);
      border: 1px solid rgba(255,255,255,0.5);
    }

    h1 {
      display: flex;
      align-items: center;
      gap: 14px;
      font-weight: 600;
      font-size: 2rem;
      letter-spacing: -0.02em;
      color: #0c1d2e;
      margin-bottom: 2rem;
      padding-bottom: 0.8rem;
      border-bottom: 2px solid rgba(0,0,0,0.03);
    }

    h1 i {
      color: #3a6aff;
      background: rgba(58, 106, 255, 0.12);
      padding: 8px 14px;
      border-radius: 40px;
      font-size: 1.8rem;
    }

    .category-block {
      margin-bottom: 2.2rem;
    }

    .category-title {
      font-size: 1rem;
      font-weight: 600;
      color: #1e3145;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 0.7rem 0.2rem;
      letter-spacing: -0.01em;
    }

    .category-title i {
      color: #3a6aff;
      opacity: 0.7;
      font-size: 1rem;
      width: 1.6rem;
      text-align: center;
    }

    .symbol-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
      gap: 10px;
    }

    .symbol-card {
      background: white;
      border-radius: 18px;
      padding: 10px 4px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.5);
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      transition: all 0.15s ease;
      cursor: pointer;
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(2px);
      min-height: 72px;
    }

    .symbol-card:hover {
      transform: translateY(-3px) scale(1.02);
      background: white;
      border-color: #c8d9ff;
      box-shadow: 0 12px 24px -10px rgba(58, 106, 255, 0.20);
    }

    .symbol-card:active {
      transform: scale(0.94);
      background: #edf3ff;
    }

    .symbol-char {
      font-size: 1.8rem;
      line-height: 1.2;
      font-weight: 400;
      color: #0f1f31;
    }

    .symbol-name {
      font-size: 0.5rem;
      font-weight: 500;
      color: #6d7e94;
      margin-top: 4px;
      max-width: 70px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: rgba(0,0,0,0.02);
      padding: 1px 8px;
      border-radius: 30px;
      letter-spacing: 0.02em;
    }

    /* BI Dashboard highlight */
    .bi-highlight {
      background: linear-gradient(135deg, #eef4ff 0%, #f0f7ff 100%);
      border-left: 4px solid #3a6aff;
      border-radius: 24px;
      padding: 0.4rem 1rem 1.2rem 1rem;
      margin-bottom: 2.4rem;
      box-shadow: 0 4px 12px rgba(58,106,255,0.06);
    }

    .bi-highlight .category-title {
      color: #1e3a8a;
    }

    .bi-highlight .category-title i {
      color: #3a6aff;
      opacity: 1;
    }

    .toast-message {
      position: fixed;
      bottom: 2.8rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #0c1d2e;
      color: white;
      padding: 0.9rem 2.4rem;
      border-radius: 60px;
      font-weight: 500;
      font-size: 0.95rem;
      box-shadow: 0 16px 40px rgba(0,0,0,0.25);
      backdrop-filter: blur(8px);
      background: rgba(12, 29, 46, 0.88);
      border: 1px solid rgba(255,255,255,0.08);
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 12px;
      letter-spacing: 0.2px;
    }

    .toast-message.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast-message i {
      color: #7effb2;
      font-size: 1.2rem;
    }

    .footer-note {
      margin-top: 1.2rem;
      font-size: 0.75rem;
      color: #7e8fa6;
      text-align: center;
      display: flex;
      justify-content: center;
      gap: 28px;
      flex-wrap: wrap;
    }

    .footer-note span i {
      margin-right: 6px;
      color: #3a6aff;
      opacity: 0.5;
    }

    @media (max-width: 640px) {
      .app-wrapper { padding: 1.2rem; }
      .symbol-grid { grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 6px; }
      .symbol-card { min-height: 62px; padding: 6px 2px; }
      .symbol-char { font-size: 1.5rem; }
      h1 { font-size: 1.5rem; }
      .bi-highlight { padding: 0.2rem 0.6rem 1rem 0.6rem; }
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.02); border-radius: 20px; }
    ::-webkit-scrollbar-thumb { background: #cbd6e5; border-radius: 20px; }
    ::-webkit-scrollbar-thumb:hover { background: #a9b9cf; }
  </style>

      { name: "Flags", icon: "fa-regular fa-flag", symbols: `🇯🇵 🇰🇷 🇩🇪 🇨🇳 🇺🇸 🇫🇷 🇪🇸 🇮🇹 🇷🇺 🇬🇧 🇦🇿 🇦🇺 🇦🇼 🇦🇴 🇦🇱 🇦🇲 🇦🇸 🇦🇹 🇦🇪 🇦🇬 🇦🇫 🇦🇮 🇦🇩 🇦🇷 🇧🇴 🇧🇷 🇧🇳 🇧🇲 🇧🇹 🇧🇸 🇧🇾 🇧🇿 🇧🇼 🇧🇪 🇧🇫 🇧🇬 🇧🇭 🇧🇮 🇧🇯 🇧🇦 🇧🇧 🇧🇩 🇨🇻 🇨🇼 🇨🇺 🇨🇿 🇨🇾 🇨🇲 🇨🇰 🇨🇱 🇨🇷 🇨🇴 🇨🇩 🇨🇦 🇨🇬 🇨🇫 🇨🇮 🇨🇭 🇩🇯 🇩🇲 🇩🇰 🇩🇴 🇩🇿 🇪🇹 🇪🇷 🇪🇬 🇪🇪 🇪🇨 🇫🇴 🇫🇮 🇫🇯 🇬🇹 🇬🇳 🇬🇲 🇬🇵 🇬🇷 🇬🇶 🇬🇺 🇬🇼 🇬🇾 🇬🇫 🇬🇭 🇬🇮 🇬🇪 🇬🇩 🇬🇦 🇭🇺 🇭🇷 🇭🇳 🇭🇰 🇭🇹 🇮🇪 🇮🇩 🇮🇷 🇮🇶 🇮🇳 🇮🇱 🇮🇸 🇯🇴 🇯🇲 🇰🇬 🇰🇪 🇰🇭 🇰🇮 🇰🇼 🇰🇿 🇰🇾 🇰🇳 🇰🇲 🇰🇵 🇱🇰 🇱🇷 🇱🇸 🇱🇹 🇱🇻 🇱🇺 🇱🇾 🇱🇮 🇱🇨 🇱🇧 🇱🇦 🇲🇼 🇲🇻 🇲🇴 🇲🇪 🇲🇬 🇲🇩 🇲🇦 🇲🇳 🇲🇲 🇲🇷 🇲🇶 🇲🇹 🇲🇸 🇲🇾 🇲🇽 🇲🇿 🇲🇱 🇲🇰 🇲🇵 🇳🇮 🇳🇦 🇳🇱 🇳🇴 🇳🇵 🇳🇿 🇳🇺 🇳🇪 🇳🇨 🇳🇬 🇴🇲 🇵🇸 🇵🇰 🇵🇾 🇵🇼 🇵🇭 🇵🇬 🇵🇪 🇵🇦 🇵🇷 🇵🇹 🇵🇱 🇶🇦 🇷🇪 🇷🇸 🇷🇴 🇷🇼 🇸🇲 🇸🇦 🇸🇧 🇸🇨 🇸🇩 🇸🇬 🇸🇪 🇸🇮 🇸🇻 🇸🇿 🇸🇾 🇸🇽 🇸🇹 🇸🇸 🇸🇳 🇸🇱 🇸🇰 🇸🇷 🇸🇴 🇹🇴 🇹🇿 🇹🇹 🇹🇲 🇹🇳 🇹🇱 🇹🇷 🇹🇻 🇹🇬 🇹🇫 🇹🇯 🇹🇭 🇹🇨 🇺🇿 🇺🇾 🇺🇬 🇺🇦 🇻🇺 🇻🇳 🇻🇨 🇻🇪 🇻🇬 🇻🇮 🇼🇸 🇾🇪 🇿🇦 🇿🇼 🇿🇲 🇦🇶 🇦🇽 🇧🇱 🇧🇶 🇨🇨 🇨🇽 🇪🇭 🇪🇺 🇫🇰 🇫🇲 🇬🇬 🇬🇱 🇬🇸 🇮🇨 🇮🇲 🇮🇴 🇯🇪 🇲🇨 🇲🇭 🇲🇺 🇳🇫 🇳🇷 🇵🇫 🇵🇲 🇵🇳 🇸🇭 🇹🇩 🇹🇰 🇹🇼 🇻🇦 🇼🇫 🇽🇰 🇾🇹 🇦🇨 🇧🇻 🇪🇦 🇨🇵 🇩🇬 🇭🇲 🇲🇫 🇸🇯 🇹🇦 🇺🇲 🏴󠁧󠁢󠁥󠁮󠁧󠁿 🏴󠁧󠁢󠁳󠁣󠁴󠁿 🏴󠁧󠁢󠁷󠁬󠁳󠁿 🇺🇳 🚩 🏳 🏴 🏳️‍🌈 🏴‍☠️️ 🏳️‍⚧️`.split(' ') }
    ];

    // ----- RENDER BI GRID -----
    const biContainer = document.getElementById('biGrid');
    if (biContainer) {
      let biHtml = '';
      biIcons.forEach(item => {
        const displayChar = item.char;
        const nameAttr = item.name.length > 12 ? item.name.slice(0, 10) + '…' : item.name;
        biHtml += `
          <div class="symbol-card" data-char="${displayChar}" data-name="${nameAttr}" role="button" tabindex="0">
            <span class="symbol-char">${displayChar}</span>
            <span class="symbol-name">${nameAttr}</span>
          </div>
        `;
      });
      biContainer.innerHTML = biHtml;
    }

    // ----- RENDER ALL OTHER CATEGORIES -----
    const container = document.getElementById('gridContainer');
    if (!container) return;

    let html = '';
    categories.forEach(cat => {
      const syms = cat.symbols.filter(s => s.trim() !== '');
      if (syms.length === 0) return;

      html += `<div class="category-block">`;
      html += `<div class="category-title"><i class="${cat.icon}"></i> ${cat.name}</div>`;
      html += `<div class="symbol-grid">`;
      syms.forEach(ch => {
        const displayChar = ch;
        const nameAttr = ch.length > 12 ? ch.slice(0, 10) + '…' : ch;
        html += `
          <div class="symbol-card" data-char="${displayChar}" data-name="${nameAttr}" role="button" tabindex="0">
            <span class="symbol-char">${displayChar}</span>
            <span class="symbol-name">${nameAttr}</span>
          </div>
        `;
      });
      html += `</div></div>`;
    });

    container.innerHTML = html;

    // ----- TOAST -----
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toastText');
    let toastTimer = null;

    function showToast(msg) {
      if (toastTimer) { clearTimeout(toastTimer); toast.classList.remove('show'); }
      void toast.offsetWidth;
      toastText.textContent = msg || 'copied';
      toast.classList.add('show');
      toastTimer = setTimeout(() => { toast.classList.remove('show'); toastTimer = null; }, 1600);
    }

    // ----- COPY (delegation for both grids) -----
    function handleCopy(e) {
      const card = e.target.closest('.symbol-card');
      if (!card) return;
      const char = card.dataset.char;
      if (!char) return;

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(char).then(() => {
          showToast(`“${char}” copied`);
        }).catch(() => fallbackCopy(char));
      } else {
        fallbackCopy(char);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none;';
      document.body.appendChild(ta);
      ta.select();
      try {
        const ok = document.execCommand('copy');
        showToast(ok ? `“${text}” copied` : 'copy failed');
      } catch (_) { showToast('error'); }
      document.body.removeChild(ta);
    }

    // Attach listeners to both containers
    document.addEventListener('click', handleCopy);

    // keyboard support
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        const card = e.target.closest('.symbol-card');
        if (card) { e.preventDefault(); card.click(); }
      }
    });

    // a11y labels (run after render)
    document.querySelectorAll('.symbol-card').forEach(c => {
      const name = c.dataset.name || 'symbol';
      c.setAttribute('aria-label', `copy ${name}`);
    });

  })();
</script>
