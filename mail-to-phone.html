<title>Mail to Phone</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: two panes (compose form, QR panel). Stacks to one column on phones. */
:root {
  --bg: #f3f5f9;
  --surface: #ffffff;
  --fg: #151a28;
  --muted: #5b6479;
  --line: #d6dbe6;
  --accent: #2547d0;
  --accent-fg: #ffffff;
  --warn: #9a5b00;
  --warn-bg: #fff3d9;
  --bad: #b3261e;
  --bad-bg: #fde8e6;
  --ok: #1b7a43;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1320;
    --surface: #181e30;
    --fg: #e8ebf4;
    --muted: #9aa3b8;
    --line: #2c3450;
    --accent: #7d96ff;
    --accent-fg: #0c1124;
    --warn: #f0b95a;
    --warn-bg: #3a2c10;
    --bad: #ff8d84;
    --bad-bg: #3d1b19;
    --ok: #6fd69a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1320;
  --surface: #181e30;
  --fg: #e8ebf4;
  --muted: #9aa3b8;
  --line: #2c3450;
  --accent: #7d96ff;
  --accent-fg: #0c1124;
  --warn: #f0b95a;
  --warn-bg: #3a2c10;
  --bad: #ff8d84;
  --bad-bg: #3d1b19;
  --ok: #6fd69a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.5;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header h1 { margin: 0; font-size: 1.6rem; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
header p { margin: 6px 0 0; color: var(--muted); max-width: 60ch; }

.grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 760px) { .grid { grid-template-columns: minmax(0, 1fr); } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field[hidden] { display: none; }
.label-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
label, .lbl { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
input, textarea {
  font: inherit; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; width: 100%;
}
textarea { min-height: 220px; resize: vertical; line-height: 1.55; }
input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hint { font-size: 0.8rem; color: var(--muted); }

.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
button {
  font: inherit; font-weight: 500; cursor: pointer;
  border-radius: 6px; padding: 9px 14px; border: 1px solid var(--line);
  background: transparent; color: var(--fg);
}
button:hover { border-color: var(--accent); }
button.link { border: 0; padding: 0; color: var(--accent); font-size: 0.85rem; background: none; text-decoration: underline; text-underline-offset: 2px; }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 100%; max-width: 340px; }
.seg button { line-height: 1.25; }
.seg button { border: 1px solid var(--line); border-radius: 6px; padding: 8px 6px; font-size: 0.8rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }

.qr-panel { align-items: center; text-align: center; position: sticky; top: 16px; }
@media (max-width: 760px) { .qr-panel { position: static; } }
.qr-box { background: #ffffff; border-radius: 8px; padding: 14px; width: 100%; max-width: 340px; aspect-ratio: 1; display: grid; place-items: center; border: 1px solid var(--line); }
.qr-box svg { width: 100%; height: 100%; display: block; }
.empty { color: #5b6479; font-size: 0.9rem; padding: 12px; }
.steps { margin: 0; padding-left: 1.2em; text-align: left; color: var(--muted); font-size: 0.9rem; width: 100%; max-width: 340px; }
.steps li { margin: 2px 0; }
.stat { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.note { width: 100%; border-radius: 6px; padding: 8px 12px; font-size: 0.85rem; text-align: left; }
.note.warn { background: var(--warn-bg); color: var(--warn); }
.note.bad { background: var(--bad-bg); color: var(--bad); }
.toast { color: var(--ok); font-size: 0.85rem; min-height: 1.2em; }
</style>

<div class="wrap">
  <header>
    <h1>Mail to Phone</h1>
    <p>Write the email here. Scan the code with your phone camera. Your mail app opens with the email already filled in.</p>
  </header>

  <div class="grid">
    <section class="panel" aria-label="Compose email">
      <div class="field">
        <div class="label-row">
          <label for="to">To</label>
          <span class="row" style="gap:14px">
            <button class="link" id="addCc" type="button">Add CC</button>
            <button class="link" id="addBcc" type="button">Add BCC</button>
          </span>
        </div>
        <input id="to" type="text" inputmode="email" autocomplete="off" spellcheck="false" placeholder="name@example.com, other@example.com">
        <span class="hint">Separate several addresses with commas.</span>
      </div>
      <div class="field" id="ccField" hidden>
        <div class="label-row">
          <label for="cc">CC</label>
          <button class="link" id="rmCc" type="button">Remove</button>
        </div>
        <input id="cc" type="text" inputmode="email" autocomplete="off" spellcheck="false" placeholder="cc@example.com">
      </div>
      <div class="field" id="bccField" hidden>
        <div class="label-row">
          <label for="bcc">BCC</label>
          <button class="link" id="rmBcc" type="button">Remove</button>
        </div>
        <input id="bcc" type="text" inputmode="email" autocomplete="off" spellcheck="false" placeholder="bcc@example.com">
      </div>
      <div class="field">
        <label for="subject">Subject</label>
        <input id="subject" type="text" autocomplete="off" placeholder="Subject">
      </div>
      <div class="field">
        <label for="body">Body</label>
        <textarea id="body" placeholder="Write your email here."></textarea>
      </div>
      <div class="row">
        <button id="clear" type="button">Clear all</button>
        <button id="sample" type="button">Load example</button>
        <span id="toast" class="toast" role="status"></span>
      </div>
    </section>

    <aside class="panel qr-panel" aria-label="QR code">
      <div class="seg" role="group" aria-label="Open in">
        <button id="modeDefault" type="button" aria-pressed="true">Phone default</button>
        <button id="modeGmailAndroid" type="button" aria-pressed="false">Gmail app (Android)</button>
        <button id="modeGmailApp" type="button" aria-pressed="false">Gmail app (iPhone)</button>
        <button id="modeGmail" type="button" aria-pressed="false">Gmail web</button>
      </div>
      <div class="qr-box" id="qr"></div>
      <div class="stat" id="stat"></div>
      <div id="msg" style="width:100%"></div>
      <ol class="steps">
        <li>Open the phone camera.</li>
        <li>Point it at the code.</li>
        <li>Tap the banner that appears.</li>
        <li>Check the email, then press Send.</li>
      </ol>
      <div class="hint" id="modeHint"></div>
      <div class="row" style="justify-content:center">
        <button id="copyLink" type="button">Copy link</button>
      </div>
    </aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var to = $('to'), cc = $('cc'), bcc = $('bcc'), subject = $('subject'), body = $('body');
  var ccField = $('ccField'), bccField = $('bccField');
  var qrEl = $('qr'), statEl = $('stat'), msgEl = $('msg'), toast = $('toast'), modeHint = $('modeHint');
  var KEY = 'mail-to-phone-draft';
  var mode = 'default';
  var lastUri = '';

  var SAMPLE = {
    to: 'priya@example.com',
    subject: 'Meeting notes from Tuesday',
    body: 'Hi Priya,\n\nThanks for your time on Tuesday. Here is a short summary:\n\n- Launch date moves to 14 November\n- I will send the revised budget by Friday\n- Please confirm the venue\n\nRegards,\nJoy'
  };

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        to: to.value, cc: cc.value, bcc: bcc.value, subject: subject.value, body: body.value,
        showCc: !ccField.hidden, showBcc: !bccField.hidden, mode: mode
      }));
    } catch (e) {}
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw);
        to.value = d.to || ''; cc.value = d.cc || ''; bcc.value = d.bcc || '';
        subject.value = d.subject || ''; body.value = d.body || '';
        ccField.hidden = !(d.showCc || d.cc);
        bccField.hidden = !(d.showBcc || d.bcc);
        mode = (d.mode === 'gmail' || d.mode === 'gmailapp' || d.mode === 'gmailandroid') ? d.mode : 'default';
        return true;
      }
    } catch (e) {}
    return false;
  }

  function addrList(s, enc) {
    return s.split(/[,;\s]+/).filter(Boolean).map(function (a) {
      return encodeURIComponent(a).replace(/%40/g, '@');
    }).join(',');
  }
  function nl(s) { return s.replace(/\r?\n/g, '\r\n'); }

  function buildUri() {
    var t = addrList(to.value), c = addrList(cc.value), b = addrList(bcc.value);
    var p = [];
    if (mode === 'gmailandroid') {
      if (c) p.push('cc=' + c);
      if (b) p.push('bcc=' + b);
      if (subject.value) p.push('subject=' + encodeURIComponent(subject.value));
      if (body.value) p.push('body=' + encodeURIComponent(nl(body.value)));
      return 'intent:' + t + (p.length ? '?' + p.join('&') : '') + '#Intent;scheme=mailto;package=com.google.android.gm;end';
    }
    if (mode === 'gmailapp') {
      if (t) p.push('to=' + t);
      if (c) p.push('cc=' + c);
      if (b) p.push('bcc=' + b);
      if (subject.value) p.push('subject=' + encodeURIComponent(subject.value));
      if (body.value) p.push('body=' + encodeURIComponent(nl(body.value)));
      return 'googlegmail:///co' + (p.length ? '?' + p.join('&') : '');
    }
    if (mode === 'gmail') {
      if (t) p.push('to=' + t);
      if (c) p.push('cc=' + c);
      if (b) p.push('bcc=' + b);
      if (subject.value) p.push('su=' + encodeURIComponent(subject.value));
      if (body.value) p.push('body=' + encodeURIComponent(body.value.replace(/\r?\n/g, '\n')));
      return 'https://mail.google.com/mail/?view=cm&fs=1' + (p.length ? '&' + p.join('&') : '');
    }
    if (c) p.push('cc=' + c);
    if (b) p.push('bcc=' + b);
    if (subject.value) p.push('subject=' + encodeURIComponent(subject.value));
    if (body.value) p.push('body=' + encodeURIComponent(nl(body.value)));
    return 'mailto:' + t + (p.length ? '?' + p.join('&') : '');
  }

  function drawSvg(qr) {
    var n = qr.getModuleCount(), q = 4, size = n + q * 2, d = '';
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        if (qr.isDark(r, c)) d += 'M' + (c + q) + ' ' + (r + q) + 'h1v1h-1z';
      }
    }
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + size + ' ' + size +
      '" shape-rendering="crispEdges" role="img" aria-label="QR code for the email">' +
      '<rect width="' + size + '" height="' + size + '" fill="#ffffff"/><path d="' + d + '" fill="#000000"/></svg>';
  }

  function note(kind, text) {
    msgEl.innerHTML = '';
    if (!text) return;
    var el = document.createElement('div');
    el.className = 'note ' + kind;
    el.textContent = text;
    msgEl.appendChild(el);
  }

  function render() {
    save();
    $('modeDefault').setAttribute('aria-pressed', String(mode === 'default'));
    $('modeGmailAndroid').setAttribute('aria-pressed', String(mode === 'gmailandroid'));
    $('modeGmailApp').setAttribute('aria-pressed', String(mode === 'gmailapp'));
    $('modeGmail').setAttribute('aria-pressed', String(mode === 'gmail'));
    modeHint.textContent = mode === 'gmailandroid'
      ? 'Opens the Gmail app on Android. Works when your scanner passes the link to Chrome. If it only shows text, use Phone default with Gmail set as the default mail app.'
      : mode === 'gmailapp'
      ? 'Opens the Gmail app on iPhone. The Gmail app must be installed. It does not work on Android.'
      : mode === 'gmail'
      ? 'Opens Gmail in the phone browser, not in the app.'
      : 'Opens your default mail app. On Android, set Gmail as the default mail app and this opens Gmail.';

    if (!to.value.trim() && !cc.value.trim() && !bcc.value.trim() && !subject.value && !body.value) {
      lastUri = '';
      qrEl.innerHTML = '<div class="empty">Type an email on the left. The QR code appears here.</div>';
      statEl.textContent = '';
      note('', '');
      return;
    }
    var uri = buildUri();
    lastUri = uri;
    var len = uri.length;
    try {
      var qr = qrcode(0, 'L');
      qr.addData(uri);
      qr.make();
      qrEl.innerHTML = drawSvg(qr);
      statEl.textContent = len + ' of 2,953 characters used';
      if (len > 1100) note('warn', 'Long email. The code is dense. Hold the phone close and steady, or shorten the body.');
      else note('', '');
    } catch (e) {
      qrEl.innerHTML = '<div class="empty">Too long for one QR code.</div>';
      statEl.textContent = len + ' of 2,953 characters used';
      note('bad', 'Shorten the body by about ' + (len - 2953) + ' characters. Line breaks and special characters count extra.');
    }
  }

  function flash(t) {
    toast.textContent = t;
    setTimeout(function () { toast.textContent = ''; }, 1800);
  }
  function copy(text, okMsg) {
    var done = function () { flash(okMsg); };
    var fail = function () { flash('Copy failed. Select the text and copy it by hand.'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fail);
    } else { fail(); }
  }

  [to, cc, bcc, subject, body].forEach(function (el) { el.addEventListener('input', render); });

  $('addCc').addEventListener('click', function () { ccField.hidden = false; cc.focus(); render(); });
  $('addBcc').addEventListener('click', function () { bccField.hidden = false; bcc.focus(); render(); });
  $('rmCc').addEventListener('click', function () { cc.value = ''; ccField.hidden = true; render(); });
  $('rmBcc').addEventListener('click', function () { bcc.value = ''; bccField.hidden = true; render(); });

  $('modeDefault').addEventListener('click', function () { mode = 'default'; render(); });
  $('modeGmail').addEventListener('click', function () { mode = 'gmail'; render(); });
  $('modeGmailAndroid').addEventListener('click', function () { mode = 'gmailandroid'; render(); });
  $('modeGmailApp').addEventListener('click', function () { mode = 'gmailapp'; render(); });

  $('clear').addEventListener('click', function () {
    to.value = ''; cc.value = ''; bcc.value = ''; subject.value = ''; body.value = '';
    ccField.hidden = true; bccField.hidden = true;
    render(); to.focus();
  });
  $('sample').addEventListener('click', function () {
    to.value = SAMPLE.to; subject.value = SAMPLE.subject; body.value = SAMPLE.body; render(); flash('Example loaded');
  });
  $('copyLink').addEventListener('click', function () {
    if (!lastUri) { flash('Write an email first'); return; }
    copy(lastUri, 'Link copied');
  });

  if (!load()) { to.value = SAMPLE.to; subject.value = SAMPLE.subject; body.value = SAMPLE.body; }
  render();
})();
</script>
