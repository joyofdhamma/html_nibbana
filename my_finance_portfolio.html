<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MF Portfolio Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.08);
            --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08), 0 2px 4px rgba(15, 23, 42, 0.06);
            --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.12), 0 4px 8px rgba(15, 23, 42, 0.06);
            --radius-md: 14px;
            --radius-lg: 18px;
            --accent-1: #667eea;
            --accent-2: #764ba2;
        }
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(102, 126, 234, 0.35); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(102, 126, 234, 0.55); }
        body.dark-mode::-webkit-scrollbar-thumb { background: rgba(102, 126, 234, 0.4); }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        body { 
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-font-smoothing: antialiased;
            background: radial-gradient(circle at 15% 0%, #7d8ff2 0%, transparent 45%),
                        radial-gradient(circle at 85% 15%, #8a5fc4 0%, transparent 50%),
                        linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed;
            padding: 12px; 
            min-height: 100vh; 
            transition: background 0.4s, color 0.4s;
        }
        body.dark-mode {
            background: radial-gradient(circle at 15% 0%, #1c2340 0%, transparent 45%),
                        radial-gradient(circle at 85% 15%, #2a1c40 0%, transparent 50%),
                        linear-gradient(135deg, #0a0a14 0%, #0a0a0a 100%);
            background-attachment: fixed;
            color: #e0e0e0;
        }
        body.dark-mode .top-bar,
        body.dark-mode .controls,
        body.dark-mode .stat-card,
        body.dark-mode .analysis-card,
        body.dark-mode .table-container,
        body.dark-mode .header {
            background: #1a1a2e;
            color: #e0e0e0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        body.dark-mode .stat-card .value,
        body.dark-mode .analysis-card h3,
        body.dark-mode .table-container h3,
        body.dark-mode .top-bar h1 {
            color: #ffffff;
        }
        body.dark-mode .stat-card h3,
        body.dark-mode .top-bar .subtitle {
            color: #aaaaaa;
        }
        body.dark-mode .controls select,
        body.dark-mode .controls input[type="text"] {
            background: #2a2a4a;
            color: #e0e0e0;
            border-color: #444466;
        }
        body.dark-mode .controls select option {
            background: #2a2a4a;
        }
        body.dark-mode table th {
            background: #2a2a4a;
            color: #ffffff;
        }
        body.dark-mode table td {
            border-bottom-color: #333355;
        }
        body.dark-mode table tr:hover {
            background: #2a2a4a;
        }
        body.dark-mode .insight-card {
            background: linear-gradient(135deg, #1a1a2e 0%, #2a2a4a 100%);
            border: 1px solid #444466;
        }
        body.dark-mode .status.success {
            background: #1a3a1a;
            color: #66dd88;
        }
        body.dark-mode .status.info {
            background: #1a2a4a;
            color: #66aadd;
        }
        body.dark-mode .status.warning {
            background: #4a3a1a;
            color: #ddbb66;
        }
        body.dark-mode .upload-btn {
            background: linear-gradient(135deg, #3a3a5a 0%, #4a4a6a 100%);
        }
        body.dark-mode .btn-sm.primary { background: #4a6a9a; }
        body.dark-mode .btn-sm.primary:hover { background: #5a7aaa; }
        body.dark-mode .btn-sm.success { background: #2a6a4a; }
        body.dark-mode .btn-sm.success:hover { background: #3a7a5a; }
        body.dark-mode .btn-sm.info { background: #2a5a7a; }
        body.dark-mode .btn-sm.info:hover { background: #3a6a8a; }
        body.dark-mode .btn-sm.danger { background: #7a2a2a; }
        body.dark-mode .btn-sm.danger:hover { background: #8a3a3a; }
        body.dark-mode .btn-sm.warning { background: #7a6a2a; color: #e0e0e0; }
        body.dark-mode .btn-sm.warning:hover { background: #8a7a3a; }
        body.dark-mode .btn-sm.pdf { background: #7a2a2a; }
        body.dark-mode .btn-sm.pdf:hover { background: #8a3a3a; }
        body.dark-mode .btn-sm.excel { background: #1a6a3a; }
        body.dark-mode .btn-sm.excel:hover { background: #2a7a4a; }
        body.dark-mode .perf-excellent { background: #1a6a2a; color: #88dd88; }
        body.dark-mode .perf-good { background: #1a4a7a; color: #88bbdd; }
        body.dark-mode .perf-average { background: #6a5a1a; color: #ddbb66; }
        body.dark-mode .perf-poor { background: #6a1a1a; color: #dd6666; }
        body.dark-mode .category-equity { background: #1a4a1a; color: #66dd66; }
        body.dark-mode .category-debt { background: #4a3a1a; color: #ddbb66; }
        body.dark-mode .category-cash { background: #1a3a4a; color: #66bbdd; }
        body.dark-mode .category-hybrid { background: #3a1a4a; color: #bb66dd; }
        
        .xirr-badge {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: bold;
            display: inline-block;
        }
        .xirr-positive { background: #1a3a1a; color: #66dd88; }
        .xirr-negative { background: #3a1a1a; color: #dd6666; }
        .xirr-neutral { background: #2a2a2a; color: #888888; }
        body.dark-mode .xirr-positive { background: #1a5a1a; color: #88dd88; }
        body.dark-mode .xirr-negative { background: #5a1a1a; color: #dd6666; }
        
        .type-badge {
            padding: 2px 6px;
            border-radius: 3px;
            display: inline-block;
            color: #000000 !important;
            font-weight: 500;
        }
        .type-badge-direct {
            background: #e8f5e9;
            color: #000000 !important;
        }
        .type-badge-regular {
            background: #fff3e0;
            color: #000000 !important;
        }
        .type-badge-fd {
            background: #e3f2fd;
            color: #000000 !important;
        }
        body.dark-mode .type-badge-direct {
            background: #2a5a2a;
            color: #000000 !important;
        }
        body.dark-mode .type-badge-regular {
            background: #5a4a2a;
            color: #000000 !important;
        }
        body.dark-mode .type-badge-fd {
            background: #2a4a5a;
            color: #000000 !important;
        }
        
        /* AMC Link Styles */
        .amc-link {
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
            border-bottom: 1px dotted transparent;
        }
        .amc-link:hover {
            color: #2980b9;
            text-decoration: underline;
            border-bottom-color: #2980b9;
        }
        body.dark-mode .amc-link {
            color: #66aadd;
        }
        body.dark-mode .amc-link:hover {
            color: #88bbdd;
        }
        
        .dashboard { max-width: 1600px; margin: 0 auto; }
        
        .top-bar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: var(--radius-lg);
            padding: 12px 20px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            box-shadow: var(--shadow-lg);
            transition: background 0.4s;
        }
        body.dark-mode .top-bar {
            background: rgba(26, 26, 46, 0.85);
            border-color: rgba(255, 255, 255, 0.08);
        }
        .top-bar h1 { font-size: 19px; color: #1a1f36; font-weight: 800; letter-spacing: -0.3px; }
        .top-bar .subtitle { font-size: 11px; color: #7f8c8d; font-weight: 500; }
        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .toggle-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 10px;
            transition: all 0.25s;
            background: #f0f1f8;
        }
        .toggle-btn:hover { background: #e2e5f5; transform: translateY(-1px); }
        body.dark-mode .toggle-btn { background: #26264a; }
        body.dark-mode .toggle-btn:hover { background: #33336a; }
        
        .guide-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 10px;
            transition: all 0.25s;
            background: #f0f1f8;
        }
        .guide-btn:hover { background: #e2e5f5; transform: translateY(-1px); }
        body.dark-mode .guide-btn { background: #26264a; }
        body.dark-mode .guide-btn:hover { background: #33336a; }
        
        .calc-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 10px;
            transition: all 0.25s;
            background: #f0f1f8;
            color: #1a237e;
        }
        .calc-btn:hover { background: #e2e5f5; transform: translateY(-1px); }
        body.dark-mode .calc-btn { background: #26264a; color: #88bbdd; }
        body.dark-mode .calc-btn:hover { background: #33336a; }

        .stp-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 10px;
            transition: all 0.25s;
            background: #f0f1f8;
            color: #1a6a4a;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .stp-btn:hover { background: #d4ede4; transform: translateY(-1px); }
        body.dark-mode .stp-btn { background: #1a2a2a; color: #66dd99; }
        body.dark-mode .stp-btn:hover { background: #1a3a3a; }
        .stp-btn i { font-size: 1rem; }
        .stp-btn .label { font-size: 12px; font-weight: 600; margin-left: 2px; }
        
        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }
        .upload-btn-wrapper input[type=file] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .upload-btn {
            padding: 7px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s;
            display: inline-block;
            box-shadow: 0 3px 10px rgba(102, 126, 234, 0.35);
        }
        .upload-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(102, 126, 234, 0.45); opacity: 1; }
        
        .btn-sm {
            padding: 6px 14px;
            font-size: 11px;
            font-weight: 600;
            border-radius: 7px;
            border: none;
            cursor: pointer;
            transition: all 0.25s;
            white-space: nowrap;
            box-shadow: var(--shadow-sm);
        }
        .btn-sm:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .btn-sm.primary { background: #3498db; color: white; }
        .btn-sm.primary:hover { background: #2980b9; }
        .btn-sm.success { background: #27ae60; color: white; }
        .btn-sm.success:hover { background: #229954; }
        .btn-sm.info { background: #17a2b8; color: white; }
        .btn-sm.info:hover { background: #138496; }
        .btn-sm.danger { background: #e74c3c; color: white; }
        .btn-sm.danger:hover { background: #c0392b; }
        .btn-sm.warning { background: #f39c12; color: #2c3e50; }
        .btn-sm.warning:hover { background: #e67e22; }
        .btn-sm.pdf { background: #e74c3c; color: white; }
        .btn-sm.pdf:hover { background: #c0392b; }
        .btn-sm.excel { background: #1e8449; color: white; }
        .btn-sm.excel:hover { background: #196f3d; }
        .btn-sm.calc { background: #6a1b9a; color: white; }
        .btn-sm.calc:hover { background: #4a148c; }
        .btn-sm.table-pdf { background: #2c3e50; color: white; }
        .btn-sm.table-pdf:hover { background: #1a252f; }
        
        .status { padding: 6px 12px; border-radius: 5px; display: none; font-size: 12px; }
        .status.success { background: #e8f5e9; color: #2e7d32; display: block; }
        .status.info { background: #e3f2fd; color: #1565c0; display: block; }
        .status.warning { background: #fff3e0; color: #e65100; display: block; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 12px; }
        .stat-card {
            position: relative;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 14px 16px 12px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            transition: background 0.4s, transform 0.2s, box-shadow 0.2s;
            overflow: hidden;
            animation: fadeInUp 0.35s ease both;
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
        }
        .stat-card:nth-child(2)::before { background: linear-gradient(90deg, #43cea2, #185a9d); }
        .stat-card:nth-child(3)::before { background: linear-gradient(90deg, #f7971e, #ffd200); }
        .stat-card:nth-child(4)::before { background: linear-gradient(90deg, #ff9a9e, #f43b47); }
        .stat-card:nth-child(5)::before { background: linear-gradient(90deg, #38ef7d, #11998e); }
        .stat-card:nth-child(6)::before { background: linear-gradient(90deg, #a18cd1, #fbc2eb); }
        .stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
        .stat-card h3 { color: #8a94a6; font-size: 10.5px; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.6px; font-weight: 700; }
        .stat-card .value { font-size: 21px; font-weight: 800; color: #1a1f36; letter-spacing: -0.3px; }
        .stat-card .trend { font-size: 10px; margin-top: 3px; font-weight: 600; }
        .trend.up { color: #27ae60; }
        .trend.down { color: #e74c3c; }
        
        .analysis-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 12px; }
        .analysis-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 14px 16px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            break-inside: avoid;
            page-break-inside: avoid;
            transition: background 0.4s, transform 0.2s, box-shadow 0.2s;
            animation: fadeInUp 0.4s ease both;
        }
        .analysis-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
        .analysis-card h3 { color: #1a1f36; margin-bottom: 10px; border-left: 3px solid var(--accent-1); padding-left: 9px; font-size: 13px; font-weight: 700; }
        .analysis-grid > .analysis-card:nth-child(1) { grid-column: span 2; grid-row: span 2; }
        .analysis-grid > .analysis-card:nth-child(1) .chart-wrapper { height: 460px; }
        .chart-wrapper { 
            position: relative; 
            height: 220px; 
            width: 100%;
            margin-bottom: 5px;
        }
        .chart-wrapper canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }
        
        .controls {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            margin-bottom: 12px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            box-shadow: var(--shadow-md);
            transition: background 0.4s;
        }
        .controls select { padding: 6px 10px; border: 1px solid #e2e6f0; border-radius: 8px; font-size: 12px; min-width: 130px; background: #fafbff; cursor: pointer; transition: border-color 0.2s; }
        .controls select[multiple] { min-width: 130px; height: 82px; padding: 3px 6px; font-size: 11px; border: 1px solid #e2e6f0; border-radius: 8px; background: #fafbff; }
        .controls select[multiple]:focus { outline: none; border-color: var(--accent-1); box-shadow: 0 0 0 3px rgba(102,126,234,0.15); }
        .controls select:focus { outline: none; border-color: var(--accent-1); box-shadow: 0 0 0 3px rgba(102,126,234,0.15); }
        .controls input[type="text"] { padding: 7px 12px; border: 1px solid #e2e6f0; border-radius: 20px; font-size: 12px; flex: 1; min-width: 120px; background: #fafbff; }
        .controls input[type="text"]:focus { outline: none; border-color: var(--accent-1); box-shadow: 0 0 0 3px rgba(102,126,234,0.15); }
        .filter-group { display: flex; align-items: center; gap: 5px; background: #f5f6fb; padding: 4px 8px 4px 10px; border-radius: 10px; }
        .filter-group label { font-size: 9.5px; color: #7f8c8d; font-weight: 700; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.3px; }
        body.dark-mode .filter-group { background: #24243f; }
        
        .table-container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            overflow-x: auto;
            box-shadow: var(--shadow-md);
            margin-bottom: 12px;
            transition: background 0.4s;
        }
        .table-container h3 { font-size: 14px; margin-bottom: 10px; color: #1a1f36; font-weight: 700; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        th, td { padding: 6px 9px; text-align: left; border-bottom: 1px solid #eef1f6; }
        th {
            background: linear-gradient(135deg, #2c3555 0%, #1a1f36 100%);
            color: white;
            position: sticky;
            top: 0;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            font-size: 10px;
            padding: 8px 9px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }
        th:first-child { border-top-left-radius: 8px; }
        th:last-child { border-top-right-radius: 8px; }
        th:hover { background: linear-gradient(135deg, #3a4570 0%, #262c4a 100%); }
        tbody tr:nth-child(even) { background: rgba(102, 126, 234, 0.03); }
        tr:hover { background: #eef1fb !important; }
        body.dark-mode tbody tr:nth-child(even) { background: rgba(102, 126, 234, 0.06); }
        body.dark-mode tr:hover { background: #2a2a4a !important; }
        
        .perf-badge { padding: 2px 10px; border-radius: 12px; font-size: 10px; font-weight: bold; display: inline-block; }
        .perf-excellent { background: #27ae60; color: white; }
        .perf-good { background: #3498db; color: white; }
        .perf-average { background: #f39c12; color: white; }
        .perf-poor { background: #e74c3c; color: white; }
        
        .category-badge { padding: 2px 8px; border-radius: 12px; font-size: 9px; font-weight: bold; display: inline-block; }
        .category-equity { background: #e8f5e9; color: #2e7d32; }
        .category-debt { background: #fff3e0; color: #e65100; }
        .category-cash { background: #e3f2fd; color: #1565c0; }
        .category-hybrid { background: #f3e5f5; color: #6a1b9a; }
        
        .weightage-bar {
            display: inline-block;
            height: 6px;
            border-radius: 3px;
            background: #3498db;
            margin-right: 4px;
            vertical-align: middle;
        }
        body.dark-mode .weightage-bar {
            background: #5a8ab5;
        }
        
        .insights { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 12px; }
        .insight-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px 16px;
            border-radius: var(--radius-md);
            break-inside: avoid;
            page-break-inside: avoid;
            transition: background 0.4s, transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
            position: relative;
            overflow: hidden;
        }
        .insight-card::after {
            content: '';
            position: absolute;
            top: -30%; right: -20%;
            width: 120px; height: 120px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
        }
        .insight-card:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(102, 126, 234, 0.4); }
        .insight-card h4 { margin-bottom: 4px; font-size: 11px; opacity: 0.85; font-weight: 600; letter-spacing: 0.2px; }
        .insight-card .big-number { font-size: 23px; font-weight: 800; letter-spacing: -0.3px; }
        .insight-card p { font-size: 10px; opacity: 0.9; margin-top: 2px; }
