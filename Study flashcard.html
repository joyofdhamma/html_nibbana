<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Study Organizer — Notes & Flashcards</title>
  <style>
    :root{
      --bg:#0f1724; --panel:#0b1220; --muted:#94a3b8; --accent:#60a5fa; --glass: rgba(255,255,255,0.03);
      --card:#0b1220; --success:#10b981; --danger:#ef4444;
    }
    *{box-sizing:border-box}
    html,body{height:100%; margin:0; font-family:Inter, system-ui, -apple-system, Segoe UI, Roboto, 'Helvetica Neue', Arial; background:linear-gradient(180deg,#071029 0%, #051227 100%); color:#e6eef8}
    .app{display:grid; grid-template-columns:280px 420px 1fr; gap:16px; height:100vh; padding:16px}
    .sidebar, .cascader, .canvas{background:var(--panel); border-radius:12px; padding:12px; box-shadow: 0 6px 18px rgba(2,6,23,0.6); overflow:auto}

    .brand{display:flex; gap:8px; align-items:center; margin-bottom:12px}
    .logo{width:42px; height:42px; border-radius:10px; background:linear-gradient(135deg,var(--accent),#7c3aed); display:grid; place-items:center; font-weight:700}
    h1{font-size:14px;margin:0}
    .muted{color:var(--muted); font-size:13px}

    .list{margin-top:8px}
    .item{display:flex; align-items:center; gap:8px; padding:8px; border-radius:8px; cursor:pointer}
    .item:hover{background:var(--glass)}
    .item.active{background:linear-gradient(90deg, rgba(96,165,250,0.12), rgba(124,58,237,0.06)); border:1px solid rgba(96,165,250,0.12)}
    .item .badge{margin-left:auto; background:rgba(255,255,255,0.04); padding:4px 8px; border-radius:999px; font-size:12px}
    .item .actions{display:none; margin-left:auto; gap:4px}
    .item:hover .actions{display:flex}
    .item .actions button{background:transparent; border:none; color:var(--muted); padding:2px 4px; cursor:pointer; font-size:12px}
    .item .actions button:hover{color:var(--accent)}

    .controls{display:flex; gap:8px; margin-top:10px}
    button, .btn{background:transparent; border:1px solid rgba(255,255,255,0.06); color:inherit; padding:8px 10px; border-radius:8px; cursor:pointer}
    .btn.primary{background:var(--accent); color:#022; border:0}
    .search{width:100%; padding:8px; border-radius:8px; border:1px solid rgba(255,255,255,0.04); background:#061226; color:inherit}

    /* cascader */
    .tree{display:flex; gap:8px}
    .col{flex:1; min-width:120px}
    .col h3{margin:6px 0 8px 0; font-size:13px}
    .node{padding:8px;border-radius:8px;margin-bottom:6px; cursor:pointer; display:flex; align-items:center; gap:4px}
    .node:hover{background:var(--glass)}
    .node.active{background:rgba(255,255,255,0.02); border-left:3px solid var(--accent)}
    .node .actions{display:none; margin-left:auto; gap:4px}
    .node:hover .actions{display:flex}
    .node .actions button{background:transparent; border:none; color:var(--muted); padding:2px 4px; cursor:pointer; font-size:12px}
    .node .actions button:hover{color:var(--accent)}

    /* canvas */
    .note-header{display:flex; gap:8px; align-items:center; margin-bottom:8px}
    .note-title{font-size:18px; font-weight:600}
    .note-body{background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent); padding:12px; border-radius:10px; min-height:320px}
    .editor{width:100%; min-height:320px; background:transparent; color:inherit; border:0; outline:none; font-size:14px}

    .flashcard-panel{margin-top:12px}
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); padding:18px; border-radius:12px; text-align:center}
    .card .front{font-size:18px; min-height:80px}
    .small{font-size:13px; color:var(--muted)}

    .modal{position:fixed; inset:0; display:none; align-items:center; justify-content:center; backdrop-filter: blur(4px);}
    .modal.open{display:flex}
    .modal .box{width:90%; max-width:900px; background:var(--panel); padding:18px; border-radius:12px}
    .row{display:flex; gap:8px}
    input, textarea, select{background:#061226; color:inherit; border:1px solid rgba(255,255,255,0.04); padding:8px; border-radius:8px; width:100%}

    .toolbar{display:flex; gap:8px; align-items:center}
    .grow{flex:1}

    /* responsive */
    @media(max-width:1000px){.app{grid-template-columns:1fr; grid-auto-rows: auto; padding:10px}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="logo">S</div><div><h1>Study Organizer</h1><div class="muted">Notes • Cascading • Flashcards</div></div></div>

      <div class="controls">
        <button id="addSubjectBtn" class="btn primary">+ Subject</button>
        <button id="importBtn" class="btn">Import</button>
      </div>

      <input id="search" class="search" placeholder="Search subjects, notes..." />

      <div class="list" id="subjectsList"></div>

      <div style="margin-top:12px" class="muted">Tip: Click a subject -> pick a chapter -> click note to open full page.</div>
    </aside>

    <section class="cascader">
      <div class="toolbar"><div class="muted">Cascading View</div><div class="grow"></div><button id="addChapterBtn" class="btn">+ Chapter</button><button id="addNoteBtn" class="btn">+ Note</button></div>

      <div class="tree" id="cascaderTree" style="margin-top:12px"></div>

    </section>

    <main class="canvas">
      <div class="note-header">
        <div>
          <div class="note-title" id="noteTitle">Welcome — pick or create a note</div>
          <div class="small" id="noteMeta">No note open</div>
        </div>
        <div style="margin-left:auto" class="toolbar">
          <button id="editNoteBtn" class="btn">Edit</button>
          <button id="fullViewBtn" class="btn">Full page</button>
          <button id="flashcardsBtn" class="btn">Flashcards</button>
          <button id="exportBtn" class="btn">Export JSON</button>
        </div>
      </div>

      <div class="note-body">
        <textarea id="noteEditor" class="editor" placeholder="Write your notes here..."></textarea>
      </div>

      <div class="flashcard-panel" id="flashcardPanel" style="display:none">
        <div class="row" style="margin-top:10px">
          <input id="fcFront" placeholder="Front (question)" />
          <input id="fcBack" placeholder="Back (answer)" />
          <button id="addFcBtn" class="btn">Add Card</button>
        </div>
        <div style="margin-top:12px" id="cardsContainer"></div>
      </div>

    </main>
  </div>

  <!-- modals -->
  <div id="modal" class="modal">
    <div class="box">
      <h3 id="modalTitle">New</h3>
      <div id="modalContent"></div>
      <div style="margin-top:12px; text-align:right"><button id="modalCancel" class="btn">Cancel</button> <button id="modalSave" class="btn primary">Save</button></div>
    </div>
  </div>

  <!-- full page view -->
  <div id="fullModal" class="modal"><div class="box" style="max-width:100%; height:90vh; overflow:auto"><div style="display:flex; justify-content:space-between; align-items:center"><h2 id="fullTitle"></h2><div><button id="closeFull" class="btn">Close</button></div></div><div id="fullContent" style="margin-top:12px; white-space:pre-wrap"></div></div></div>

  <script>
    // Simple persistent store using localStorage
    const STORAGE_KEY = 'study_org_v1';
    let store = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || { subjects: [] };

    // UI elements
    const subjectsList = document.getElementById('subjectsList');
    const cascaderTree = document.getElementById('cascaderTree');
    const noteEditor = document.getElementById('noteEditor');
    const noteTitle = document.getElementById('noteTitle');
    const noteMeta = document.getElementById('noteMeta');
    const addSubjectBtn = document.getElementById('addSubjectBtn');
    const addChapterBtn = document.getElementById('addChapterBtn');
    const addNoteBtn = document.getElementById('addNoteBtn');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const modalContent = document.getElementById('modalContent');
    const modalSave = document.getElementById('modalSave');
    const modalCancel = document.getElementById('modalCancel');
    const fullModal = document.getElementById('fullModal');
    const fullTitle = document.getElementById('fullTitle');
    const fullContent = document.getElementById('fullContent');
    const closeFull = document.getElementById('closeFull');
    const fullViewBtn = document.getElementById('fullViewBtn');
    const flashcardsBtn = document.getElementById('flashcardsBtn');
    const flashcardPanel = document.getElementById('flashcardPanel');
    const fcFront = document.getElementById('fcFront');
    const fcBack = document.getElementById('fcBack');
    const addFcBtn = document.getElementById('addFcBtn');
    const cardsContainer = document.getElementById('cardsContainer');
    const exportBtn = document.getElementById('exportBtn');
    const search = document.getElementById('search');
    const editNoteBtn = document.getElementById('editNoteBtn');

    let current = { subjectId: null, chapterId: null, noteId: null };

    function saveStore(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }

    function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

    // Render subjects list
    function renderSubjects(filter=''){
      subjectsList.innerHTML = '';
      const frag = document.createDocumentFragment();
      store.subjects.forEach(sub => {
        if(filter && ![sub.title, ...sub.chapters.map(c=>c.title)].join(' ').toLowerCase().includes(filter.toLowerCase())) return;
        const el = document.createElement('div'); 
        el.className='item'+(sub.id===current.subjectId ? ' active':'');
        el.innerHTML = `
          <div style="font-weight:600">${escapeHtml(sub.title)}</div>
          <div class='badge'>${sub.chapters.length}</div>
          <div class='actions'>
            <button title='Edit' data-id='${sub.id}' data-type='subject'>✏️</button>
            <button title='Delete' data-id='${sub.id}' data-type='subject'>🗑️</button>
          </div>`;
        el.onclick = (e)=> {
          if(!e.target.closest('.actions')) {
            current.subjectId = sub.id; 
            current.chapterId=null; 
            current.noteId=null; 
            renderAll();
          }
        };
        frag.appendChild(el);
      });
      subjectsList.appendChild(frag);
      
      // Attach event listeners to action buttons
      subjectsList.querySelectorAll('.actions button').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = btn.getAttribute('data-id');
          const type = btn.getAttribute('data-type');
          
          if(btn.textContent.includes('✏️')) {
            editItem(type, id);
          } else if(btn.textContent.includes('🗑️')) {
            deleteItem(type, id);
          }
        });
      });
    }

    function renderCascader(){
      cascaderTree.innerHTML = '';
      const subjectCol = document.createElement('div'); subjectCol.className='col';
      const chaptersCol = document.createElement('div'); chaptersCol.className='col';
      const notesCol = document.createElement('div'); notesCol.className='col';

      subjectCol.innerHTML = '<h3>Subjects</h3>';
      store.subjects.forEach(s=>{
        const node = document.createElement('div'); 
        node.className='node'+(s.id===current.subjectId?' active':''); 
        node.innerHTML = `
          <span>${escapeHtml(s.title)}</span>
          <div class='actions'>
            <button title='Edit' data-id='${s.id}' data-type='subject'>✏️</button>
            <button title='Delete' data-id='${s.id}' data-type='subject'>🗑️</button>
          </div>`;
        node.onclick=(e)=> {
          if(!e.target.closest('.actions')) {
            current.subjectId=s.id; 
            current.chapterId=null; 
            current.noteId=null; 
            renderAll();
          }
        };
        subjectCol.appendChild(node);
      });

      chaptersCol.innerHTML = '<h3>Chapters</h3>';
      const subj = store.subjects.find(s=>s.id===current.subjectId);
      if(subj){ 
        subj.chapters.forEach(ch=>{ 
          const node=document.createElement('div'); 
          node.className='node'+(ch.id===current.chapterId?' active':''); 
          node.innerHTML = `
            <span>${escapeHtml(ch.title)}</span>
            <div class='actions'>
              <button title='Edit' data-id='${ch.id}' data-type='chapter' data-parent='${subj.id}'>✏️</button>
              <button title='Delete' data-id='${ch.id}' data-type='chapter' data-parent='${subj.id}'>🗑️</button>
            </div>`;
          node.onclick=(e)=> {
            if(!e.target.closest('.actions')) {
              current.chapterId=ch.id; 
              current.noteId=null; 
              renderAll();
            }
          };
          chaptersCol.appendChild(node); 
        }); 
      }

      notesCol.innerHTML = '<h3>Notes</h3>';
      if(subj && current.chapterId){ 
        const chapter = subj.chapters.find(c=>c.id===current.chapterId); 
        if(chapter) {
          chapter.notes.forEach(n=>{ 
            const node=document.createElement('div'); 
            node.className='node'+(n.id===current.noteId?' active':''); 
            node.innerHTML = `
              <span>${escapeHtml(n.title)}</span>
              <div class='actions'>
                <button title='Edit' data-id='${n.id}' data-type='note' data-parent='${chapter.id}'>✏️</button>
                <button title='Delete' data-id='${n.id}' data-type='note' data-parent='${chapter.id}'>🗑️</button>
              </div>`;
            node.onclick=(e)=> {
              if(!e.target.closest('.actions')) {
                current.noteId=n.id; 
                openNote();
              }
            };
            notesCol.appendChild(node); 
          }); 
        }
      }

      cascaderTree.appendChild(subjectCol); 
      cascaderTree.appendChild(chaptersCol); 
      cascaderTree.appendChild(notesCol);
      
      // Attach event listeners to action buttons in cascader
      cascaderTree.querySelectorAll('.actions button').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = btn.getAttribute('data-id');
          const type = btn.getAttribute('data-type');
          const parentId = btn.getAttribute('data-parent');
          
          if(btn.textContent.includes('✏️')) {
            editItem(type, id, parentId);
          } else if(btn.textContent.includes('🗑️')) {
            deleteItem(type, id, parentId);
          }
        });
      });
    }

    function renderAll(){ renderSubjects(search.value); renderCascader(); renderEditor(); renderFlashcards(); }

    // Editor functions
    function openNote(){
      const note = getCurrentNote();
      if(!note){ 
        noteTitle.textContent='No note selected'; 
        noteMeta.textContent=''; 
        noteEditor.value=''; 
        editNoteBtn.style.display = 'none';
        return; 
      }
      noteTitle.textContent = note.title;
      noteMeta.textContent = `Subject: ${getCurrentSubject().title} › Chapter: ${getCurrentChapter().title}`;
      noteEditor.value = note.content || '';
      flashcardPanel.style.display = 'none';
      editNoteBtn.style.display = 'inline-block';
    }

    function renderEditor(){ openNote(); }

    noteEditor.addEventListener('input', ()=>{
      const note = getCurrentNote(); if(!note) return;
      note.content = noteEditor.value; note.updated = Date.now(); saveStore(); renderSubjects();
    });

    function getCurrentSubject(){ return store.subjects.find(s=>s.id===current.subjectId); }
    function getCurrentChapter(){ const s=getCurrentSubject(); return s?.chapters.find(c=>c.id===current.chapterId); }
    function getCurrentNote(){ const ch=getCurrentChapter(); return ch?.notes.find(n=>n.id===current.noteId); }

    // Edit/Delete functions
    function editItem(type, id, parentId = null) {
      let item, title, placeholder;
      
      if (type === 'subject') {
        item = store.subjects.find(s => s.id === id);
        title = 'Edit Subject';
        placeholder = 'Subject title';
      } else if (type === 'chapter') {
        const subject = store.subjects.find(s => s.id === parentId);
        item = subject.chapters.find(c => c.id === id);
        title = 'Edit Chapter';
        placeholder = 'Chapter title';
      } else if (type === 'note') {
        const subject = store.subjects.find(s => s.chapters.some(c => c.id === parentId));
        const chapter = subject.chapters.find(c => c.id === parentId);
        item = chapter.notes.find(n => n.id === id);
        title = 'Edit Note';
        placeholder = 'Note title';
      }
      
      if (!item) return;
      
      openModal(title, `<input id='editField' placeholder='${placeholder}' value='${escapeHtml(item.title)}' />`, () => {
        const newTitle = document.getElementById('editField').value.trim();
        if (!newTitle) return alert('Please enter a title');
        
        item.title = newTitle;
        if (type === 'note') item.updated = Date.now();
        
        saveStore();
        renderAll();
        
        // Keep the current note open if we're editing it
        if (type === 'note' && id === current.noteId) {
          noteTitle.textContent = newTitle;
        }
      });
    }
    
    function deleteItem(type, id, parentId = null) {
      if (!confirm(`Are you sure you want to delete this ${type}?`)) return;
      
      if (type === 'subject') {
        // Check if we're deleting the currently selected subject
        if (current.subjectId === id) {
          current.subjectId = null;
          current.chapterId = null;
          current.noteId = null;
        }
        store.subjects = store.subjects.filter(s => s.id !== id);
      } else if (type === 'chapter') {
        const subject = store.subjects.find(s => s.id === parentId);
        // Check if we're deleting the currently selected chapter
        if (current.chapterId === id) {
          current.chapterId = null;
          current.noteId = null;
        }
        subject.chapters = subject.chapters.filter(c => c.id !== id);
      } else if (type === 'note') {
        const subject = store.subjects.find(s => s.chapters.some(c => c.id === parentId));
        const chapter = subject.chapters.find(c => c.id === parentId);
        // Check if we're deleting the currently selected note
        if (current.noteId === id) {
          current.noteId = null;
          noteTitle.textContent = 'No note selected';
          noteMeta.textContent = '';
          noteEditor.value = '';
        }
        chapter.notes = chapter.notes.filter(n => n.id !== id);
      }
      
      saveStore();
      renderAll();
    }

    // Modal helpers
    function openModal(title, html, onSave){ 
      modalTitle.textContent=title; 
      modalContent.innerHTML=html; 
      modal.classList.add('open');
      
      // Focus the first input field in the modal
      setTimeout(() => {
        const input = modalContent.querySelector('input, textarea, select');
        if (input) input.focus();
      }, 50);
      
      modalSave.onclick = ()=>{ onSave(); modal.classList.remove('open'); };
      modalCancel.onclick = ()=>{ modal.classList.remove('open'); };
    }

    addSubjectBtn.onclick = ()=>{
      openModal('New Subject', `<div style="display:flex; gap:8px"><input id='subTitle' placeholder='Subject title' /></div>`, ()=>{
        const title = document.getElementById('subTitle').value.trim(); 
        if(!title) return alert('Please enter title');
        store.subjects.push({ id:uid(), title, chapters:[], created:Date.now() }); 
        saveStore(); 
        renderAll();
      });
    };

    addChapterBtn.onclick = ()=>{
      if(!current.subjectId) return alert('Pick a subject first');
      openModal('New Chapter', `<input id='chTitle' placeholder='Chapter title' />`, ()=>{
        const title = document.getElementById('chTitle').value.trim(); 
        if(!title) return alert('Please enter title');
        const subj = getCurrentSubject(); 
        subj.chapters.push({ id:uid(), title, notes:[] }); 
        saveStore(); 
        renderAll();
      });
    };

    addNoteBtn.onclick = ()=>{
      if(!current.chapterId) return alert('Pick a chapter first');
      openModal('New Note', `<input id='nTitle' placeholder='Note title' />`, ()=>{
        const title = document.getElementById('nTitle').value.trim(); 
        if(!title) return alert('Please enter title');
        const ch = getCurrentChapter(); 
        const note = { id:uid(), title, content:'', created:Date.now(), flashcards:[] }; 
        ch.notes.push(note); 
        saveStore(); 
        current.noteId = note.id; 
        renderAll();
      });
    };
    
    editNoteBtn.onclick = () => {
      const note = getCurrentNote();
      if (!note) return;
      editItem('note', note.id, current.chapterId);
    };

    // Full page view
    fullViewBtn.onclick = ()=>{
      const note = getCurrentNote(); 
      if(!note) return alert('Open a note first'); 
      fullTitle.textContent = note.title; 
      fullContent.textContent = note.content || '(empty)'; 
      fullModal.classList.add('open'); 
    };
    closeFull.onclick = ()=> fullModal.classList.remove('open');

    // Flashcards
    flashcardsBtn.onclick = ()=>{
      const note = getCurrentNote(); 
      if(!note) return alert('Open a note first'); 
      flashcardPanel.style.display = flashcardPanel.style.display === 'none' ? 'block' : 'none'; 
      renderFlashcards(); 
    };

    function renderFlashcards(){ 
      cardsContainer.innerHTML=''; 
      const note = getCurrentNote(); 
      if(!note) return; 
      if(!note.flashcards) note.flashcards=[];
      
      note.flashcards.forEach((c, i)=>{
        const div = document.createElement('div'); 
        div.className='card'; 
        div.style.marginTop='8px'; 
        div.innerHTML = `
          <div style='display:flex; justify-content:space-between; align-items:center'>
            <div style='font-weight:600'>Card ${i+1}</div>
            <div>
              <button data-i='${i}' class='btn'>Edit</button> 
              <button data-i='${i}' class='btn'>Delete</button>
            </div>
          </div>
          <div style='margin-top:8px' class='small'><strong>Q:</strong> ${escapeHtml(c.front)}</div>
          <div class='small'><strong>A:</strong> ${escapeHtml(c.back)}</div>`;
        cardsContainer.appendChild(div);
      });

      // attach events
      cardsContainer.querySelectorAll('button').forEach(b=>{
        b.onclick = (e)=>{
          const idx = parseInt(b.getAttribute('data-i'));
          if(b.textContent.trim()==='Delete'){ 
            if(confirm('Delete this card?')){ 
              getCurrentNote().flashcards.splice(idx,1); 
              saveStore(); 
              renderFlashcards(); 
            } 
          }
          else{ 
            const c = getCurrentNote().flashcards[idx]; 
            openModal('Edit Card', `
              <input id='eF' placeholder='Front' value='${escapeHtml(c.front)}'/>
              <input id='eB' placeholder='Back' value='${escapeHtml(c.back)}' style='margin-top:8px'/>`, 
              ()=>{ 
                c.front=document.getElementById('eF').value; 
                c.back=document.getElementById('eB').value; 
                saveStore(); 
                renderFlashcards(); 
              }
            ); 
          }
        };
      });
    }

    addFcBtn.onclick = ()=>{
      const note = getCurrentNote(); 
      if(!note) return alert('Open a note first'); 
      const f = fcFront.value.trim(); 
      const b = fcBack.value.trim(); 
      if(!f||!b) return alert('enter front and back'); 
      note.flashcards = note.flashcards||[]; 
      note.flashcards.push({id:uid(), front:f, back:b}); 
      fcFront.value=''; 
      fcBack.value=''; 
      saveStore(); 
      renderFlashcards(); 
    }

    // Flashcard study mode (simple modal)
    function startStudy(note){ 
      if(!note || !note.flashcards || note.flashcards.length===0) return alert('No flashcards to study'); 
      const cards = [...note.flashcards]; 
      let idx=0; 
      let flipped=false; 
      const studyModalHtml = `
        <div style='text-align:center'>
          <div id='studyCard' class='card'>
            <div id='studyText' class='front'>${escapeHtml(cards[0].front)}</div>
          </div>
          <div style='display:flex; gap:8px; justify-content:center; margin-top:12px'>
            <button id='prev' class='btn'>Prev</button>
            <button id='flip' class='btn primary'>Flip</button>
            <button id='next' class='btn'>Next</button>
          </div>
        </div>`;
      openModal('Study Flashcards', studyModalHtml, ()=>{});
      // after modal open, attach behaviour
      setTimeout(()=>{
        const studyText = document.getElementById('studyText'); 
        const flipBtn = document.getElementById('flip'); 
        const prev = document.getElementById('prev'); 
        const next = document.getElementById('next'); 
        function show(){ studyText.textContent = flipped ? cards[idx].back : cards[idx].front; }
        flipBtn.onclick = ()=>{ flipped=!flipped; show(); };
        prev.onclick = ()=>{ idx = (idx-1+cards.length)%cards.length; flipped=false; show(); };
        next.onclick = ()=>{ idx = (idx+1)%cards.length; flipped=false; show(); };
      },50);
    }

    // export
    exportBtn.onclick = ()=>{ 
      const data = JSON.stringify(store, null, 2); 
      const blob = new Blob([data], {type:'application/json'}); 
      const url = URL.createObjectURL(blob); 
      const a = document.createElement('a'); 
      a.href=url; 
      a.download='study_org_export.json'; 
      a.click(); 
      URL.revokeObjectURL(url); 
    }

    // small helpers
    function escapeHtml(str){ 
      if(!str) return ''; 
      return String(str)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');
    }

    // search
    search.addEventListener('input', ()=> renderAll());

    // import json support
    document.getElementById('importBtn').onclick = ()=>{
      openModal('Import JSON', `<textarea id='importArea' style='width:100%; min-height:120px' placeholder='Paste JSON here'></textarea>`, ()=>{
        try{ 
          const j = JSON.parse(document.getElementById('importArea').value); 
          if(!j.subjects) throw 'invalid'; 
          store=j; 
          saveStore(); 
          renderAll(); 
        } catch(e) { 
          alert('Invalid JSON') 
        }
      });
    };

    // initial demo data
    if(store.subjects.length===0){ 
      store.subjects.push({ 
        id:uid(), 
        title:'Physics', 
        chapters:[
          {
            id:uid(), 
            title:'Mechanics', 
            notes:[
              {
                id:uid(), 
                title:'Kinematics', 
                content:'- Definitions\n- Equations of motion\n\nExample: s = ut + 1/2 a t^2', 
                flashcards:[
                  {id:uid(),front:'Equations of motion for constant acceleration?', back:'v = u + at; s = ut + 1/2 at^2; v^2 = u^2 + 2as'}
                ]
              }
            ]
          }
        ]
      }); 
      saveStore(); 
    }

    // study button behaviour in side
    flashcardsBtn.addEventListener('click', ()=>{ 
      const note = getCurrentNote(); 
      if(!note) return; 
      startStudy(note); 
    });

    // initial render
    renderAll();

  </script>
</body>
</html>
