<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a1230">
<meta name="mobile-web-app-capable" content="yes">
<title>Navratri Sadhana</title>
<style>
:root{
  --bg:#fbf5ea;--card:#ffffff;--ink:#2a1a12;--mut:#76665a;--line:#eadfcf;--soft:#f5ecdc;
  --pri:#8f1d33;--pri-ink:#fff;--acc:#E3B21A;--acc-ink:#2b2200;--edge:#E3B21A;
  --ok:#2e7d4f;--shadow:0 1px 2px rgba(60,30,10,.08),0 4px 14px rgba(60,30,10,.06);
  --nav:62px;
}
:root[data-theme="dark"]{
  --bg:#150e0b;--card:#231915;--ink:#f6ecdf;--mut:#b7a698;--line:#3a2c25;--soft:#2d211c;
  --pri:#e5694f;--pri-ink:#1b0c07;--ok:#5cc58a;--shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari","Noto Sans Bengali",sans-serif;
  line-height:1.45;overscroll-behavior-y:contain}
[lang=hi],.hi{font-family:"Noto Sans Devanagari","Mukta","Hind","Nirmala UI","Mangal",system-ui,sans-serif}
[lang=bn]{font-family:"Noto Sans Bengali","Nirmala UI","Vrinda",system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
h1,h2,h3,p{margin:0}
#app{padding:0 0 calc(var(--nav) + 24px + env(safe-area-inset-bottom));min-height:100vh}
.wrap{padding:0 16px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 6px;
  border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-weight:700;font-size:1.05rem;letter-spacing:.2px}
.dl{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--pri);background:var(--soft);border:1px solid var(--line);text-decoration:none;flex:0 0 40px}
.brand small{display:block;font-weight:500;font-size:.72rem;color:var(--mut);letter-spacing:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 6px;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;scroll-snap-align:center;width:52px;padding:6px 0 5px;border-radius:14px;background:var(--card);
  border:1.5px solid var(--line);text-align:center;position:relative}
.dchip b{display:block;font-size:1rem;line-height:1.1}
.dchip span{display:block;font-size:.66rem;color:var(--mut)}
.dchip i{position:absolute;left:10px;right:10px;bottom:3px;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.dchip i u{display:block;height:100%;background:var(--ok);text-decoration:none}
.dchip.sel{background:var(--acc);color:var(--acc-ink);border-color:var(--edge)}
.dchip.sel span{color:inherit;opacity:.8}
.dchip.today::after{content:"";position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--pri)}

/* hero */
.hero{display:flex;gap:14px;margin:14px 16px 0;padding:12px;border-radius:22px;background:var(--card);box-shadow:var(--shadow);
  border:1.5px solid var(--edge);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,var(--acc) 0,transparent 55%);opacity:.18;pointer-events:none}
.hero .pic{flex:0 0 37%;max-width:150px;aspect-ratio:3/4;border-radius:16px;background:#fff;overflow:hidden;position:relative;z-index:1;
  display:flex;align-items:center;justify-content:center}
.hero .pic img{width:100%;height:100%;object-fit:contain}
.hero .txt{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;min-width:0}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);font-weight:600}
.hero h1{font-size:1.65rem;line-height:1.25;margin:2px 0}
.hero .en{color:var(--mut);font-size:.95rem}
.hero .mt{margin-top:8px;font-size:1.02rem;line-height:1.5;font-weight:600}

.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 16px 0}
.fact{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:center;min-height:56px;min-width:0}
.fact .k{font-size:.68rem;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);font-weight:600}
.fact .v{font-size:.95rem;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.sw{flex:0 0 30px;height:30px;border-radius:50%;border:2px solid var(--edge);background:var(--acc)}
.fthumb{flex:0 0 38px;height:38px;border-radius:10px;object-fit:cover}

.next{margin:12px 16px 0;padding:14px;border-radius:18px;background:var(--pri);color:var(--pri-ink);display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.next .t{flex:1;min-width:0}
.next .t b{display:block;font-size:1rem}
.next .t span{font-size:.85rem;opacity:.9}
.btn{min-height:46px;padding:0 18px;border-radius:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.p{background:var(--pri);color:var(--pri-ink)}
.btn.w{background:var(--pri-ink);color:var(--pri)}
:root[data-theme="dark"] .next .btn.w{background:#1b0c07;color:var(--pri)}
.btn.g{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:38px;padding:0 12px;font-size:.88rem;border-radius:12px}

/* segmented tabs */
.seg{display:flex;margin:16px 16px 0;background:var(--soft);border-radius:14px;padding:4px;gap:2px}
.seg button{flex:1;min-height:42px;border-radius:11px;font-size:.84rem;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.seg button em{font-style:normal;font-size:.62rem;font-weight:500;opacity:.8}

.sec{margin:12px 16px 0}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 8px}
.sess{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:14px 4px 4px}
.sechead h2{font-size:1.05rem}
.sechead .pg{font-size:.82rem;color:var(--mut)}
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.item{display:flex;align-items:center;min-height:62px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.cb{flex:0 0 58px;align-self:stretch;display:flex;align-items:center;justify-content:center}
.cb span{width:28px;height:28px;border-radius:50%;border:2px solid var(--mut);display:flex;align-items:center;justify-content:center;color:transparent;font-size:.95rem;font-weight:800;transition:.15s}
.item.done .cb span{background:var(--ok);border-color:var(--ok);color:#fff}
.item .body{flex:1;min-width:0;padding:8px 0;text-align:left;align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.item .tt{font-weight:600;font-size:.98rem}
.item.done .tt{color:var(--mut);text-decoration:line-through;text-decoration-thickness:1px}
.item .ss{font-size:.8rem;color:var(--mut);overflow-wrap:anywhere}
.item .go{flex:0 0 44px;text-align:center;color:var(--mut);font-size:1.3rem}
.tag{display:inline-block;font-size:.62rem;text-transform:uppercase;letter-spacing:.6px;padding:1px 6px;border-radius:6px;background:var(--soft);color:var(--mut);margin-left:6px;vertical-align:middle;font-weight:700}
.badge{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:10px;background:var(--soft);color:var(--mut);margin-left:6px}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.card + .card{margin-top:10px}
.card h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin-bottom:6px}
.bn{font-size:1rem;line-height:1.75;white-space:pre-line}
details.acc{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:10px;overflow:hidden}
details.acc summary{list-style:none;padding:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;min-height:52px;cursor:pointer}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"＋";color:var(--mut);font-weight:400}
details.acc[open] summary::after{content:"－"}
details.acc .in{padding:0 14px 14px}
.vl{font-size:1.2rem;line-height:1.9;margin:0}
.psh{margin:14px 0 4px;font-size:.95rem}
.nm-plain{padding:12px 14px;font-size:1.05rem;line-height:1.9;border-top:1px solid var(--line);color:var(--ink)}
.pstep{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);line-height:1.5}
.pstep:first-child{border-top:0}
.pn{flex:0 0 24px;height:24px;border-radius:50%;background:var(--soft);color:var(--pri);font-size:.8rem;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.pm{font-size:1rem;font-weight:600;line-height:1.6;margin:6px 0 2px}
.psub{margin:4px 0 0;padding-left:18px}
.pchk{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line);min-height:44px;line-height:1.45}
.pchk:first-child{border-top:0}
.pchk .bx{flex:0 0 22px;height:22px;border-radius:6px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;color:#fff;margin-top:1px}
.pchk.done .bx{background:var(--pri);border-color:var(--pri)}
.pchk.done span:last-child{color:var(--mut);text-decoration:line-through}
.vr{font-size:.9rem;line-height:1.55;color:var(--mut);margin:0 0 2px;font-style:italic}
.vgap{height:10px}
.noteBox{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--soft);font-size:.92rem}
.hint{font-size:.82rem;color:var(--mut);margin:8px 2px 0}

/* generic grid for days tab */
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 16px 0}
.dcard{background:var(--card);border:1.5px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;box-shadow:var(--shadow);position:relative}
.dcard .im{height:128px;background:#fff;display:flex;align-items:center;justify-content:center;border-bottom:4px solid var(--c)}
.dcard .im img{max-width:100%;max-height:100%;object-fit:contain}
.dcard .in{padding:8px 10px 10px}
.dcard .n{font-size:.7rem;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.7px}
.dcard .nm{font-weight:700;font-size:1.02rem;line-height:1.25}
.dcard .dt{font-size:.78rem;color:var(--mut)}
.bar{height:6px;border-radius:3px;background:var(--soft);margin-top:7px;overflow:hidden}
.bar u{display:block;height:100%;background:var(--ok);text-decoration:none}
.dcard.today{outline:3px solid var(--pri);outline-offset:-3px}

/* page header */
.ph{padding:calc(16px + env(safe-area-inset-top)) 16px 4px}
.ph h1{font-size:1.4rem}
.ph p{color:var(--mut);font-size:.9rem;margin-top:2px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:var(--card);border-top:1px solid var(--line);display:flex}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:.7rem;font-weight:600;color:var(--mut)}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--pri)}

/* settings */
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-height:56px}
.srow:first-child{border-top:0}
.srow label,.srow .l{font-weight:600}
.srow small{display:block;color:var(--mut);font-weight:400;font-size:.8rem}
input[type=date],textarea,select{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px}
textarea{width:100%;min-height:96px;resize:vertical}
.mtin{width:100%;margin:10px 0 8px;font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px}
.alab select{min-height:32px;padding:2px 6px;border-radius:8px}
.tg{width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:0 0 auto}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tg.on{background:var(--ok)}
.tg.on::after{left:25px}
.opts{display:flex;gap:6px}
.opts button{padding:8px 12px;border-radius:10px;background:var(--soft);font-weight:600;font-size:.85rem;border:1px solid var(--line)}
.opts button.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}

/* names */
.nm-item{display:flex;align-items:stretch;border-top:1px solid var(--line);min-height:68px}
.nm-item:first-child{border-top:0}
.nm-item .no{flex:0 0 40px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-weight:700;font-size:.85rem}
.nm-item .bd{flex:1;padding:8px 0;min-width:0}
.nm-item .h{font-size:calc(1.15rem*var(--rs,1));font-weight:600}
.nm-item .r{font-size:.85rem;color:var(--mut)}
.nm-item .m{font-size:.8rem;color:var(--mut);font-style:italic}
.nm-item.done .h{color:var(--mut)}
.nm-item.done .no{color:var(--ok)}

/* music modal */
#mm{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
#mm.show{display:flex}
.mmc{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;padding:0 16px calc(18px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.mmh{position:sticky;top:0;background:var(--card);display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px;z-index:2}
.mmh b{font-size:1.05rem}
.mmb .aud{border:0;background:transparent;padding:10px 0 0}
.aopt.wrap{flex-wrap:wrap;overflow:visible}
.tbtn.dash{border-style:dashed;color:var(--pri)}
.atl.box{border:1px solid var(--line);border-radius:12px;margin:10px 0 4px;max-height:26vh;min-height:44px}
.fxh{font-size:.72rem;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);margin:16px 0 4px}
.fxr{display:flex;align-items:center;gap:10px;min-height:40px}
.fxr span{flex:0 0 84px;font-size:.92rem}
.fxr input{flex:1;min-width:0;accent-color:var(--pri);height:28px}
.fxr output{flex:0 0 54px;text-align:right;font-size:.82rem;color:var(--mut);font-variant-numeric:tabular-nums}
.fxf{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.fxf small{color:var(--mut);font-size:.74rem;text-align:right}
/* edit blocks */
#ed{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column}
#ed.show{display:flex}
.edb{flex:1;overflow-y:auto;padding:8px 16px 40px}
.edb select{width:100%}
.edb[hidden],.skf[hidden]{display:none}
.edrow{gap:4px;padding:6px 0}
.edrow .mv{display:flex;flex-direction:column;gap:2px;padding:0 6px}
.edrow .mv button{width:36px;height:28px;border-radius:8px;background:var(--soft);font-size:.8rem}
.edrow .mv button:disabled{opacity:.3}
.eb{width:44px;height:44px;border-radius:12px;font-size:1.1rem;font-weight:700;flex:0 0 44px}
.eb.dl{color:var(--pri)}
/* overlay reader */
.nvt{display:flex;gap:6px;margin:0 0 10px;padding:4px;background:var(--soft);border-radius:999px}
.nvt button{flex:1;padding:8px 6px;border-radius:999px;font-weight:700;font-size:.85rem;color:var(--mut)}
.nvt button.on{background:var(--card);color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.nm-item .h.en{font-size:calc(1.2rem*var(--rs,1));font-weight:600}
.fsbar{display:none}
#ov.full .ovh,#ov.full .ovtools,#ov.full .aud,#ov.full .rndw,#ov.full .ovf{display:none}
#ov.full .fsbar{display:flex;gap:6px;justify-content:flex-end;padding:calc(6px + env(safe-area-inset-top)) 8px 6px}
.fsbar button{padding:7px 12px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:.82rem;font-weight:700}
#ov.full .ovb{padding-top:8px}
#ov{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column}
#ov.show{display:flex}
.ovh{display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
.ovh .ttl{flex:1;min-width:0;text-align:center}
.ovh .ttl b{display:block;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ovh .ttl small{color:var(--mut);font-size:.74rem}
.ib{flex:0 0 44px;height:44px;border-radius:12px;font-size:1.25rem;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.ib.on{background:var(--pri);color:var(--pri-ink)}
.ib small{font-size:.7rem}
.ovtools{display:flex;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;align-items:center}
.ovtools::-webkit-scrollbar{display:none}
.tbtn{flex:0 0 auto;padding:7px 12px;border-radius:999px;background:var(--soft);font-size:.82rem;font-weight:600;border:1px solid var(--line);white-space:nowrap}
.tbtn.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.ovb{position:relative;flex:1;overflow-y:auto;padding:16px 18px 24px;-webkit-overflow-scrolling:touch;scroll-behavior:auto}
.ovf{display:flex;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
.ovf .btn{flex:1}
.ovf .btn.g{flex:0 0 auto}
.blk{margin-bottom:26px}
.blk h2{font-size:.82rem;text-transform:uppercase;letter-spacing:.9px;color:var(--pri);margin-bottom:8px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.blk h2 span{text-transform:none;letter-spacing:0;font-size:1rem;color:var(--mut);font-weight:500}
.blk .ln{font-size:calc(1.35rem*var(--rs,1));line-height:1.85;margin:0;overflow-wrap:anywhere}
.blk .rm{font-size:calc(.98rem*var(--rs,1));line-height:1.6;color:var(--mut);margin:0;font-style:italic}
.blk .dsc{font-size:calc(.95rem*var(--rs,1));color:var(--mut);margin-bottom:6px}
.blk .ch{font-size:calc(1.05rem*var(--rs,1));line-height:1.6;font-weight:600}
.blk .mn{font-size:calc(.92rem*var(--rs,1));color:var(--mut);margin-top:6px;line-height:1.55}
.hdivider{height:1px;background:var(--line);margin:0 0 14px}

/* sankalpa */
.sk{font-size:calc(1.12rem*var(--rs,1));line-height:1.95;margin:0 0 14px}
.sk.sks{font-weight:700;text-align:center}
.sk mark{background:color-mix(in srgb,var(--acc) 35%,transparent);color:inherit;border-radius:5px;padding:0 3px}
.sk b{color:var(--pri)}
.skf{display:block;margin-top:10px}
.skf span{display:block;font-size:.8rem;color:var(--mut);font-weight:600;margin-bottom:3px}
.skf select{width:100%;font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px}
.skf input[hidden]{display:none}
.skf select+input{margin-top:6px}
.skf input{width:100%;font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px}
/* audio player */
.aud{padding:8px 12px 10px;border-bottom:1px solid var(--line);background:var(--card)}
.aun{font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
.aur{display:flex;align-items:center;justify-content:center;gap:10px}
.ab{min-width:48px;height:44px;border-radius:12px;background:var(--soft);font-size:.9rem;font-weight:700;border:1px solid var(--line)}
.ab.apl{min-width:64px;height:48px;border-radius:24px;background:var(--pri);color:var(--pri-ink);font-size:1.3rem;border-color:var(--pri)}
.aur3{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.78rem;color:var(--mut);font-variant-numeric:tabular-nums}
.aur3 input{flex:1;min-width:0;accent-color:var(--pri);height:28px}
.aopt{display:flex;gap:6px;margin-top:6px;overflow-x:auto;scrollbar-width:none;align-items:center}
.aopt::-webkit-scrollbar{display:none}
.alab{display:inline-flex;align-items:center;gap:6px}
.alab input{width:18px;height:18px;accent-color:var(--pri)}
.atl{margin-top:6px;max-height:30vh;overflow-y:auto}
.atr{display:flex;align-items:center;border-top:1px solid var(--line)}
.atr button:first-child{flex:1;text-align:left;padding:10px 4px;font-size:.88rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.atr button:last-child{flex:0 0 44px;height:44px;color:var(--mut)}
.atr.cur button:first-child{font-weight:700;color:var(--pri)}
.atr small{color:var(--mut);margin-left:4px}
.mini{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + 10px + env(safe-area-inset-bottom));z-index:40;display:none;align-items:center;gap:6px;
  background:var(--pri);color:var(--pri-ink);border-radius:16px;padding:6px 6px 6px 14px;box-shadow:var(--shadow)}
.mini.show{display:flex}
.mini .mt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:.9rem}
.mini button{width:44px;height:44px;border-radius:12px;font-size:1.1rem;color:var(--pri-ink)}
/* audio-only pages */
.audpage{text-align:center;padding:10px 0}
.audimg{width:min(60vw,240px);max-height:36vh;object-fit:contain;border-radius:16px;background:#fff;box-shadow:var(--shadow)}
.audpage h2{font-size:1.5rem;margin:14px 0 4px}
/* chandi path */
.chT{font-size:1.2rem;margin:0 0 12px;color:var(--pri)}
.blk h2[lang=bn],.blk h2.hi{text-transform:none;letter-spacing:0;font-size:1rem;color:var(--pri)}
.rndw{display:flex;justify-content:center;padding:10px 16px 0}
.rnd{font-weight:800;font-size:1.15rem;letter-spacing:.3px;color:var(--pri);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:6px 18px}
.rf{font-size:calc(1rem*var(--rs,1));line-height:1.6;margin:2px 0 10px;color:var(--mut);font-style:italic}
.ln.cs{font-size:calc(1.28rem*var(--rs,1));line-height:1.85;margin:0 0 6px}
.cv{margin:0 0 18px;padding:0 0 14px;border-bottom:1px dashed var(--line)}
.cl{font-size:.8rem;font-weight:700;color:var(--mut);margin-bottom:3px}
.co{font-size:calc(1.12rem*var(--rs,1));line-height:1.7;margin:0 0 6px;font-weight:600}
.cb{font-size:calc(1.02rem*var(--rs,1));line-height:1.85;margin:0;color:var(--ink);border-left:3px solid var(--acc);padding-left:10px}
.cp{font-size:calc(1.02rem*var(--rs,1));line-height:1.85;margin:0 0 12px}
/* japa counter */
.jwrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0 4px}
.jbtn{position:relative;width:min(74vw,300px);aspect-ratio:1;border-radius:50%;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
.jbtn:active{transform:scale(.985)}
.jbtn svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.jbtn .jn{position:relative;text-align:center}
.jbtn .jn b{display:block;font-size:4rem;line-height:1;font-variant-numeric:tabular-nums}
.jbtn .jn span{font-size:.9rem;color:var(--mut)}
.jrow{display:flex;gap:10px}
.timer{font-size:3.2rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0}

.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;z-index:80;
  background:#2a1a12;color:#fff;padding:10px 16px;border-radius:12px;font-size:.9rem;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.center{text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.jai{font-size:1.15rem;font-weight:700;text-align:center;padding:14px 8px;color:var(--pri)}
.imgfull{width:100%;border-radius:14px;margin-top:10px;background:#fff}
@media (min-width:700px){#app,.top,.nav{max-width:560px;margin-left:auto;margin-right:auto}.nav{left:50%;transform:translateX(-50%);width:560px}}
</style>
</head>

", "color": "Green", "cc": "#2E9A5B", "ci": "#fff", "flower": "Jasmine (चमेली)", "fpic": "jasmine", "bhog": "Sugar", "chakra": "स्वाधिष्ठान", "graha": "Mangal", "note": "माता कहती हैं कि मनुष्य मेरे प्रसाद से सभी बाधाओं से मुक्त होगा तथा धन, धान्य एवं संतान से सम्पन्न होगा इसमें तनिक भी संदेह नहीं है।", "about": {"Origin": "শিবের সঙ্গে বিয়ের আগে এই রূপে দেবী যোগিনী অথবা তপস্বিনী। \nব্রহ্মচারিণী অর্থাত্ তপশ্চারিণী দেবী নারদের পরামর্শে শিবকে পতিরূপে লাভ করার জন্য কঠিন তপস্যা করেন। \nতাই, তাকে তপশ্চারিণী বা ব্রহ্মচারিণী বলা হয়। পুরাণে আছে, তিনি সহস্র বর্ষ ধরে শুধু ফলমূল, তার পর শতবর্ষ কেবল শাক আহার করে জীবন ধারণ করেছিলেন। \nখোলা আকাশের নীচে বর্ষা ও গ্রীষ্মের দাবদাহে কাটিয়েছেন। \nএর পর তিন হাজার বছর গাছ থেকে মাটিতে ঝরে পড়া একটিমাত্র বেলপাতা আহার করে অহর্নিশ ধ্যান করেছেন। \nতাই, তার অন্য একটি নাম হয় 'অপর্ণা'। এর পর কয়েক হাজার বছর নির্জলা, অনাহারে থেকে তপস্যা করেছিলেন। \nএই ভাবে চলতে গিয়ে তিনি খুবই রোগা ক্ষীণ হয়ে গিয়েছিলেন। \nতাই দেখে মা মেনকা বলে ওঠেন, 'উ মা, না ওরে আর না'। তার থেকেই দেবীর নাম হয় 'উমা'। অবশেষে পিতামহ ব্রহ্মা দেবীকে বর দেন যে, শিবকে তিনি পতিরূপে পাবেন।", "Navratri Worship": "দেবী ব্রহ্মচারিনী নবরাত্রির দ্বিতীয় উপাসনা করা হয়।", "Governing Planet": "এটা বিশ্বাস করা হয় যে সমস্ত ভাগ্য প্রদানকারী গ্রহ দেবতা মঙ্গল, দেবী ব্রহ্মচারিনী দ্বারা পরিচালিত হয়।", "Iconography": "দেবী ব্রহ্মচারিনীকে খালি পায়ে হাঁটতে দেখানো হয়েছে। তার দুটি হাত আছে এবং তিনি ডান হাতে জাপ মালা এবং বাম হাতে কমন্ডল বহন করেন।"}, "mantra": {"dev": ["ॐ देवी ब्रह्मचारिण्यै नमः॥"], "rom": ["Om Devi Brahmacharinyai Namah॥"]}, "sec": {"Prarthana": {"dev": ["दधाना कर पद्माभ्यामक्षमाला कमण्डलू।", "देवी प्रसीदतु मयि ब्रह्मचारिण्यनुत्तमा॥"], "rom": ["Dadhana Kara Padmabhyamakshamala Kamandalu।", "Devi Prasidatu Mayi Brahmacharinyanuttama॥"]}, "Stuti": {"dev": ["या देवी सर्वभूतेषु माँ ब्रह्मचारिणी रूपेण संस्थिता। नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः॥"], "rom": ["Ya Devi Sarvabhuteshu Maa Brahmacharini Rupena Samsthita।", "Namastasyai Namastasyai Namastasyai Namo Namah॥"]}, "Dhyana": {"dev ে অর্ধচন্দ্র থাকে , তাই দেবীকে চন্দ্রঘণ্টা নামে ডাকা হয়। \nএঁনার শরীরের রং স্বর্ণের মতো উজ্জ্বল। এই দেবী দশভুজা। এঁনার হাতে কমণ্ডলু , তরোয়াল , গদা , ত্রিশূল , ধনুর্বাণ , পদ্ম , জপ মালা থাকে। \nএঁনার বাহন সিংহ। দেবী তার ঘণ্টার ন্যায় প্রচন্ড চন্ড ধবনিতে দুরাচারী রাক্ষস , দানব , দৈত্য দের প্রকম্পিত করেন। \nশিব পার্বতীর বিবাহের সময় হঠাৎ তারোকাসুর প্রেত পিশাচ দৈত দানব সহ আক্রমণ করে তখন \nদেবী পার্বতী এক দশ ভুজ রুপী মঙ্গলময় দেবী রূপে চন্দ্র সম বিশাল শুভ ঘণ্টা বাজিয়ে সকল অশুভ শক্তি কে নিরস্ত্র করেন \nদেবী উগ্র রূপ ধারণ করেন নি কারণ জন্মের পর দেবী পার্বতী নিজের দশ মহাবিদ্যা ও \nবিশ্ব রূপ হিমবান ও রানী মেনকা কে দর্শন করালে মা মেনকা দেবী পার্বতী কে প্রতিশ্রুতি বদ্ধ করেন \nযে তাদের কাছে থাকা অবস্থায় পার্বতী নিজের কোনো উগ্র রূপ প্রকাশ করবেন না ও তৃতীয় নয়ণ কে লুকিয়ে রাখবেন", "Navratri Worship": "দেবী চন্দ্রঘন্টা নবরাত্রি পর পর পূজা করা হয়।", "Governing Planet": "এটা বিশ্বাস করা হয় যে গ্রহ দেবতা শুক্র ,দেবী চন্দ্রঘন্টা দ্বারা পরিচালিত হয়।", "Details": "দেবী পার্বতী তার ভক্তদের কল্যাণের জন্য এই শান্তিপূর্ণ রূপ ধারণ করেন। \nএই রূপে দেবী চন্দ্রঘণ্টা তার সমস্ত অস্ত্র নিয়ে যুদ্ধের জন্য প্রস্তুত। \nএটা বিশ্বাস করা হয় যে তার কপালে চাঁদ-ঘণ্টার আওয়াজ \nতার ভক্তদের থেকে সব ধরনের অশুভ শক্তি দূর করে দেয়।"}, "mantra": {"dev": ["ॐ देवी चन्द्रघण्टायै नमः॥"], "rom": ["Om Devi Chandraghantayai Namah॥"]}, "sec": {"Prarthana": {"dev": ["पिण्डज प्रवरारूढा चण्डकोपास्त्रकैर्युता।", "प्रसादं तनुते मह्यम् चन्द्रघण्टेति विश्रुता॥"], "rom": ["Pindaja Pravararudha Chandakopastrakairyuta।", "Prasadam Tanute Mahyam Chandraghanteti Vishruta॥"]}, "Stuti": {"dev": ["या देवी सर्वभूतेषु माँ चन्द्रघण्टा रूपेण संस्थिता। नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः॥"], "rom": ["Ya Devi Sarvabhuteshu Maa Chandraghanta Rupena Samsthita।", "Namastasyai Namastasyai Namastasyai Namo Namah॥"]}, "Dhyana": {"dev": ["वन्दे वाञ्छितलाभाय चन्द्रार्धकृतशेखराम्।", "सिंहारूढा चन्द्रघण्टा यशस्विनीम्॥", "मणिपुर स्थिताम् तृतीय दुर्गा त्रिनेत्राम्।", "खङ्ग, गदा, त्रिशूल, चापशर, पद्म कमण्डलु माला वराभीतकराम्॥", "पटाम्बर परिधा //2Q=="}, {"n": 4, "hi": "मां कुष्मांडा", "en": "Kushmanda", "dev": "कूष्माण्डा", "color": "Orange", "cc": "#E8772E", "ci": "#fff", "flower": "Red color flowers", "fpic": "rose", "bhog": "Malpowa", "chakra": "अनाहत", "graha": "Sun", "note": "इस मंत्र का जाप करने से आपके अंदर का आत्मविश्वास बढ़ेगा और आप हर मुसीबत का सामना करने के लिए तैयार रहेंगे|", "about": {"Origin": "৪. কুষ্মাণ্ডা: \nদেবী পার্বতী তার চতুর্থ স্বরূপে \"কুষ্মাণ্ডা\" নামে পরিচিতা। \nনবরাত্রের চতুর্থদিনে, অর্থাৎ চতুর্থী তিথিতে মাতৃপ্রাণ ভক্তগণ এই কুষ্মাণ্ডারূপেই আদ্যাশক্তিকে আহ্বান করে থাকেন।\n\nকারুণ্যে ভরপুর মায়ের সৌম্যপ্রতিমা। দেবী সিংহবাহিনী, ত্রিনয়নী ও অষ্টভুজা। \nআটটি হাতে সুদর্শনচক্র, ধনুর্বাণ, রক্তপদ্ম, কমণ্ডলু, ইত্যাদি দৃষ্টিগোচর হয়। মায়ের বামহস্তে একটি অমৃতপূর্ণ কলসও রয়েছে। \nএখানে অমৃত ব্রহ্মের রূপক, দেবী ভগবতী পার্বতী অমৃতপূর্ণ কলস অর্থাৎ ব্রহ্মজ্ঞানের আধার হাতে নিয়ে বসে রয়েছেন। \nযোগ্য সাধক আপন তপোবল ও কৃচ্ছ্রতা দ্বারা মহামায়াকে প্রসন্ন করতে পারলে \nতবেই মা সেই অমৃতভাণ্ডের অমৃতধারায় সাধককে স্নান করিয়ে তৃপ্ত করবেন, ব্রহ্মজ্ঞান প্রদানে কৃতার্থ করবেন।\n\nমায়ের হাতে আরও একটি বস্তু রয়েছে, সেটি হল জপমালা। \nসেই জপমালা সিদ্ধমন্ত্রে মন্ত্রিত, তাহা অষ্টসিদ্ধি ও নবনিধি দান করতে সমর্থ। এবার যে ভক্ত রুচি অনুযায়ী যা চাইবে, \nকল্পতরু মা সেই অনুসারেই বাঞ্ছা পূর্ণ করবেন। \nযে সিদ্ধি ও সিদ্ধাই চাইবে, মা তাকে তাই দিয়ে ভোলাবে। \nআর যে পার্থিব সম্পদে অনীহা প্রকাশ করে ওই অমৃতপূর্ণ কলস, অর্থাৎ ব্রহ্মজ্ঞান চাইবে,\n মা তাকেও তাই দিয়েই সন্তুষ্ট করবেন।\n\nএবার আসি মায়ের নাম বিশ্লেষণে। শাস্ত্রে বলা হয়েছে, বলিদানের মধ্যে কুমড়ো বলি মায়ের অধিক প্রিয়। কুমড়োকে সংস্কৃতে \"কুষ্মাণ্ড\" বলে, \nকুষ্মাণ্ডপ্রিয় দেবী তাই কুষ্মাণ্ডা নামে স্তুতা। \nএ তো গেল সহজ একটি ব্যাখ্যা, কিন্তু এর সুগভীর অর্থও রয়েছে। যেমন-\n\nকুৎসিত উষ্মা সন্তাপস্তাপত্রয়রূপো যস্মিন সংসারে। স সংসারে অণ্ডে উদর রূপায়াং যস্যাঃ।।\n\nসংসার তাপযুক্ত, ত্রিবিধ তাপে জরজর। সেই সংসারকে যিনি ভক্ষণ করেন, তিনিই কুষ্মাণ্ডা। \nকু- কুৎসিত, উষ্মা সন্তাপত্রয়ে পূর্ণ জগৎ যাঁর অণ্ডে (উদরে) বিদ্যমান, তিনিই কুষ্মাণ্ডা।দেবী কুষ্মাণ্ডার যেহেতু আটটি হাত, তাই তি  dhana sampadah |", "shatru buddhi vināshāya deepa jyoti namostute ||"]}, {"t": "Vighneshwara Dhyānam (Contemplation on Lord of Obstacles)", "d": "The devotee undertakes specific hand gestures chants mantra dedicated to Lord Ganesha asking that any obstacles be removed during the pujā. Two such mantra are:", "chant": ["ganānantva ganapati gum havā mahe", "priyānantva priyapati gum havā mahe", "nidhinantva nidhipati gum havā mahe", "vāso mamha āham jā nigarvādhamvā tvamajā sigarvādhamvā", "shukla ambara dharam vishnum shashi varanam chatur bhujam |", "prasana vadanam dhyāyet sarva vighnopashāntaye ||"]}], "upa": [{"n": 1, "t": "Dhyānam & Āvāhanam", "d": "The Divine is invited into the devotee’s home and heart with a meditation.", "chant": "om sri [Deity name] āvāhanam samarpayāmi"}, {"n": 2, "t": "Āsanam", "d": "A seat is offered by the devotee to the Divine form.", "chant": "om sri [Deity name] āsanam samarpayāmi"}, {"n": 3, "t": "Pādyam, Ārghyam & Āchamanyam", "d": "Water is offered by the devotee who washes the feet and hands of the Divine form. Water is also offered to the Divine to wash their face and mouth, just as one might traditionally offer a guest who has come into the home after journey.", "chant": "om sri [Deity name] pādyam ārghyam āchamaniyam samarpayāmi"}, {"n": 4, "t": "Madhuparkam", "d": "Honey, sugar, ghee (clarified butter), curd (yogurt), or water is offered by the devotee to the Divine form for refreshment.", "chant": "om sri [Deity name] madhuparkam samarpayāmi"}, {"n": 5, "t": "Snānam", "d": "Water is offered by the devotee to bathe the Divine form. In longer pujas, the five items included in panchāmrit (honey, sugar, milk, curd, and ghee) are used in bathing the Divine form as well. Sacred hymns are chanted during this process.", "chant": "om sri [Deity name] snānam samarpayāmi"}, {"n": 6, "t": "Vastram", "d": "Clothing is offered by the devotee to the Divine form after bath.", "chant": "om sri [Deity name] vastram samarpayāmi"}, {"n": 7, "t": "Yagnoveetam", "d": "Sacred thread is offered by the devotee to the Divine form after bath.", "chant": "om sri [Deity name] yagnopaveetam samarpayāmi"}, {"n": 8, "t": "Ābhāranam", "d": "Divine form is bedecked with ornaments by the devotee. Songs are sung in praise of the Divine form during this process.", "chant": "om sri [Deity name]  ābhāranam samarpayāmi"}, {"n": 9, "t": "Gandham", "d": "Sandalwood paste, kumkum or vermillion, and haldi (turmeric) or vibhooti (sacred ash), are offered by the devotee.", "chant": "om sri [Deity name] chandanam samarpayāmi, om sri [Deity name] sindoor tilakam samarpayāmi, om sri [Deity name] haldiyam samarpayāmi, om sri [Deity name] vibhooti samarpayāmi"}, {"n": 10, "t": "Pushpam", "d": "Flowers are offered by the devotee to decorate the Divine form. In longer pujas, 108 or 1008 flowers are offered, one for each name of the Divine form, chanted in ashtottara nāmāvalis or sahasranāmas. In shorter pujas, just a few well-known or favorite names of the Divine form are chanted with each flower being offered.", "chant": "om sri [Deity name] pushpam samarpayāmi"}, {"n": 11, "t": "Dhoopam", "d": "Incense is offered by the devotee to please the Divine form.", "chant": "om sri [Deity name] dhoopam samarpayāmi"}, {"n": 12, "t": "Deepam", "d": "Another lamp is lit and offered by the devotee to the Divine form.", "chant": "om sri [Deity name] deepam samarpayāmi"}, {"n": 13, "t": "Naivedyam", "d": "Fresh food is offered by the devotee to the Divine form. Water is also offered again to cleanse the mouth of the Divine after naivedya has been consumed.", "chant": "om sri [Deity name] naivedyam samarpayāmi"}, {"n": 14, "t": "Tambulam", "d": "Betel nut and leaves, which have symbolic meaning, are offered as mouth fresheners after the meal. Coins or larger monetary amounts are also given as offering.", "chant": "om sri [Deity name] tambulam samarpayāmi"}, {"n": 15, "t": "Karpoora Niranjanam", "d": "ārati for the Divine form is shown and offered by the devotee.", "chant": "om sri [Deity name] karpoora samarpayāmi"}, {"n": 16, "t": "Pradakshina & Namaskāram", "d": "The Divine form is circumambulated, or the devotee stands in place and turns around three times clockwise, symbolizing that the devotee worships the Divine as the center of their life, around which their life revolves.  The devotee bows down to the Divine, and asks for forgiveness of any mistakes committed during the puja process and sends off the Divine form with gratitude.", "chant": "om sri [Deity name] pradakshina samarpayāmi; om sri [Deity name] namaskāram samarpayāmi"}], "closing": {"mantra": ["kāyena vācā manase indriyairvā buddhy ātmanā vā prakrteh svabhāvāt |", "karomi yad yat sakalam parasmai nārāyanāyeti samarpayāmi ||"], "meaning": ["Whatever I do with my Body, Speech, Mind, or Senses, Whatever I do using my Intellect, Feelings or unconsciously through my natural tendencies |", "Whatever I do, I do selflessly for others and surrender them all at the Lotus Feet of the Divine ||"]}}, "kshama": {"title": "।। अथ अपराधक्षमापणस्तोत्रम् ।।", "end": "।। इति अपराधक्षमापणस्तोत्रं समाप्तम्।।", "v": [{"l": ["ॐ अपराधसहस्त्राणि क्रियन्तेऽहर्निशं मया।", "दासोऽयमिति मां मत्वा क्षमस्व परमेश्वरि।।१।।"], "m": "परमेश्वरि ! मेरे द्वारा रात-दिन सहस्रों (हजारों) अपराध होते रहते हैं। ' यह मेरा दास है' - यों समझकर मेरे उन अपराधों को तुम कृपापूर्वक क्षमा करो।1।"}, {"l": ["आवाहनं न जानामि न जानामि विसर्जनम्।", "पूजां चैव न जानामि क्षम्यतां परमेश्वरि।।२।।"], "m": "परमेश्वरि! मैं आवाहन नहीं जानता, विसर्जन नहीं जानता तथा पूज करने का ढंग भी नहीं जानता । क्षमा करो।2।"}, {"l": ["मन्त्रहीनं क्रियाहीनं भक्तिहीनं सुरेश्वरि।", "यत्पूजितं मया देवि परिपूर्णं तदस्तु मे।।।३।।"], "m": "देवि! सुरेश्वरि! मैंनेजो मन्त्रहीन, क्रियाहीन और भक्तिहीन पूजन किया है, वह सब आपकी कृपा से पूर्ण हो।3।"}, {"l": ["अपराधशतं कृत्वा जगदम्बेति चोच्चरेत् ।", "यां गतिं समवाप्नोति न तां ब्रह्मादयः सुराः ।। ४।।"], "m": "सैकड़ों अपराध करके भी जो तुम्हारी शरण में जाकर 'जगदम्ब' पुकारता है, उसे वह गति प्राप्त होती है जो ब्रह्मादि देवताओं के लिए भी सुलभ नहीं है।4।"}, {"l": ["सापराधोऽस्मि शरणं प्राप्तस्त्वां जगदम्बिके ।", "इदानीमनुकम्प्योऽहं यथेच्छसि तथा कुरु ।। ५।।"], "m": "जगदम्बिके! मैं अपराधी हूँ,किन्तु तुम्हारी शरण में आया हूँ। इस समय दया का पात्र हूँ । तुम जैसा चाहो वैसा करो।5।"}, {"l": ["अज्ञानाद्विस्मृतेर्भ्रोन्त्या यन्न्यूनमधिकं कृतम् ।", "तत्सर्वं क्षम्यतां देवि प्रसीद परमेश्वरि ।। ६।।"], "m": "देवि! परमेश्वरि! अज्ञान से, भूल से अथवा बुद्धि भ्रांत होने के कारण मैंनेमैंनेजो न्यूनता या अधिकता कर दी हो, वह सब क्षमा करो और प्रसन्न होओ।6।"}, {"l": ["कामेश्वरि जगन्मातः सच्चिदानन्दविग्रहे ।", "गृहाणार्चामिमां प्रीत्या प्रसीद परमेश्वरि ।। ७।।"], "m": "सच्चिदानंदरूपा परमेश्वरि! जगन्माता कामेश्वरि! तुम प्रेम पूर्वक मेरी यह पूजा स्वीकार करो और मुझ पर प्रसन्न रहो।7।"}, {"l": ["गुह्यातिगुह्यगोप्त्री त्वं गृहाणास्मत्कृतं जपम्।", "सिद्धिर्भवतु मे देवि त्वत्प्रसात्सुरेश्वरि।।८।।"], "m": "देवि! सुरेश्वरि! तुम गोपनीय से भी गोपनीय वस्तु की रक्षा करने वाली हो। मेरे निवेदन किये हुए इस जप को ग्रहण करो। तुम्हारी कृपा से मुझे सिद्धि प्राप्त हो।8।"}]}, "flowers": {"jasmine": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCADwAWgDASIAAhEBAxEB/8QAHAAAAgIDAQEAAAAAAAAAAAAABAUDBgECBwAI/8QAOhAAAgEDAwIFAgUDAgYCAwAAAQIDAAQRBRIhMUEGEyJRYTJxBxQjQoEzUpEVYhYkobHB0TRyQ/Dx/8QAGQEAAwEBAQAAAAAAAAAAAAAAAQIDAAQF/8QAIxEAAgICAgIDAQEBAAAAAAAAAAECEQMhEjEEEyJBURQycf/aAAwDAQACEQMRAD8AQhjC/mbsH3p1pfjDVNOJ2TecjdVkGRSiVenFQgHdXg4JtIvNnTtM/ECxmjC3iPDJ/cBlasNrrVldgGG8icH5ANcVEhUcn+KHkumjO6MlT7qcV1R8loi5Hf8AcMAocg968Tjkkj+K4JBr+qWxHkXsy4OeXJplB451+Pl7vzPutWXlL7Fs7UH9WBnPvXvMBJzXIU8fa0VAYIfnmum2E8j2NvJKMSPGGb+RmqwzqfQUMd1ZzUAkPas+aavYWTZrI6VCJc1sJD0xWsKJM4qLcBLzUc9wYQCFzmopJPMj8wNyOtazBzYI4qOVSy/aooZlb6m+1T7u6nNExAAe9Srwgbqa1kJAyAD71lSWGRx3xWujFF8VeOEQTWWn58xSUd/Y1zWZ3ld3kOWJyT71cPxB0I6Xqv8AqMS7ba8OcY6P3qnn18knHavJzNuexWYQ4H8Uw0 function tfetch(url,ms){
  const c=new AbortController(),id=setTimeout(()=>c.abort(),ms);
  // 'no-cache' = quick conditional check (ETag), so unchanged files return fast and stay fresh
  return fetch(url,{signal:c.signal,cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()}).finally(()=>clearTimeout(id));
}
function loadText(k){
  // GitHub first. If it has not answered in 3.5 s, race a CDN mirror. First good answer wins.
  return new Promise((res,rej)=>{
    let done=false,fails=0;
    const ok=t=>{if(!done&&t.trim()){done=true;res(t)}else fail()};
    const fail=()=>{if(++fails>=2&&!done)rej(new Error('fail'))};
    tfetch(SRC[k],9000).then(ok,fail);
    setTimeout(()=>{if(!done)tfetch(ALT[k],9000).then(ok,fail);else fail()},3500);
  });
}
async function fetchSrc(k,retry){
  SST[k]='loading';
  try{
    const t=await loadText(k);

    try{if(/^c[st]\d$/.test(k)||/^u_/.test(k))LS.setItem(lsKey(k),JSON.stringify(TX[k]));else LS.setItem(SKEY,JSON.stringify({gan:TX.gan,san:TX.san,nam:TX.nam,puj:TX.puj,cha:TX.cha,nms:TX.nms,nme:TX.nme}))}catch(_){}
    delete SST[k];
  }catch(e){
    if(!retry){await new Promise(r=>setTimeout(r,1500));return fetchSrc(k,1)}
    SST[k]='error';
  }
  if(typeof O!=='undefined'&&O&&O.list[O.idx].src===k)renderStep();
  if(typeof V!=='undefined'&&(V.view==='more'||V.view==='puja'||(V.view==='names'&&!O)))render(true);

}

function parseGan(t){
  const L=t.split('\n').map(l=>l.trim());
  const h=L.find(l=>/^#/.test(l));
  const lines=L.filter(l=>l&&l!=='**'&&!/^#/.test(l)).map(l=>l.replace(/\*\*/g,''));
  return [{h:(h||'# Ganesh Stotram').replace(/^#+\s*/,'').replace(/\|\|/g,'').trim(),hi:'',lines}];
}
function parseSan(t){
  const paras=[];
  t.split(/\n\s*\n/).forEach(blk=>{
    blk=blk.trim();if(!blk||/^#/.test(blk))return;
    const s=blk.startsWith('**');
    paras.push({s,l:blk.replace(/\*\*/g,'').split('\n').map(l=>l.trim())});
  });
  return paras;
}

const _pc={};
function parseCS(k){   // Sanskrit text: '# heading' then blocks of lines
  const c=_pc[k],ts=TX[k].ts;if(c&&c.ts===ts)return c.v;
  const secs=[];let cur=null,buf=[];
  const flush=()=>{if(buf.length){if(!cur){cur={h:'',items:[]};secs.push(cur)}cur.items.push(buf);buf=[]}};
  getSrc(k).replace(/\r/g,'').split('\n').forEach(raw=>{
    const l=raw.replace(/[\u00a0\s]+/g,' ').trim();
    if(/^#/.test(l)){flush();cur={h:l.replace(/^#+\s*/,'').replace(/॥/g,'').trim(),items:[]};secs.push(cur)}
    else if(!l)flush();else buf.push(l);
  });flush();
  _pc[k]={ts,v:secs};return secs;

function parseCT(k){   // Bengali meaning: '## section', verse = label + মূল + বাংলা
  const c=_pc[k],ts=TX[k].ts;if(c&&c.ts===ts)return c.v;
  const secs=[];let cur=null,buf=[],title='';
  const rx=/^(?:(\*\(.*?\)\*)\s*)?(?:\*\*([^*]+)\*\*\s*)?[_*]মূল:[_*]\s*(.*?)\s*\*\*বাংলা:\*\*\s*(.*)$/;
  const flush=()=>{
    if(!buf.length)return;const j=buf.join(' ').replace(/\s+/g,' ').trim();
    if(!cur){cur={h:'',items:[]};secs.push(cur)}
    const m=j.match(rx);
    cur.items.push(m?{v:1,note:m[1]||'',label:m[2]||'',orig:m[3],bn:m[4]}:{v:0,txt:buf.join('\n')});
    buf=[];
  };
  getSrc(k).replace(/\r/g,'').split('\n').forEach(raw=>{
    const l=raw.trim();
    if(/^## /.test(l)){flush();cur={h:l.replace(/^##\s*/,''),items:[]};secs.push(cur)}
    else if(/^# /.test(l)){flush();title=l.replace(/^#\s*/,'')}
    else if(!l||l==='---')flush();else buf.push(l);
  });flush();
  const v={title,secs};_pc[k]={ts,v};return v;
}

function parseNam(t){
  t=t.replace(/^---[\s\S]*?\n---\s*\n/,'');
  const dg='०१२३४५६७८९',num=s=>+String(s).replace(/[०-९]/g,c=>dg.indexOf(c));
  // Format A: older file with "শ্লোক N" headings and Bengali meaning
  if(/শ্লোক|श्लोक/.test(t)&&/বাংলা/.test(t)){
    const strip=s=>s.replace(/^#+\s*/,'').replace(/\*\*/g,'').trim();
    const L=t.split('\n').map(l=>l.trim()).filter(Boolean);
    let summary='',vs=[],cur=null,inSum=false;
    for(const l of L){
      if(/^---+$/.test(l))continue;
      if(/^##\s*(?!\*\*)/.test(l)&&!/^##\s*\*\*/.test(l)){inSum=/সারসংক্ষেপ/.test(l);continue}
      if(/^\*\*[^*]*(শ্লোক|श्लोक)[^*]*\*\*$/.test(l)){cur={n:vs.length+1,sa:'',bn:'',tick:true};vs.push(cur);inSum=false;continue}
      if(/^\*\*(বাংলা)[^*]*\*\*/.test(l)&&cur){cur.bn=l.replace(/^\*\*[^*]*\*\*\s*/,'').replace(/\*\*/g,'').trim();continue}
      if(cur&&/^##/.test(l)){cur.sa=(cur.sa?cur.sa+'\n':'')+strip(l);continue}
      if(inSum)summary+=(summary?'\n':'')+strip(l);
    }
    return{summary,vs};
  }
  // Format B: plain Devanagari. Blocks split by blank lines. "॥ 3॥" marks a numbered verse.
  const vs=[];
  t.split(/\n\s*\n/).map(b=>b.split('\n').map(l=>l.replace(/^#+\s*/,'').replace(/\*\*/g,'').trim()).filter(l=>l&&!/^---+$/.test(l))).filter(b=>b.length).forEach(b=>{
    const m=b.join(' ').match(/॥\s*([०-९0-9]+)\s*॥/);
    vs.push({n:m?num(m[1]):0,sa:b.join('\n'),bn:'',tick:!!m});
  });
  return{summary:'',vs};
}

function parsePuja(tx){
  tx=tx.replace(/^---[\s\S]*?\n---\s*\n/,'');
  const secs=[];let cur={h:'',intro:true,b:[]},last=null;
  const push=()=>{if(cur.b.length||cur.h)secs.push(cur)};
  for(const raw of tx.split('\n')){
    if(!raw.trim()){last=null;continue}
    let m;
    if(/^# /.test(raw)){cur.title=raw.slice(2).trim();continue}
    if((m=raw.match(/^## (.+)/))){push();cur={h:m[1].trim(),b:[]};last=null;continue}
    if((m=raw.match(/^### (.+)/))){cur.b.push({k:'sub',t:m[1].trim()});last=null;continue}
    if((m=raw.match(/^>\s?(.*)/))){const p=cur.b[cur.b.length-1];if(p&&p.k==='q')p.t+=' '+m[1];else cur.b.push({k:'q',t:m[1]});last=null;continue}
    if((m=raw.match(/^\s+[-*]\s+(.+)/))&&last){(last.sub=last.sub||[]).push(m[1]);continue}
    if((m=raw.match(/^\s+(\S.*)/))&&last){(last.mant=last.mant||[]).push(m[1]);continue}
    if((m=raw.match(/^- \[[ xX]\]\s+(.+)/))){last={k:'c',t:m[1]};cur.b.push(last);continue}
    if((m=raw.match(/^(\d+)\.\s+(.+)/))){last={k:'o',n:m[1],t:m[2]};cur.b.push(last);continue}
    if((m=raw.match(/^[-*]\s+(.+)/))){last={k:'u',t:m[1]};cur.b.push(last);continue}
    cur.b.push({k:'p',t:raw.trim()});last=null;
  }
  push();return secs;
}
const pmd=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<i>$1</i>');
function pujaBlock(b,si,bi){

  const sub=b.sub?`<ul class="psub">${b.sub.map(x=>`<li>${pmd(x)}</li>`).join('')}</ul>`:'';
  if(b.k==='sub')return `<h3 class="psh">${pmd(b.t)}</h3>`;
  if(b.k==='q')return `<div class="noteBox">${pmd(b.t)}</div>`;

  if(b.k==='o')return `<div class="pstep"><span class="pn">${b.n}</span><div>${pmd(b.t)}${sub}${mant}</div></div>`;
  return `<div class="pstep"><span class="pn">•</span><div>${pmd(b.t)}${sub}${mant}</div></div>`;
}

const MEM={};let AUDIO_OK=true;
const IDB=(()=>{
  let p=null;
  const open=()=>p||(p=new Promise((res,rej)=>{try{const r=indexedDB.open('navratri-audio',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}));
  const tx=async(mode,fn)=>{
    try{const db=await open();return await new Promise((res,rej)=>{const t=db.transaction('kv',mode),rq=fn(t.objectStore('kv'));t.oncomplete=()=>res(rq&&rq.result);t.onerror=t.onabort=()=>rej(t.error)})}
    catch(e){AUDIO_OK=false;throw e}
  };
  return{
    get:async k=>{try{return await tx('readonly',s=>s.get(k))}catch(_){return MEM[k]}},
    set:async(k,v)=>{try{await tx('readwrite',s=>s.put(v,k))}catch(_){MEM[k]=v}},
    del:async k=>{try{await tx('readwrite',s=>s.delete(k))}catch(_){delete MEM[k]}}
  };
})();

const slotKey=s=>'slot:'+s;
async function resolveSlot(kind,day){
  const own=await IDB.get(slotKey(slotId(kind,day)));
  if(own&&own.length)return{slot:slotId(kind,day),list:own};
  const all=await IDB.get(slotKey(allId(kind)));
  return all&&all.length?{slot:allId(kind),list:all}:{slot:slotId(kind,day),list:[]};
}
async function loadTrack(idx,play){
  const tr=AU.list[idx];
  if(!tr){AU.el.removeAttribute('src');AU.el.load();AU.idx=0;refreshAudio();return}
  const blob=await IDB.get('blob:'+tr.id);
  if(!blob){toast('Audio file missing. Add it again.');return}
  if(AU.url)URL.revokeObjectURL(AU.url);
  AU.url=URL.createObjectURL(blob);AU.idx=idx;
  AU.el.src=AU.url;AU.el.playbackRate=S.arate||1;
  setSession();refreshAudio();
  if(play){try{await AU.el.play()}catch(_){}}
}
async function ensureAudio(day,kind){
  const switching=AU.kind!==kind||AU.day!==day;
  if(switching){AU.el.pause();AU.list=[];AU.slot=null;AU.idx=0;AU.round=1;AU.fin=false}
  else if(!AU.el.paused&&AU.list.length)return refreshAudio();   // same screen: keep playing
  AU.kind=kind;AU.day=day;
  const r=await resolveSlot(kind,day);
  const same=AU.slot===r.slot&&AU.list.length===r.list.length&&AU.list.every((t,k)=>t.id===r.list[k].id);
  AU.slot=r.slot;AU.list=r.list;
  if(!same||!AU.el.src)await loadTrack(Math.min(AU.idx,Math.max(0,r.list.length-1)),false);
  refreshAudio();
}
function setSession(){
  try{

    set('seekforward',()=>{a.currentTime=Math.min(a.duration||1e9,a.currentTime+10)});

/* ---- sound effects (Web Audio). Built only when you move a slider, so plain playback stays simple ---- */
const FX={ctx:null,n:null,bad:false};
const fxDefault=()=>{const f=S.fx;return f.vol===1&&f.pan===0&&!f.bass&&!f.mid&&!f.treb&&!f.wet};
function fxImpulse(c){const len=Math.floor(c.sampleRate*2.2),buf=c.createBuffer(2,len,c.sampleRate);for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let k=0;k<len;k++)d[k]=(Math.random()*2-1)*Math.pow(1-k/len,2.5)}return buf}
function fxBuild(){
  if(FX.ctx||FX.bad)return !!FX.ctx;
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)throw 0;
    const c=new C(),src=c.createMediaElementSource(AU.el);
    const b=c.createBiquadFilter();b.type='lowshelf';b.frequency.value=200;
    const m=c.createBiquadFilter();m.type='peaking';m.frequency.value=1000;m.Q.value=.8;
    const tr=c.createBiquadFilter();tr.type='highshelf';tr.frequency.value=4000;
    const pan=c.createStereoPanner?c.createStereoPanner():null;
    const dry=c.createGain(),wet=c.createGain(),conv=c.createConvolver(),master=c.createGain();
    conv.buffer=fxImpulse(c);
    src.connect(b);b.connect(m);m.connect(tr);
    let last=tr;if(pan){tr.connect(pan);last=pan}
    last.connect(dry);dry.connect(master);last.connect(conv);conv.connect(wet);wet.connect(master);master.connect(c.destination);
    FX.ctx=c;FX.n={b,m,tr,pan,dry,wet,master};return true;
  }catch(_){FX.bad=true;FX.ctx=null;toast('Sound effects are not available here');return false}
}
function fxApply(){
  const f=S.fx;
  if(!FX.ctx&&!fxDefault())fxBuild();
  if(FX.ctx){
    const n=FX.n;try{if(FX.ctx.state==='suspended')FX.ctx.resume()}catch(_){}
    AU.el.volume=1;n.master.gain.value=f.vol;
    n.b.gain.value=f.bass;n.m.gain.value=f.mid;n.tr.gain.value=f.treb;
    if(n.pan)n.pan.pan.value=f.pan;
    n.dry.gain.value=1-f.wet;n.wet.gain.value=f.wet*1.5;
  }else AU.el.volume=Math.max(0,Math.min(1,f.vol));
}
const FXL={fxvol:v=>Math.round(v)+'%',asp:v=>(+v).toFixed(2).replace(/0$/,'')+'x',fxpan:v=>+v===0?'C':(v<0?'L':'R')+Math.abs(Math.round(v)),fxbass:v=>(v>0?'+':'')+v+'dB',fxmid:v=>(v>0?'+':'')+v+'dB',fxtreb:v=>(v>0?'+':'')+v+'dB',fxwet:v=>Math.round(v)+'%'};
function fxLabels(){Object.keys(FXL).forEach(id=>{const i=document.getElementById(id),o=document.getElementById(id+'v');if(i&&o)o.textContent=FXL[id](i.value)})}
function openMusic(day,kind){
  const m=$('#mm');m.innerHTML=`<div class="mmc">${musicPanel(kind)}</div>`;m.classList.add('show');hPush({mm:1});
  wireAudio(day,kind);
  $('#mmx').onclick=()=>closeMusic();
  m.onclick=e=>{if(e.target===m)closeMusic()};
}
function closeMusic(fromPop){
  const m=$('#mm');if(!m.classList.contains('show'))return;
  m.classList.remove('show');m.innerHTML='';
  if(!fromPop&&HS().mm){closeMusic.skip=1;hBack()}
}
function rndHtml(){return `<div class="rndw"><span class="rnd" id="rnd"></span></div>`}
function rndText(){
  const rp=S.rep.names,on=AU.kind==='names';
  if(on&&AU.fin)return '✓ All rounds complete';
  return `Round ${on?AU.round:1} of ${rp===0?'∞':rp}`;
}
function refreshAudio(light){
  const a=AU.el,tr=AU.list[AU.idx];
  const q=id=>document.getElementById(id);
  const cur=a.currentTime||0,du=a.duration||0;
  if(q('act')){
    q('act').textContent=fmtT(cur);q('adu').textContent=fmtT(du);
    const sk=q('asek');if(sk&&!sk._drag)sk.value=du?Math.round(cur/du*1000):0;
    q('apl').textContent=a.paused?'▶':'⏸';
    if(!light){
      q('aun').textContent=tr?`${tr.name.replace(/\.[^.]+$/,'')}${AU.list.length>1?`  (${AU.idx+1}/${AU.list.length})`:''}${/all$/.test(AU.slot||'')?' · all days':''}${(repOf(AU.kind)!==null&&repOf(AU.kind)!==1)?` · round ${AU.round}${repOf(AU.kind)?'/'+repOf(AU.kind):''}`:''}`:'Nothing loaded';
    }
  }
  document.querySelectorAll('#rnd').forEach(r=>{r.textContent=rndText()});
  document.querySelectorAll('.musb').forEach(b=>b.classList.toggle('on',!a.paused));
  const m=document.getElementById('mini');
  if(m){
    const show=tr&&(!a.paused)&&!(O);
    m.classList.toggle('show',!!show);
    if(show)m.innerHTML=`<span class="mt">🎧 ${esc(KIND_LABEL[AU.kind]||'')} · ${esc(tr.name.replace(/\.[^.]+$/,''))}</span><button id="mpp" aria-label="Pause">⏸</button><button id="mst" aria-label="Stop">✕</button>`;
  }
}
async function renderTrackList(){
  const box=document.getElementById('atl');if(!box)return;
  if(!AU.list.length){box.innerHTML='<p class="hint" style="margin:8px 10px">No songs yet. Add MP3, M4A, WAV or OGG files from your device.</p>';return}
  box.innerHTML=AU.list.map((t,k)=>`<div class="atr ${k===AU.idx?'cur':''}"><button data-pt="${k}">${k+1}. ${esc(t.name)} <small>${(t.size/1048576).toFixed(1)} MB</small></button><button data-dt="${k}" aria-label="Remove">✕</button></div>`).join('');
}
async function addFiles(files){
  const kind=AU.kind,slot=S.aall[kind]?allId(kind):slotId(kind,AU.day);
  const cur=(await IDB.get(slotKey(slot)))||[];
  let n=0;
  for(const f of files){
    if(!/^audio\//.test(f.type)&&!/\.(mp3|m4a|aac|wav|ogg|opus)$/i.test(f.name))continue;
    const id='a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    await IDB.set('blob:'+id,f);cur.push({id,name:f.name,size:f.size});n++;
  }
  await IDB.set(slotKey(slot),cur);
  if(!n){toast('Choose an audio file');return}
  toast(`${n} file${n>1?'s':''} added${AUDIO_OK?'':' (this session only)'}`);
  const day=AU.day;AU.el.pause();AU.kind=null;       // force a fresh load of the list
  await ensureAudio(day,kind);await loadTrack(Math.min(Math.max(0,AU.list.length-n),AU.list.length-1),false);renderTrackList();
}
function wireAudio(day,kind){
  const q=id=>document.getElementById(id);if(!q('aud')){return}
  const a=AU.el;
  ensureAudio(day,kind).then(()=>{renderTrackList()});
  q('apl').onclick=async()=>{
    if(!AU.list.length){q('afile').click();return}
    if(a.paused){try{await a.play()}catch(_){toast('Could not play this file')}}else a.pause();
  };
  q('ab10').onclick=()=>{a.currentTime=Math.max(0,a.currentTime-10)};
  q('af10').onclick=()=>{a.currentTime=Math.min(a.duration||1e9,a.currentTime+10)};
  q('aprev').onclick=()=>stepTrack(-1);q('anext').onclick=()=>stepTrack(1);
  const sk=q('asek');
  sk.oninput=()=>{sk._drag=true;if(a.duration)q('act').textContent=fmtT(sk.value/1000*a.duration)};
  sk.onchange=()=>{if(a.duration)a.currentTime=sk.value/1000*a.duration;sk._drag=false};
  const bind=(id,fn)=>{const e=q(id);if(e)e.oninput=()=>{fn(+e.value);fxLabels()}};
  bind('fxvol',v=>{S.fx.vol=v/100;fxApply();save()});
  bind('asp',v=>{S.arate=v;a.playbackRate=v;save()});
  bind('fxpan',v=>{S.fx.pan=v/100;fxApply();save()});
  bind('fxbass',v=>{S.fx.bass=v;fxApply();save()});
  bind('fxmid',v=>{S.fx.mid=v;fxApply();save()});
  bind('fxtreb',v=>{S.fx.treb=v;fxApply();save()});
  bind('fxwet',v=>{S.fx.wet=v/100;fxApply();save()});
  fxLabels();
  q('afxr').onclick=()=>{S.fx={vol:1,pan:0,bass:0,mid:0,treb:0,wet:0};S.arate=1;a.playbackRate=1;fxApply();save();
    const set={fxvol:100,asp:1,fxpan:0,fxbass:0,fxmid:0,fxtreb:0,fxwet:0};Object.keys(set).forEach(k=>q(k).value=set[k]);fxLabels();toast('Settings reset')};
  if(q('arm'))q('arm').onclick=()=>{S.arm=S.arm==='off'?'all':S.arm==='all'?'one':'off';S.aloop=S.arm==='all';save();q('arm').textContent='Repeat: '+S.arm};
  if(q('ash'))q('ash').onclick=()=>{S.ashuf=!S.ashuf;save();q('ash').textContent='Shuffle: '+(S.ashuf?'on':'off')};
  q('aclr').onclick=async()=>{
    if(!AU.list.length){toast('Nothing to clear');return}
    if(!confirm('Remove all songs in this list from this phone?'))return;
    const slot=AU.slot;for(const tr of AU.list)await IDB.del('blob:'+tr.id);await IDB.set(slotKey(slot),[]);
    a.pause();const dd=AU.day;AU.kind=null;a.removeAttribute('src');await ensureAudio(dd,kind);renderTrackList();refreshAudio();
  };
  if(q('arep'))q('arep').onchange=e=>{
    let v=e.target.value;
    if(v==='c'){const r=parseInt(prompt('How many rounds? (1–9999)',S.rep[kind]||11),10);if(!(r>0&&r<=9999)){e.target.value=String(S.rep[kind]);return}v=r}
    S.rep[kind]=+v;AU.round=1;AU.fin=false;save();
    if(![...e.target.options].some(o=>o.value===String(v))){const o=new Option(v,v);e.target.add(o,e.target.options[e.target.options.length-2])}
    e.target.value=String(v);refreshAudio();toast(+v?`${v} round${+v>1?'s':''}`:'Endless');
  };
  q('aall').onchange=()=>{S.aall[kind]=q('aall').checked;save();toast(S.aall[kind]?'New files will play on all days':'New files are for this day only')};
  q('aadd').onclick=()=>q('afile').click();
  q('afile').onchange=async e=>{const f=[...e.target.files];e.target.value='';if(f.length)await addFiles(f)};
  q('atl').onclick=async e=>{
    const p=e.target.closest('[data-pt]'),d=e.target.closest('[data-dt]');
    if(p){await loadTrack(+p.dataset.pt,true);renderTrackList()}
    if(d){
      const k=+d.dataset.dt,tr=AU.list[k];if(!tr||!confirm('Remove "'+tr.name+'" from this phone?'))return;
      const slot=AU.slot,l=((await IDB.get(slotKey(slot)))||[]).filter(t=>t.id!==tr.id);
      await IDB.del('blob:'+tr.id);await IDB.set(slotKey(slot),l);
      a.pause();const dd=AU.day;AU.kind=null;a.removeAttribute('src');
      await ensureAudio(dd,kind);renderTrackList();
    }
  };
  fxApply();refreshAudio();
}
document.addEventListener('click',e=>{
  if(e.target.closest('#mpp')){AU.el.pause();refreshAudio()}
  if(e.target.closest('#mst')){AU.el.pause();AU.el.currentTime=0;refreshAudio()}
});

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('button,summary');if(!t)return;
  const ds=t.dataset;
  if(ds.nav){setView(ds.nav);window.scrollTo(0,0);return}
  if(ds.day!=null){const c=$('#chips');render._cx=c?c.scrollLeft:null;V.sel=+ds.day;setView('today');render(true);return}
  if(ds.pick!=null){V.sel=+ds.pick;setView('today');render();window.scrollTo(0,0);return}
  if(ds.tab){V.tab=ds.tab;if(ds.tab==='m'||ds.tab==='e')V.slot=ds.tab;render(true);return}
  if(ds.mus){openMusic(O?O.i:V.sel,ds.mus);return}
  if(ds.edit!==undefined){V.edit=!V.edit;render(true);return}
  if(ds.mv){const[s,id,d]=ds.mv.split('|');const ids=items(V.sel,s).map(x=>x.id),k=ids.indexOf(id),j=k+(+d);if(k<0||j<0||j>=ids.length)return;[ids[k],ids[j]]=[ids[j],ids[k]];S.ord[s]=ids;save();render(true);return}
  if(ds.del){const[s,id]=ds.del.split('|');const c=(S.cust[s]||[]).find(x=>x.id===id);
    if(c){if(!confirm('Delete "'+c.t+'" for good?'))return;S.cust[s]=S.cust[s].filter(x=>x.id!==id);S.ord[s]=(S.ord[s]||[]).filter(x=>x!==id)}
    else{(S.hid[s]=S.hid[s]||[]).push(id)}
    save();render(true);toast(c?'Deleted':'Removed. You can restore it below.');return}
  if(ds.rest){const[s,id]=ds.rest.split('|');S.hid[s]=(S.hid[s]||[]).filter(x=>x!==id);save();render(true);return}
  if(ds.addblk){openEd(ds.addblk);return}
  if(ds.ced){const[s,id]=ds.ced.split('|');openEd(s,(S.cust[s]||[]).find(x=>x.id===id));return}
  if(ds.tog){const[s,id]=ds.tog.split('|');setDone(V.sel,s,id,!isDone(V.sel,s,id));buzz(10);render(true);return}
  if(ds.vow){const k=vowKey(V.sel,ds.vow);if(S.done[k])delete S.done[k];else S.done[k]=1;save();buzz(10);render(true);return}
  if(ds.open){const[s,k]=ds.open.split('|');openStep(items(V.sel,s),+k,V.sel,s,false);return}
  if(ds.guided){openStep(items(V.sel,ds.guided),+ds.from,V.sel,ds.guided,true);return}
  if(ds.nm){const k=`${V.sel}.${ds.nm}`;if(S.nm[k])delete S.nm[k];else S.nm[k]=1;save();buzz(10);
    if(O){const sc=$('#ovb').scrollTop;renderStep();$('#ovb').scrollTop=sc}else render(true);return}
  if(ds.namesaud!==undefined){const it=baseItems(V.sel,'e').find(x=>x.id==='nam');openStep([it],0,V.sel,'e',false);return}
  if(ds.pk){const k=ds.pk;if(S.pk[k])delete S.pk[k];else S.pk[k]=1;save();buzz(10);t.classList.toggle('done',!!S.pk[k]);t.querySelector('.bx').textContent=S.pk[k]?'✓':'';return}
  if(ds.pkreset!==undefined){S.pk={};save();render(true);return}
  if(ds.nv){S.nview=ds.nv;save();if(O){const sc=$('#ovb').scrollTop;renderStep();$('#ovb').scrollTop=sc}else render(true);return}
  if(ds.namesfull!==undefined){const it=baseItems(V.sel,'e').find(x=>x.id==='nam');openStep([it],0,V.sel,'e',false);O.full=true;renderStep();enterFull();return}
  if(ds.nmreset!==undefined){Object.keys(S.nm).forEach(k=>{if(k.startsWith(V.sel+'.'))delete S.nm[k]});save();render(true);return}
  if(ds.set){const[k,v]=ds.set.split('|');S[k]=v;save();render(true);return}
  if(ds.fs){S.fs=Math.max(.85,Math.min(1.4,+(S.fs+.08*ds.fs).toFixed(2)));save();render(true);return}
  if(ds.rom!==undefined){S.rom=!S.rom;save();render(true);return}
  if(ds.ksh!==undefined){openStep([{id:'ksh',t:'Aparadh Kshama Stotram',hi:'अपराधक्षमापणस्तोत्रम्',ty:'read',kind:'kshama',blocks:()=>kshamaBlocks()}],0,V.sel,'e',false);return}
  if(ds.refresh!==undefined){fetchSrc('gan');fetchSrc('san');fetchSrc('nam');fetchSrc('puj');fetchSrc('cha');fetchSrc('nms');fetchSrc('nme');prefetchCh();render(true);toast('Refreshing…');return}
  if(ds.reset!==undefined){if(confirm('Clear all ticks, counts and notes?')){S.done={};S.cnt={};S.note={};S.nm={};save();render(true);toast('Cleared')}return}
});
document.addEventListener('change',ev=>{
  if(ev.target.id==='startd'&&ev.target.value){S.start=ev.target.value;save();V.sel=clamp(todayIdx());render(true);toast('Day 1 set to '+fmtD(pd(S.start),{day:'numeric',month:'short',year:'numeric'}))}
});
matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>render(true));
render();
prefetchCh();
</script>
