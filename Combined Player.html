<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Joy Media Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  body {
    background-color: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    margin: 0;
    overflow-x: hidden;
  }

  /* --- Top Tabs --- */
  #tabBar {
    display: flex;
    justify-content: center;
    align-items: center;
    background: #111;
    border-bottom: 1px solid #333;
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 1000;
  }

  .tab {
    flex: 1;
    padding: 12px 0;
    text-align: center;
    font-size: 1.6em;
    cursor: pointer;
    background: #111;
    color: #888;
    border: none;
    outline: none;
    transition: 0.3s;
  }

  .tab.active {
    background: #222;
    color: #0f0;
  }

  /* --- Container --- */
  .tabContent {
    display: none;
    padding-top: 60px;
  }

  .tabContent.active {
    display: block;
  }

  /* --- MP3 Player styles --- */
  #mp3Player {
    text-align: center;
    padding: 20px;
  }

  input,
  select {
    font-size: 1em;
    padding: 8px;
    margin: 8px;
    background: #222;
    color: #fff;
    border: 1px solid #555;
    border-radius: 5px;
  }

  button {
    font-size: 1em;
    padding: 8px 16px;
    margin: 10px;
    background: #0f0;
    color: #000;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }

  label {
    display: block;
    margin-top: 12px;
    font-weight: bold;
  }

  #sliders input {
    width: 90%;
  }

  /* Playlist styles - NEW but preserving all original visuals */
  .playlist-section {
    margin: 20px auto;
    width: 95%;
    max-width: 600px;
    background: #1a1a1a;
    border-radius: 12px;
    padding: 12px;
    border: 1px solid #333;
  }

  .playlist-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 12px;
  }

  .folder-input-wrapper {
    position: relative;
    display: inline-block;
  }

  .folder-input-wrapper input {
    position: absolute;
    opacity: 0;
    width: 100%;
    height: 100%;
    left: 0;
    top: 0;
    cursor: pointer;
  }

  .folder-btn {
    background: #2a6f3f;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 0.9em;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .playlist-info {
    font-size: 0.85em;
    color: #aaa;
    background: #222;
    padding: 6px 12px;
    border-radius: 20px;
  }

  .playlist-queue {
    max-height: 180px;
    overflow-y: auto;
    background: #0f0f0f;
    border-radius: 8px;
    margin-top: 10px;
    text-align: left;
  }

  .playlist-item {
    padding: 8px 12px;
    border-bottom: 1px solid #333;
    font-size: 0.85em;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    transition: 0.2s;
  }

  .playlist-item:hover {
    background: #2a2a2a;
  }

  .playlist-item.active-track {
    background: #2a6f3f;
    color: white;
    font-weight: bold;
  }

  .playlist-item .track-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }

  .playlist-item .track-index {
    margin-right: 10px;
    color: #88ff88;
    font-weight: normal;
  }

  .now-playing-badge {
    font-size: 0.8em;
    background: #0f0;
    color: #000;
    padding: 2px 8px;
    border-radius: 12px;
    margin-left: 8px;
  }

  /* Video player styles unchanged */
  #videoContainer {
    position: relative;
    width: 100%;
    height: 90vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
  }

  video {
    width: 100%;
    height: 100%;
    background: #000;
  }

  #topBar {
    position: fixed;
    top: 60px;
    left: 0;
    width: 100%;
    padding: 8px;
    background: #111;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 999;
  }

  #settingsPanel {
    position: fixed;
    top: 110px;
    left: 10px;
    background: #111;
    padding: 15px;
    border: 1px solid #444;
    border-radius: 5px;
    display: none;
    max-height: 70vh;
    overflow-y: auto;
    z-index: 999;
  }

  .file-group {
    margin-bottom: 10px;
  }

  /* NEW: Repeat slider styles */
  .repeat-slider-container {
    position: relative;
    width: 90%;
    max-width: 600px;
    margin: 10px auto;
    background: #1a1a1a;
    border-radius: 8px;
    padding: 15px;
    border: 1px solid #333;
  }

  .repeat-slider-container label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 0;
    margin-bottom: 10px;
    font-size: 0.9em;
    color: #88ff88;
  }

  .repeat-slider-wrapper {
    position: relative;
    height: 30px;
    background: #2a2a2a;
    border-radius: 4px;
    cursor: pointer;
    margin: 5px 0;
  }

  .repeat-slider-wrapper .progress-track {
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    height: 4px;
    width: 100%;
    background: #444;
    border-radius: 2px;
  }

  .repeat-slider-wrapper .progress-fill {
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    height: 4px;
    background: #0f0;
    border-radius: 2px;
    width: 0%;
  }

  .repeat-slider-wrapper .repeat-range {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    height: 20px;
    background: rgba(0, 255, 0, 0.2);
    border: 2px solid #0f0;
    border-radius: 4px;
    pointer-events: none;
    display: none;
  }

  .repeat-slider-wrapper .handle {
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 16px;
    height: 16px;
    background: #0f0;
    border-radius: 50%;
    cursor: pointer;
    z-index: 10;
    display: none;
    border: 2px solid #fff;
    box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
  }

  .repeat-slider-wrapper .handle.start-handle {
    background: #00ff88;
    display: block;
  }

  .repeat-slider-wrapper .handle.end-handle {
    background: #ff8800;
    display: block;
  }

  .repeat-slider-wrapper .handle.active {
    box-shadow: 0 0 20px rgba(0, 255, 0, 0.8);
  }

  .repeat-time-display {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 0.8em;
    color: #aaa;
  }

  .repeat-time-display span {
    background: #222;
    padding: 2px 8px;
    border-radius: 4px;
  }

  /* NEW: Enhanced time display with milliseconds */
  .repeat-time-display-ms {
    display: flex;
    justify-content: space-between;
    margin-top: 4px;
    font-size: 0.65em;
    color: #666;
    font-family: 'Courier New', monospace;
    letter-spacing: 0.5px;
  }

  .repeat-time-display-ms span {
    background: #1a1a1a;
    padding: 2px 6px;
    border-radius: 3px;
    border: 1px solid #333;
  }

  .repeat-time-display-ms .time-ms-current {
    color: #0f0;
  }

  .repeat-time-display-ms .time-ms-total {
    color: #ff8800;
  }

  /* NEW: Editable time input fields */
  .editable-time-group {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .editable-time-field {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #1a1a1a;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid #333;
  }

  .editable-time-field label {
    margin: 0;
    font-size: 0.7em;
    color: #888;
    font-weight: normal;
  }

  .editable-time-field input {
    background: #222;
    color: #0f0;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 2px 6px;
    font-size: 0.85em;
    width: 70px;
    text-align: center;
    font-family: 'Courier New', monospace;
    transition: border-color 0.3s;
  }

  .editable-time-field input:focus {
    border-color: #0f0;
    outline: none;
    box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
  }

  .editable-time-field input.start-input {
    color: #00ff88;
  }

  .editable-time-field input.end-input {
    color: #ff8800;
  }

  .editable-time-field .time-unit {
    font-size: 0.7em;
    color: #666;
  }

  .repeat-controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .repeat-controls button {
    padding: 6px 14px;
    font-size: 0.85em;
    margin: 0;
  }

  .btn-enabled {
    background: #0f0;
    color: #000;
  }

  .btn-disabled {
    background: #444;
    color: #888;
  }

  /* NEW: Time adjustment buttons */
  .time-adjust-group {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #222;
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid #444;
  }

  .time-adjust-group label {
    margin: 0;
    font-size: 0.8em;
    color: #aaa;
    font-weight: normal;
  }

  .time-adjust-group .time-value {
    min-width: 50px;
    text-align: center;
    font-weight: bold;
    color: #0f0;
    font-size: 0.9em;
  }

  .time-adjust-btn {
    background: #333;
    color: #fff;
    border: 1px solid #555;
    padding: 2px 10px;
    margin: 0;
    font-size: 0.9em;
    border-radius: 4px;
    cursor: pointer;
    min-width: 28px;
    transition: 0.2s;
  }

  .time-adjust-btn:hover {
    background: #555;
  }

  .time-adjust-btn:active {
    background: #0f0;
    color: #000;
  }

  .time-adjust-btn.up-btn {
    color: #0f0;
  }

  .time-adjust-btn.down-btn {
    color: #ff8800;
  }

  .time-adjust-group-small {
    display: flex;
    gap: 3px;
    align-items: center;
  }

  .time-adjust-group-small .time-adjust-btn {
    padding: 2px 6px;
    font-size: 0.7em;
    min-width: 20px;
  }

  /* NEW: Download button style */
  .download-btn {
    background: #ff6600;
    color: white;
    font-weight: bold;
    padding: 8px 20px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: 0.3s;
    font-size: 0.9em;
  }

  .download-btn:hover {
    background: #ff8800;
    transform: scale(1.05);
  }

  .download-btn:disabled {
    background: #444;
    color: #666;
    cursor: not-allowed;
    transform: none;
  }

  .download-btn.downloading {
    background: #ff3300;
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.6; }
    100% { opacity: 1; }
  }
</style>
</head>
<body>

<!-- Tabs -->
<div id="tabBar">
  <button class="tab active" onclick="openTab('mp3')">🎧</button>
  <button class="tab" onclick="openTab('video')">🎬</button>
</div>

<!-- MP3 Player -->
<div id="mp3" class="tabContent active">
  <div id="mp3Player">
    <h2>🎧 Joy Audio Player</h2>
    <input type="file" id="audioFile" accept="audio/*"><br>
    
    <!-- NEW: Folder selection & playlist area - seamlessly integrated without removing any existing features -->
    <div class="playlist-section">
      <div class="playlist-header">
        <div class="folder-input-wrapper">
          <button class="folder-btn" id="folderSelectBtn">📁 Select Folder (MP3 Playlist)</button>
          <input type="file" id="folderInput" webkitdirectory directory multiple accept="audio/mpeg,audio/mp3,audio/*">
        </div>
        <div class="playlist-info" id="playlistStats">No folder selected</div>
        <button id="clearPlaylistBtn" style="background:#444; color:white; padding:6px 12px;">🗑 Clear</button>
      </div>
      <div id="playlistQueue" class="playlist-queue">
        <div style="padding:12px; text-align:center; color:#666;">Select a folder with MP3 files</div>
      </div>
    </div>

    <audio id="audio" controls></audio><br>

    <!-- NEW: Repeat Slider Section with Time Adjustment -->
    <div class="repeat-slider-container" id="repeatSliderContainer">
      <label>
        <span>🔁 A-B Repeat</span>
        <span>
          <span id="repeatStartDisplay">0.0</span>s → <span id="repeatEndDisplay">0.0</span>s
        </span>
      </label>
      
      <div class="repeat-slider-wrapper" id="repeatSliderWrapper">
        <div class="progress-track"></div>
        <div class="progress-fill" id="repeatProgressFill"></div>
        <div class="repeat-range" id="repeatRange"></div>
        <div class="handle start-handle" id="startHandle"></div>
        <div class="handle end-handle" id="endHandle"></div>
      </div>
      
      <!-- ENHANCED: Time display with seconds and milliseconds -->
      <div class="repeat-time-display">
        <span id="currentTimeDisplay">0:00</span>
        <span id="totalTimeDisplay">0:00</span>
      </div>
      
      <!-- NEW: Milliseconds display -->
      <div class="repeat-time-display-ms">
        <span class="time-ms-current" id="currentTimeMs">00:000</span>
        <span class="time-ms-total" id="totalTimeMs">00:000</span>
      </div>
      
      <!-- NEW: Editable time fields -->
      <div class="editable-time-group">
        <div class="editable-time-field">
          <label>Start:</label>
          <input type="number" id="startTimeInput" class="start-input" step="0.01" min="0" value="0">
          <span class="time-unit">sec</span>
        </div>
        <div class="editable-time-field">
          <label>End:</label>
          <input type="number" id="endTimeInput" class="end-input" step="0.01" min="0" value="0">
          <span class="time-unit">sec</span>
        </div>
      </div>
      
      <!-- NEW: Time adjustment controls -->
      <div style="display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-top: 10px;">
        <!-- Start Time Adjustment -->
        <div class="time-adjust-group">
          <label>Start:</label>
          <span class="time-value" id="startTimeValue">0.0s</span>
          <div class="time-adjust-group-small">
            <button class="time-adjust-btn up-btn" id="startUpSmall" title="+0.1s">▲</button>
            <button class="time-adjust-btn down-btn" id="startDownSmall" title="-0.1s">▼</button>
          </div>
          <div class="time-adjust-group-small">
            <button class="time-adjust-btn up-btn" id="startUpLarge" title="+1.0s">▲▲</button>
            <button class="time-adjust-btn down-btn" id="startDownLarge" title="-1.0s">▼▼</button>
          </div>
        </div>
        
        <!-- End Time Adjustment -->
        <div class="time-adjust-group">
          <label>End:</label>
          <span class="time-value" id="endTimeValue">0.0s</span>
          <div class="time-adjust-group-small">
            <button class="time-adjust-btn up-btn" id="endUpSmall" title="+0.1s">▲</button>
            <button class="time-adjust-btn down-btn" id="endDownSmall" title="-0.1s">▼</button>
          </div>
          <div class="time-adjust-group-small">
            <button class="time-adjust-btn up-btn" id="endUpLarge" title="+1.0s">▲▲</button>
            <button class="time-adjust-btn down-btn" id="endDownLarge" title="-1.0s">▼▼</button>
          </div>
        </div>
      </div>
      
      <div class="repeat-controls">
        <button id="toggleRepeatSliderBtn" class="btn-disabled">⏸ A-B Repeat Off</button>
        <button id="clearRepeatBtn" class="btn-disabled" style="background:#555; color:#aaa;">✖ Clear Points</button>
        <!-- NEW: Download MP3 button -->
        <button id="downloadMp3Btn" class="download-btn" disabled>⬇ Download Selection as MP3</button>
      </div>
    </div>

    <div id="sliders">
      <label>Playback Speed</label>
      <input type="range" min="0.5" max="2.0" step="0.1" id="speedSlider" value="1.0">

      <label>Bass</label>
      <input type="range" min="-40" max="40" value="0" id="bass">

      <label>Mid</label>
      <input type="range" min="-40" max="40" value="0" id="mid">

      <label>Treble</label>
      <input type="range" min="-40" max="40" value="0" id="treble">

      <label>Volume</label>
      <input type="range" min="0" max="1" step="0.01" id="volumeSlider" value=".1">

      <label>Stereo Pan</label>
      <input type="range" min="-1" max="1" step="0.01" id="panSlider" value="0">

      <label>Reverb Wet/Dry Mix</label>
      <input type="range" min="0" max="1" step="0.01" id="reverbSlider" value="0.5">

      <label>Progress</label>
      <input type="range" min="0" max="100" value="0" id="progressBar">
    </div>

    <label>Loop from (sec)</label>
    <input type="number" id="loopStart" value="0">
    <label>to (sec)</label>
    <input type="number" id="loopEnd" value="0">
    <button onclick="toggleLoop()">🔁 A→B Loop</button>
    <button onclick="toggleRepeat()">🔂 Repeat Entire Track</button>
  </div>
</div>

<!-- Video Player -->
<div id="video" class="tabContent">
  <div id="topBar">
    <button onclick="toggleSettings()">⚙️</button>
    <div>
      <button onclick="startPlayback()">▶️</button>
      <button onclick="enterFullscreen()">🖵</button>
    </div>
  </div>

  <div id="settingsPanel">
    <h3>Video Selection</h3>
    <div id="selectors"></div>
  </div>

  <div id="videoContainer">
    <video id="videoPlayer" controls></video>
  </div>
</div>

<script>
  // --- Tab Switch ---
  function openTab(tabName) {
    document.querySelectorAll(".tabContent").forEach(div => div.classList.remove("active"));
    document.querySelectorAll(".tab").forEach(btn => btn.classList.remove("active"));
    document.getElementById(tabName).classList.add("active");
    event.currentTarget.classList.add("active");
  }

  /* ---------------- AUDIO PLAYER JS (with full playlist support) ---------------- */
  const audio = document.getElementById("audio");
  const audioFile = document.getElementById("audioFile");
  const speedSlider = document.getElementById("speedSlider");
  const volumeSlider = document.getElementById("volumeSlider");
  const progressBar = document.getElementById("progressBar");
  const loopStart = document.getElementById("loopStart");
  const loopEnd = document.getElementById("loopEnd");
  const bassSlider = document.getElementById("bass");
  const midSlider = document.getElementById("mid");
  const trebleSlider = document.getElementById("treble");
  const panSlider = document.getElementById("panSlider");
  const reverbSlider = document.getElementById("reverbSlider");

  let loopEnabled = false;
  let repeatEnabled = false;
  let audioCtx, sourceNode, bassEQ, midEQ, trebleEQ, gainNode, compressor, panner, convolver, dryGain, wetGain;

  // ==================== NEW REPEAT SLIDER VARIABLES ====================
  let repeatStartTime = 0;
  let repeatEndTime = 0;
  let repeatSliderEnabled = false;
  let isDraggingStart = false;
  let isDraggingEnd = false;
  const repeatSliderWrapper = document.getElementById('repeatSliderWrapper');
  const startHandle = document.getElementById('startHandle');
  const endHandle = document.getElementById('endHandle');
  const repeatRange = document.getElementById('repeatRange');
  const repeatStartDisplay = document.getElementById('repeatStartDisplay');
  const repeatEndDisplay = document.getElementById('repeatEndDisplay');
  const currentTimeDisplay = document.getElementById('currentTimeDisplay');
  const totalTimeDisplay = document.getElementById('totalTimeDisplay');
  const toggleRepeatSliderBtn = document.getElementById('toggleRepeatSliderBtn');
  const clearRepeatBtn = document.getElementById('clearRepeatBtn');
  const repeatProgressFill = document.getElementById('repeatProgressFill');
  
  // NEW: Milliseconds display elements
  const currentTimeMs = document.getElementById('currentTimeMs');
  const totalTimeMs = document.getElementById('totalTimeMs');
  
  // NEW: Time display elements for adjustment
  const startTimeValue = document.getElementById('startTimeValue');
  const endTimeValue = document.getElementById('endTimeValue');

  // NEW: Editable time input fields
  const startTimeInput = document.getElementById('startTimeInput');
  const endTimeInput = document.getElementById('endTimeInput');

  // NEW: Download button
  const downloadMp3Btn = document.getElementById('downloadMp3Btn');

  // ==================== NEW PLAYLIST VARIABLES ====================
  let playlist = [];           // Array of {name, url, file}
  let currentTrackIndex = -1;
  let isPlayingFromPlaylist = false;
  let originalOnEndedHandler = null;
  let currentAudioSrc = null;  // to revoke object URLs when needed

  // DOM elements for playlist
  const folderInput = document.getElementById("folderInput");
  const playlistQueueDiv = document.getElementById("playlistQueue");
  const playlistStats = document.getElementById("playlistStats");
  const clearPlaylistBtn = document.getElementById("clearPlaylistBtn");

  // Helper: update playlist UI
  function renderPlaylist() {
    if (!playlistQueueDiv) return;
    if (playlist.length === 0) {
      playlistQueueDiv.innerHTML = '<div style="padding:12px; text-align:center; color:#666;">📂 No MP3 files. Select a folder above.</div>';
      playlistStats.innerText = "No tracks";
      return;
    }
    
    let html = '';
    playlist.forEach((track, idx) => {
      const isActive = (isPlayingFromPlaylist && currentTrackIndex === idx);
      const activeClass = isActive ? 'active-track' : '';
      const nowPlayingMarker = isActive ? '<span class="now-playing-badge">▶️</span>' : '';
      html += `
        <div class="playlist-item ${activeClass}" data-index="${idx}">
          <span class="track-index">${idx+1}.</span>
          <span class="track-name" title="${escapeHtml(track.name)}">${escapeHtml(track.name)}</span>
          ${nowPlayingMarker}
        </div>
      `;
    });
    playlistQueueDiv.innerHTML = html;
    playlistStats.innerText = `${playlist.length} MP3 file(s)`;
    
    // Add click event listeners to playlist items
    document.querySelectorAll('.playlist-item').forEach(item => {
      item.addEventListener('click', (e) => {
        const index = parseInt(item.dataset.index);
        if (!isNaN(index) && index >= 0 && index < playlist.length) {
          playTrackFromPlaylist(index);
        }
      });
    });
  }
  
  // Helper to escape HTML
  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

      const startSample = Math.floor(repeatStartTime * audioBuffer.sampleRate);
      const endSample = Math.floor(repeatEndTime * audioBuffer.sampleRate);
      const durationSamples = endSample - startSample;
      
      // Create a new buffer for the selected portion
      const newBuffer = tempCtx.createBuffer(
        audioBuffer.numberOfChannels,
        durationSamples,
        audioBuffer.sampleRate
      );
      
      // Copy the selected portion from the original buffer
      for (let channel = 0; channel < audioBuffer.numberOfChannels; channel++) {
        const originalData = audioBuffer.getChannelData(channel);
        const newData = newBuffer.getChannelData(channel);
        for (let i = 0; i < durationSamples; i++) {
          newData[i] = originalData[startSample + i];
        }
      }
      
      // Create WAV file from the buffer
      const wavBlob = audioBufferToWav(newBuffer);
      
      // Create download link
      const url = URL.createObjectURL(wavBlob);
      const a = document.createElement('a');
      a.href = url;
      const fileName = `selection_${repeatStartTime.toFixed(1)}s_to_${repeatEndTime.toFixed(1)}s.wav`;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      
      // Clean up
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      
      downloadMp3Btn.textContent = '✅ Downloaded!';
      setTimeout(() => {
        downloadMp3Btn.textContent = '⬇ Download Selection as MP3';
        downloadMp3Btn.className = 'download-btn';
        downloadMp3Btn.disabled = false;
      }, 2000);
      
    } catch (error) {
      console.error('Download error:', error);
      alert('Error downloading selection: ' + error.message);
      downloadMp3Btn.textContent = '⬇ Download Selection as MP3';
      downloadMp3Btn.className = 'download-btn';
      downloadMp3Btn.disabled = false;
    }
  });
  
  // Helper function to convert AudioBuffer to WAV Blob
  function audioBufferToWav(buffer) {
    const numChannels = buffer.numberOfChannels;
    const sampleRate = buffer.sampleRate;
    const length = buffer.length * numChannels * 2;
    const data = new DataView(new ArrayBuffer(44 + length));
    
    // Write WAV header
    // "RIFF" chunk
    writeString(data, 0, 'RIFF');
    data.setUint32(4, 36 + length, true);
    writeString(data, 8, 'WAVE');
    
    // "fmt " chunk
    writeString(data, 12, 'fmt ');
    data.setUint32(16, 16, true);
    data.setUint16(20, 1, true); // PCM
    data.setUint16(22, numChannels, true);
    data.setUint32(24, sampleRate, true);
    data.setUint32(28, sampleRate * numChannels * 2, true);
    data.setUint16(32, numChannels * 2, true);
    data.setUint16(34, 16, true);
    
    // "data" chunk
    writeString(data, 36, 'data');
    data.setUint32(40, length, true);
    
    // Write audio data
    let offset = 44;
    for (let i = 0; i < buffer.length; i++) {
      for (let channel = 0; channel < numChannels; channel++) {
        const sample = Math.max(-1, Math.min(1, buffer.getChannelData(channel)[i]));
        const int16 = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
        data.setInt16(offset, int16, true);
        offset += 2;
      }
    }
    
    return new Blob([data], { type: 'audio/wav' });
  }
  
  function writeString(data, offset, string) {
    for (let i = 0; i < string.length; i++) {
      data.setUint8(offset + i, string.charCodeAt(i));
    }
  }

  // Override the existing ontimeupdate to include repeat slider functionality
  const originalTimeUpdate = audio.ontimeupdate;
  audio.ontimeupdate = function() {
    // Call original if exists
    if (originalTimeUpdate) originalTimeUpdate.call(audio);
    
    // Update slider UI
    updateRepeatSlider();
    
    // Handle repeat slider loop
    if (repeatSliderEnabled && repeatStartTime < repeatEndTime) {
      const currentTime = audio.currentTime;
      if (currentTime >= repeatEndTime) {
        audio.currentTime = repeatStartTime;
        audio.play();
      }
    }
  };

  // Update total time when audio metadata loads
  audio.addEventListener('loadedmetadata', () => {
    updateRepeatSlider();
  });

  // Auto-update when time updates
  audio.addEventListener('timeupdate', () => {
    updateRepeatSlider();
  });

  // Initialize repeat slider
  setTimeout(updateRepeatSlider, 100);

  /* ---------------- VIDEO PLAYER JS (Unchanged) ---------------- */
  const MAX_VIDEOS = 10;
  const selectorsDiv = document.getElementById("selectors");
  const videoPlayer = document.getElementById("videoPlayer");
  let videoList = [];

  for (let i = 1; i <= MAX_VIDEOS; i++) {
    const group = document.createElement("div");
    group.classList.add("file-group");
    group.innerHTML = `
      <label>Video ${i}</label><br>
      <input type="file" id="file${i}" accept="video/mp4"><br>
      <input type="number" id="repeat${i}" min="1" value="1" placeholder="Repeat count">
    `;
    selectorsDiv.appendChild(group);
  }

  function toggleSettings() {
    const panel = document.getElementById("settingsPanel");
    panel.style.display = panel.style.display === "none" ? "block" : "none";
  }

  function startPlayback() {
    videoList = [];
    for (let i = 1; i <= MAX_VIDEOS; i++) {
      const fileInput = document.getElementById(`file${i}`);
      const repeatInput = document.getElementById(`repeat${i}`);
      const file = fileInput.files[0];
      const repeat = parseInt(repeatInput.value) || 1;
      if (file) for (let r = 0; r < repeat; r++) videoList.push(URL.createObjectURL(file));
    }
    if (videoList.length === 0) return alert("No videos selected.");
    playNextVideo(0);
  }

  function playNextVideo(index) {
    if (index >= videoList.length) return;
    videoPlayer.src = videoList[index];
    videoPlayer.load(); videoPlayer.play();
    videoPlayer.onended = () => playNextVideo(index + 1);
  }

  function enterFullscreen() {
    const vid = videoPlayer;
    if (vid.requestFullscreen) vid.requestFullscreen();
    else if (vid.webkitRequestFullscreen) vid.webkitRequestFullscreen();
    else if (vid.msRequestFullscreen) vid.msRequestFullscreen();
  }
</script>
